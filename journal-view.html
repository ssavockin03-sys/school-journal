.marks-table thead .col-qtr { background: #E8EEF5 !important; color: #334155 !important; font-weight: 600 !important; font-size: 11px !important; vertical-align: middle !important; height: 76px; line-height: 74px; padding: 0 4px; }

.panel-right-wrapper { flex: 9; min-width: 0; max-width: 100%; }

.lesson-date-cell { font-weight: 600; background: #FFFFFF !important; vertical-align: middle !important; color: #0EA5E9; font-size: 12px; text-align: center !important; height: 63px; padding: 0 !important; }
.text-area-input { width: 100%; height: 61px; border: 1px solid transparent; background: transparent; font-size: 13px; padding: 7px 10px; resize: none; text-align: left; cursor: pointer; color: #334155; line-height: 1.4; font-family: inherit; outline: none; border-radius: 4px; box-sizing: border-box; display: block; overflow: hidden; word-wrap: break-word; white-space: pre-wrap; }

.btn-online-inline { position: absolute; bottom: 3px; right: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 6px; color: #7C3AED; font-size: 10px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; z-index: 2; opacity: 0.85; }

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}
function formatShortName(fullName) {
    if (!fullName) return '';
    const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '';
    if (parts.length === 1) return parts[0];
    return `${parts[0]} ${parts[1]}`;
}
function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return { classId: params.get('class'), subjectId: params.get('subject') };
}

let CLASS_ID = null;
let SUBJECT_ID = null;
let CLASS_OBJ = null;
let SUBJECT_OBJ = null;
let SUBJECT_NAME = '';
let TEACHER_NAME = '';
let STUDENTS = [];
let DATES = [];
let ACTIVE_PERIOD_INDEX = 0;
let PERIODS = [];
let PERIOD_SYSTEM = '';
let JOURNAL = null;
let ALL_CLASSES = [];
let ALL_CLASS_SUBJECTS = [];
let ALL_SCHEDULES = [];

let leftCollapsed = false;
let rightCollapsed = false;

let toastTimer = null;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
    }, 2500);
}

function collectSubjectsFromSchedule(schedules, classId) {
    const map = new Map();
    schedules
        .filter(s => s.class_id === classId && s.grid)
        .forEach(s => {
            Object.values(s.grid).forEach(dayGrid => {
                Object.values(dayGrid || {}).forEach(lesson => {
                    if (!lesson || !lesson.subject) return;
                    if (!map.has(lesson.subject)) {
                        map.set(lesson.subject, {
                            name: lesson.subject,
                            teacherName: lesson.teacherName || ''
                        });
                    } else if (!map.get(lesson.subject).teacherName && lesson.teacherName) {
                        map.get(lesson.subject).teacherName = lesson.teacherName;
                    }
                });
            });
        });
    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

async function init() {
    const { classId, subjectId } = getUrlParams();

    if (!classId || !subjectId) {
        showEmpty('Не заданы параметры', 'В URL отсутствуют параметры class и subject.');
        return;
    }

    CLASS_ID = classId;
    SUBJECT_ID = subjectId;

    const classes = await DB.getAll('classes');
    ALL_CLASSES = classes;
    CLASS_OBJ = classes.find(c => c.id === CLASS_ID);
    if (!CLASS_OBJ) {
        showEmpty('Класс не найден', 'В базе данных нет класса с указанным ID.');
        return;
    }

    const subjects = await DB.getAll('subjects');
    SUBJECT_OBJ = subjects.find(s => s.id === SUBJECT_ID);
    if (!SUBJECT_OBJ) {
        showEmpty('Предмет не найден', 'В базе данных нет предмета с указанным ID.');
        return;
    }
    SUBJECT_NAME = SUBJECT_OBJ.name;

    ALL_SCHEDULES = await DB.getAll('class_schedules');

    const classSubjects = collectSubjectsFromSchedule(ALL_SCHEDULES, CLASS_ID);
    const matched = classSubjects.find(s => s.name === SUBJECT_NAME);
    if (matched) TEACHER_NAME = matched.teacherName || '';

    ALL_CLASS_SUBJECTS = [];
    classSubjects.forEach(cs => {
        const subjObj = subjects.find(s => s.name === cs.name);
        if (subjObj) ALL_CLASS_SUBJECTS.push({ id: subjObj.id, name: cs.name });
    });

    const allStudents = await DB.getAll('students');
    STUDENTS = allStudents
        .filter(s => s.class_id === CLASS_ID)
        .sort((a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'ru'));

    const periodDocs = await DB.getAll('educational_periods');
    const periodDoc = periodDocs[0] || null;
    PERIODS = periodDoc ? (periodDoc.periods || []) : [];
    PERIOD_SYSTEM = periodDoc ? (periodDoc.system || '') : '';

    const journalRecord = await DB.getJournal(CLASS_ID, SUBJECT_ID);
    if (journalRecord) {
        JOURNAL = {
            grades: journalRecord.grades || {},
            lessons: journalRecord.lessons || {},
            qtrGrades: journalRecord.qtr_grades || {},
            lessonTypes: journalRecord.lesson_types || {}
        };
    } else {
        JOURNAL = { grades: {}, lessons: {}, qtrGrades: {}, lessonTypes: {} };
    }

    ACTIVE_PERIOD_INDEX = findActivePeriodIndex();

    renderHeader();
    renderPeriodTabs();

    if (STUDENTS.length === 0) {
        showEmpty('В классе нет учеников', 'Добавьте учеников в этот класс через панель администратора.');
        return;
    }

    DATES = await buildDatesForPeriod(ACTIVE_PERIOD_INDEX);

    if (DATES.length === 0) {
        showEmpty('Нет уроков в периоде', 'По расписанию в выбранном периоде нет уроков по этому предмету.');
        return;
    }

    renderMainTable();
    document.title = `${CLASS_OBJ.name} · ${SUBJECT_NAME} — Журнал`;
}

function findActivePeriodIndex() {
    if (PERIODS.length === 0) return 0;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (let i = 0; i < PERIODS.length; i++) {
        const per = PERIODS[i];
        const start = new Date(per.start + 'T00:00:00');
        const end = new Date(per.end + 'T23:59:59');
        if (today >= start && today <= end) return i;
    }
    return 0;
}

async function buildDatesForPeriod(periodIndex) {
    if (PERIODS.length === 0) return [];
    const subPeriod = PERIODS[periodIndex];
    if (!subPeriod) return [];

    const schedules = ALL_SCHEDULES;

    let classSchedule = schedules.find(s =>
        s.class_id === CLASS_ID && s.period_index === periodIndex
    );

    if (!classSchedule && periodIndex === 0) {
        classSchedule = schedules.find(s =>
            s.class_id === CLASS_ID && s.period_index === undefined
        );
    }

    if (!classSchedule || !classSchedule.grid) return [];

    const grid = classSchedule.grid;
    const result = [];
    const seen = new Set();

    const start = new Date(subPeriod.start + 'T00:00:00');
    const end = new Date(subPeriod.end + 'T23:59:59');
    const cursor = new Date(start);

    while (cursor <= end) {
        const jsDay = cursor.getDay();
        const dayKey = DAYS_KEYS.find(k => DAYS_JS_INDEX[k] === jsDay);

        if (dayKey && grid[dayKey]) {
            Object.keys(grid[dayKey]).forEach(lessonNumStr => {
                const lesson = grid[dayKey][lessonNumStr];
                if (lesson && lesson.subject === SUBJECT_NAME) {
                    const iso = formatIso(cursor);
                    const key = iso + '_' + lessonNumStr;
                    if (!seen.has(key)) {
                        seen.add(key);
                        result.push({
                            iso: iso,
                            dateNoYear: formatDateNoYear(cursor),
                            dateFull: formatDateFull(cursor),
                            dayKey: dayKey,
                            lessonNum: parseInt(lessonNumStr, 10),
                            gradeKey: key
                        });
                    }
                }
            });
        }
        cursor.setDate(cursor.getDate() + 1);
    }

    result.sort((a, b) => {
        if (a.iso !== b.iso) return a.iso.localeCompare(b.iso);
        return a.lessonNum - b.lessonNum;
    });
    return result;
}

function formatIso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function formatDateNoYear(d) {
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function formatDateFull(d) {
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
}

function renderHeader() {
    document.getElementById('classDropdownName').textContent = CLASS_OBJ.name;
    document.getElementById('subjectDropdownName').textContent = SUBJECT_NAME;
    document.getElementById('teacherLabel').textContent = 'Учитель: ' + (TEACHER_NAME || '—');
    document.getElementById('navChain').textContent = `${CLASS_OBJ.name}, ${SUBJECT_NAME}`;
    document.getElementById('yearLabel').textContent = '2026/2027 учебный год';
    renderClassDropdownMenu();
    renderSubjectDropdownMenu();
}

function renderClassDropdownMenu() {
    const menu = document.getElementById('classDropdownMenu');
    menu.innerHTML = '';
    ALL_CLASSES.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-menu-item' + (c.id === CLASS_ID ? ' active' : '');
        btn.textContent = c.name;
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (c.id === CLASS_ID) return;
            const schedules = await DB.getAll('class_schedules');
            const subjList = collectSubjectsFromSchedule(schedules, c.id);
            if (subjList.length === 0) { showToast('В классе нет расписания'); return; }
            const subjects = await DB.getAll('subjects');
            const firstSubjObj = subjects.find(s => s.name === subjList[0].name);
            if (!firstSubjObj) { showToast('Предмет не найден'); return; }
            window.location.href = `journal-view.html?class=${encodeURIComponent(c.id)}&subject=${encodeURIComponent(firstSubjObj.id)}`;
        });
        menu.appendChild(btn);
    });
}

function renderSubjectDropdownMenu() {
    const menu = document.getElementById('subjectDropdownMenu');
    menu.innerHTML = '';
    ALL_CLASS_SUBJECTS.forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-menu-item' + (s.id === SUBJECT_ID ? ' active' : '');
        btn.textContent = s.name;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (s.id === SUBJECT_ID) return;
            window.location.href = `journal-view.html?class=${encodeURIComponent(CLASS_ID)}&subject=${encodeURIComponent(s.id)}`;
        });
        menu.appendChild(btn);
    });
}

function toggleClassDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('classDropdown');
    const isOpen = dd.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) dd.classList.add('open');
}
function toggleSubjectDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('subjectDropdown');
    const isOpen = dd.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) dd.classList.add('open');
}
function closeAllDropdowns() {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
}
document.addEventListener('click', closeAllDropdowns);

function renderPeriodTabs() {
    const container = document.getElementById('periodTabs');
    container.innerHTML = '';

    if (PERIODS.length === 0) {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'tab-pill active';
        tab.textContent = 'Периоды не созданы';
        tab.disabled = true;
        tab.style.cursor = 'default';
        container.appendChild(tab);
        return;
    }

    const labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
    PERIODS.forEach((p, idx) => {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'tab-pill' + (idx === ACTIVE_PERIOD_INDEX ? ' active' : '');
        tab.textContent = labels[idx] || ('Период ' + (idx + 1));
        tab.title = `${p.start} – ${p.end}`;
        tab.addEventListener('click', async () => {
            ACTIVE_PERIOD_INDEX = idx;
            renderPeriodTabs();
            DATES = await buildDatesForPeriod(ACTIVE_PERIOD_INDEX);
            if (DATES.length === 0) {
                showEmpty('Нет уроков в периоде', 'По расписанию в выбранном периоде нет уроков по этому предмету.');
                return;
            }
            document.getElementById('mainContent').style.display = '';
            document.getElementById('emptyState').style.display = 'none';
            renderMainTable();
        });
        container.appendChild(tab);
    });
}

function renderMainTable() {
    const mRow = document.getElementById('mRow');
    const sRow = document.getElementById('sRow');
    const jBody = document.getElementById('jBody');
    const fioBody = document.getElementById('fioBody');
    const pBody = document.getElementById('pBody');

    mRow.innerHTML = ''; sRow.innerHTML = ''; jBody.innerHTML = ''; fioBody.innerHTML = ''; pBody.innerHTML = '';

    // ===== ФИО (клик по ученику → страница ученика) =====
    STUDENTS.forEach((student, sIdx) => {
        const shortName = formatShortName(student.full_name);
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.style.cursor = 'pointer';
        td.innerHTML = `<span class="student-number-text">${sIdx + 1}</span><span class="student-name-text">${escapeHtml(shortName)}</span>`;
        td.addEventListener('click', () => {
            window.location.href = 'student-view.html?id=' + encodeURIComponent(student.id);
        });
        tr.appendChild(td);
        fioBody.appendChild(tr);
    });

    DATES.forEach((d) => {
        const th = document.createElement('th');
        th.textContent = d.dateNoYear;
        th.className = 'col-date';
        th.title = `Урок №${d.lessonNum}`;
        mRow.appendChild(th);
    });

    const thAvg = document.createElement('th');
    thAvg.className = 'col-avg';
    thAvg.setAttribute('rowspan', '2');
    thAvg.textContent = 'Ср. бал';
    mRow.appendChild(thAvg);

    const thQtr = document.createElement('th');
    thQtr.className = 'col-qtr';
    thQtr.setAttribute('rowspan', '2');
    thQtr.textContent = 'Итог';
    mRow.appendChild(thQtr);

    DATES.forEach((d, dIdx) => {
        const th2 = document.createElement('th');
        th2.className = 'col-date type-lesson-col';
        th2.dataset.gradeKey = d.gradeKey;
        th2.dataset.colIdx = dIdx;
        const abbr = JOURNAL.lessonTypes[d.gradeKey] || 'ОТВ';
        th2.textContent = abbr;
        th2.title = 'Нажмите, чтобы выбрать тип урока';
        th2.addEventListener('click', (e) => {
            e.stopPropagation();
            openLessonTypePopup(e.currentTarget, d.gradeKey);
        });
        sRow.appendChild(th2);
    });

    STUDENTS.forEach((student) => {
        const tr = document.createElement('tr');
        DATES.forEach((d, dIdx) => {
            const td = document.createElement('td');
            td.className = 'col-date';
            td.dataset.col = dIdx;
            const value = (JOURNAL.grades[student.id] || {})[d.gradeKey] || '';
            td.innerHTML = `
                <div class="grade-cell">
                    <div class="display-layer" style="width:100%; height:100%; pointer-events:none;">${makeGradeDisplay(value)}</div>
                    <input type="text" value="${escapeHtml(value)}"
                        onfocus="hl(this, ${dIdx}, true); this.style.color='#1E293B';"
                        onblur="hl(this, ${dIdx}, false); this.style.color='transparent';"
                        onchange="upg('${student.id}', '${d.gradeKey}', this)">
                </div>
            `;
            tr.appendChild(td);
        });

        const tdAvg = document.createElement('td');
        tdAvg.className = 'col-avg avg-cell';
        tr.appendChild(tdAvg);

        const qtrValue = (JOURNAL.qtrGrades[student.id] || {})[ACTIVE_PERIOD_INDEX] || '';
        const tdQtr = document.createElement('td');
        tdQtr.className = 'col-qtr qtr-cell';
        tdQtr.innerHTML = `
            <div class="grade-cell">
                <div class="display-layer" style="width:100%; height:100%; pointer-events:none;">${makeGradeDisplay(qtrValue)}</div>
                <input type="text" value="${escapeHtml(qtrValue)}"
                    onfocus="this.style.color='#1E293B';"
                    onblur="this.style.color='transparent';"
                    onchange="upqtr('${student.id}', this)">
            </div>
        `;
        tr.appendChild(tdQtr);
        jBody.appendChild(tr);
    });

    jBody.querySelectorAll('tr').forEach((tr, idx) => {
        const avgCell = tr.querySelector('.avg-cell');
        if (avgCell && STUDENTS[idx]) {
            let sum = 0, count = 0;
            const sg = JOURNAL.grades[STUDENTS[idx].id] || {};
            DATES.forEach(d => {
                let v = (sg[d.gradeKey] || '').toUpperCase().trim();
                if (!v) return;
                let gp = v.replace(/[НОБП]|СП/g, '').trim();
                if (!gp) return;
                if (gp.includes('/')) {
                    gp.split('/').forEach(p => {
                        const n = parseInt(p);
                        if (!isNaN(n)) { sum += n; count++; }
                    });
                } else {
                    const n = parseInt(gp);
                    if (!isNaN(n)) { sum += n; count++; }
                }
            });
            avgCell.textContent = count === 0 ? '' : parseFloat((sum / count).toFixed(2)).toString();
        }
    });

    // ===== Правая панель: № / Дата / Тема / ДЗ =====
    DATES.forEach((d, dIdx) => {
        const l = JOURNAL.lessons[d.gradeKey] || { t: '', h: '' };
        const themeText = l.t || 'Добавить тему';
        const homeworkText = l.h || '+ ДЗ к след. уроку';
        const themeClass = !l.t ? 'placeholder-style' : '';
        const homeworkClass = !l.h ? 'placeholder-style' : '';

        const tr = document.createElement('tr');
        tr.className = 'lesson-row';
        tr.innerHTML = `
            <td class="lesson-num-cell">${dIdx + 1}</td>
            <td class="lesson-date-cell">${d.dateFull}</td>
            <td>
                <textarea class="text-area-input ${themeClass}"
                    onfocus="handlePlaceholder(this, 'Добавить тему', true)"
                    onblur="handlePlaceholder(this, 'Добавить тему', false)"
                    onchange="upl('${d.gradeKey}', 't', this.value)">${escapeHtml(themeText)}</textarea>
            </td>
            <td class="homework-cell">
                <textarea class="text-area-input ${homeworkClass}"
                    onfocus="handlePlaceholder(this, '+ ДЗ к след. уроку', true)"
                    onblur="handlePlaceholder(this, '+ ДЗ к след. уроку', false)"
                    onchange="upl('${d.gradeKey}', 'h', this.value)">${escapeHtml(homeworkText)}</textarea>
                <button type="button" class="btn-online-inline" onclick="showToast('Выдача онлайн-урока — в разработке')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    Выдать онлайн
                </button>
            </td>
        `;
        pBody.appendChild(tr);
    });

    // ===== Заглушки в теле после "Итог" =====
    requestAnimationFrame(() => { fillBodyFillers(); });
}

/* ============================================================
   Заглушки-ячейки в ТЕЛЕ таблицы оценок, ПОСЛЕ колонки "Итог".
   Заполняют пустое место справа. В шапку ничего не добавляем.
   ============================================================ */
function fillBodyFillers() {
    // Удаляем старые заглушки (только в теле!)
    document.querySelectorAll('.marks-table tbody td.col-filler').forEach(el => el.remove());

    const journalScroll = document.getElementById('journalScroll');
    if (!journalScroll) return;

    const scrollWidth = journalScroll.clientWidth;
    const fioWidth = document.querySelector('.fio-table-wrapper')?.offsetWidth || 210;
    const marksWrapper = document.querySelector('.marks-table-wrapper');
    if (!marksWrapper) return;

    const marksWidth = marksWrapper.scrollWidth;
    const freeSpace = scrollWidth - fioWidth - marksWidth;

    if (freeSpace < FILLER_COL_WIDTH * 0.5) return;

    const fillerCount = Math.floor(freeSpace / FILLER_COL_WIDTH);
    if (fillerCount <= 0) return;

    const jBody = document.getElementById('jBody');
    jBody.querySelectorAll('tr').forEach(tr => {
        for (let i = 0; i < fillerCount; i++) {
            const td = document.createElement('td');
            td.className = 'col-filler';
            td.style.width = FILLER_COL_WIDTH + 'px';
            td.style.minWidth = FILLER_COL_WIDTH + 'px';
            td.style.maxWidth = FILLER_COL_WIDTH + 'px';
            tr.appendChild(td);
        }
    });
}

function getGradeClass(value) {
    if (!value || typeof value !== 'string') return '';
    const base = value.trim().charAt(0);
    if (base === '1' || base === '2') return 'bad-grade';
    if (base === '3') return 'grade-3';
    if (base === '4' || base === '5') return 'grade-4';
    return '';
}

function makeGradeDisplay(v) {
    if (!v) return '';
    let up = v.toUpperCase().trim();
    if (!up) return '';

    let letterPart = '';
    let foundLetter = up.match(/^(Н|О|Б|П|СП)/);
    if (foundLetter) letterPart = `<span class="status-letter">${foundLetter[0]}</span>`;

    let gradePart = up.replace(/^(Н|О|Б|П|СП)/, '').trim();
    if (!gradePart) return letterPart;

    if (gradePart.includes('/')) {
        const parts = gradePart.split('/');
        return `
            ${letterPart}
            <div class="grade-display">
                <div class="double-grade-box ${getGradeClass(parts[0])}">${parts[0]}</div>
                <span class="slash-divider">/</span>
                <div class="double-grade-box ${getGradeClass(parts[1])}">${parts[1] || ''}</div>
            </div>
        `;
    }
    return `${letterPart}<div class="grade-display"><div class="grade-box ${getGradeClass(gradePart)}">${gradePart}</div></div>`;
}

function hl(input, colIdx, active) {
    const tr = input.closest('tr');
    if (tr) {
        tr.querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
        const trIndex = Array.from(tr.parentNode.children).indexOf(tr);
        const fioRows = document.querySelectorAll('#fioBody tr');
        if (fioRows[trIndex]) {
            fioRows[trIndex].querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
        }
    }
    document.querySelectorAll(`#jBody td[data-col="${colIdx}"]`).forEach(td => {
        td.classList.toggle('highlight-cross', active);
    });
}

async function upg(studentId, gradeKey, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    const validRegex = /^(([НОБП]|СП)\s*)?([1-5][+-]?(\/([1-5][+-]?)?)?)?$/i;

    if (!validRegex.test(up)) {
        alert('Используйте оценки от 1 до 5 (можно с + или -, двойные через /), буквы отсутствия (Н, О, Б, П, СП)');
        inputElement.value = (JOURNAL.grades[studentId] || {})[gradeKey] || '';
        return;
    }

    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) {
        displayLayer.innerHTML = !up ? '' : `<div class="grade-display"><div style="color:#475569; font-weight:700; font-size:12px;">${escapeHtml(up)}</div></div>`;
    }

    setTimeout(async () => {
        if (!JOURNAL.grades[studentId]) JOURNAL.grades[studentId] = {};
        JOURNAL.grades[studentId][gradeKey] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, 200);
}

async function upqtr(studentId, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    const qtrRegex = /^([1-5][+-]?)?$/;
    if (!qtrRegex.test(up)) {
        alert('Для итоговой оценки используйте баллы от 1 до 5');
        inputElement.value = (JOURNAL.qtrGrades[studentId] || {})[ACTIVE_PERIOD_INDEX] || '';
        return;
    }
    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) {
        displayLayer.innerHTML = !up ? '' : `<div class="grade-display"><div style="color:#475569; font-weight:700; font-size:12px;">${escapeHtml(up)}</div></div>`;
    }
    setTimeout(async () => {
        if (!JOURNAL.qtrGrades[studentId]) JOURNAL.qtrGrades[studentId] = {};
        JOURNAL.qtrGrades[studentId][ACTIVE_PERIOD_INDEX] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, 200);
}

async function upl(gradeKey, key, value) {
    const txt = value.trim();
    if (txt === 'Добавить тему' || txt === '+ ДЗ к след. уроку') return;
    if (!JOURNAL.lessons[gradeKey]) JOURNAL.lessons[gradeKey] = { t: '', h: '' };
    JOURNAL.lessons[gradeKey][key] = txt;
    await saveJournal();
}

function handlePlaceholder(el, defaultText, isFocus) {
    const val = el.value.trim();
    if (isFocus) {
        if (val === defaultText) { el.value = ''; el.classList.remove('placeholder-style'); }
    } else {
        if (val === '') { el.value = defaultText; el.classList.add('placeholder-style'); }
    }
}

async function saveJournal() {
    await DB.upsertJournal(CLASS_ID, SUBJECT_ID, {
        grades: JOURNAL.grades,
        lessons: JOURNAL.lessons,
        qtr_grades: JOURNAL.qtrGrades,
        lesson_types: JOURNAL.lessonTypes
    });
}

let currentLessonTypeContext = { gradeKey: null };
let popupJustOpened = false;

function openLessonTypePopup(anchorEl, gradeKey) {
    const popup = document.getElementById('lessonTypePopup');
    const search = document.getElementById('lessonTypePopupSearch');
    currentLessonTypeContext = { gradeKey };
    popupJustOpened = true;
    search.value = '';
    renderLessonTypePopupList();
    popup.classList.add('show');
    const rect = anchorEl.getBoundingClientRect();
    const popupWidth = 260, popupMaxHeight = 340;
    let left = rect.left + rect.width / 2 - popupWidth / 2;
    if (left < 8) left = 8;
    if (left + popupWidth > window.innerWidth - 8) left = window.innerWidth - popupWidth - 8;
    let top = rect.bottom + 4;
    if (top + popupMaxHeight > window.innerHeight - 8) {
        top = rect.top - popupMaxHeight - 4;
        if (top < 8) top = 8;
    }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    setTimeout(() => search.focus(), 50);
    setTimeout(() => { popupJustOpened = false; }, 100);
}

function renderLessonTypePopupList() {
    const list = document.getElementById('lessonTypePopupList');
    const search = (document.getElementById('lessonTypePopupSearch').value || '').toLowerCase().trim();
    const currentAbbr = (JOURNAL.lessonTypes || {})[currentLessonTypeContext.gradeKey] || 'ОТВ';
    list.innerHTML = '';
    const filtered = LESSON_TYPES.filter(t => !search || t.abbr.toLowerCase().includes(search) || t.full.toLowerCase().includes(search));
    if (filtered.length === 0) { list.innerHTML = '<div class="lesson-type-popup-empty">Ничего не найдено</div>'; return; }
    filtered.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lesson-type-popup-item' + (t.abbr === currentAbbr ? ' active' : '');
        btn.innerHTML = `<span class="abbr">${escapeHtml(t.abbr)}</span><span class="full">${escapeHtml(t.full)}</span>`;
        btn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); selectLessonType(t.abbr); });
        list.appendChild(btn);
    });
}

async function selectLessonType(abbr) {
    const { gradeKey } = currentLessonTypeContext;
    if (!gradeKey) return;
    JOURNAL.lessonTypes[gradeKey] = abbr;
    await saveJournal();
    const th = document.querySelector(`th.type-lesson-col[data-grade-key="${gradeKey}"]`);
    if (th) th.textContent = abbr;
    closeLessonTypePopup();
}

function closeLessonTypePopup() {
    document.getElementById('lessonTypePopup').classList.remove('show');
}

document.addEventListener('click', (e) => {
    const popup = document.getElementById('lessonTypePopup');
    if (!popup.classList.contains('show')) return;
    if (popupJustOpened) return;
    if (!popup.contains(e.target)) closeLessonTypePopup();
});
document.addEventListener('mousedown', (e) => {
    const popup = document.getElementById('lessonTypePopup');
    if (!popup.classList.contains('show')) return;
    if (popupJustOpened) return;
    if (!popup.contains(e.target) && !e.target.closest('.type-lesson-col')) closeLessonTypePopup();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLessonTypePopup(); });
window.addEventListener('resize', () => { closeLessonTypePopup(); fillBodyFillers(); });

function toggleLeftPanel() {
    const container = document.getElementById('panelsContainer');
    const tabLeft = document.getElementById('tabLeft');
    leftCollapsed = !leftCollapsed;
    container.classList.toggle('left-collapsed', leftCollapsed);
    tabLeft.classList.toggle('active', leftCollapsed);
    if (leftCollapsed) {
        rightCollapsed = false;
        container.classList.remove('right-collapsed');
        document.getElementById('tabRight').classList.remove('active');
    }
    updateTabIcons();
    setTimeout(fillBodyFillers, 380);
}

function toggleRightPanel() {
    const container = document.getElementById('panelsContainer');
    const tabRight = document.getElementById('tabRight');
    rightCollapsed = !rightCollapsed;
    container.classList.toggle('right-collapsed', rightCollapsed);
    tabRight.classList.toggle('active', rightCollapsed);
    if (rightCollapsed) {
        leftCollapsed = false;
        container.classList.remove('left-collapsed');
        document.getElementById('tabLeft').classList.remove('active');
    }
    updateTabIcons();
    setTimeout(fillBodyFillers, 380);
}

function updateTabIcons() {
    const tabLeft = document.getElementById('tabLeft');
    const tabRight = document.getElementById('tabRight');
    const iconLeft = leftCollapsed
        ? '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>'
        : '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>';
    const iconRight = rightCollapsed
        ? '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>'
        : '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>';
    tabLeft.innerHTML = `<svg viewBox="0 0 24 24">${iconLeft}</svg>Раскрыть поуроч. планирование`;
    tabRight.innerHTML = `<svg viewBox="0 0 24 24">${iconRight}</svg>Раскрыть журнал`;
}

function showEmpty(title, text) {
    document.getElementById('mainContent').style.display = 'none';
    const empty = document.getElementById('emptyState');
    empty.style.display = 'block';
    document.getElementById('emptyTitle').textContent = title;
    document.getElementById('emptyText').textContent = text;
}

function goBack() {
    window.location.href = 'admin.html';
}

init().catch(err => {
    console.error('Ошибка init:', err);
    showEmpty('Ошибка', 'Не удалось загрузить журнал. Проверьте консоль (F12).');
});
updateTabIcons();
</script>
