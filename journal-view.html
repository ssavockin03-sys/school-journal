<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал — Дневник.ру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: #FFFFFF; color: #1E293B; min-height: 100vh; font-size: 13px; line-height: 1.4; overflow: hidden; }
.top-nav { font-size: 13px; color: #94A3B8; padding: 14px 30px 6px 30px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.top-nav a { color: #2563EB; text-decoration: none; font-weight: 500; cursor: pointer; }
.top-nav a:hover { color: #1D4ED8; text-decoration: underline; }
.top-nav .sep { color: #CBD5E1; font-size: 12px; }
.top-nav .current { color: #2563EB; font-weight: 500; }
.header-bar { padding: 4px 30px 10px 30px; }
.header-grid { display: inline-grid; grid-template-columns: max-content max-content; column-gap: 40px; row-gap: 8px; align-items: center; }
.dropdown { position: relative; display: inline-block; }
.dropdown-trigger { display: inline-flex; align-items: center; gap: 7px; padding: 2px 0; background: transparent; border: none; font-size: 17.85px; font-weight: 700; color: #3B82F6; cursor: pointer; font-family: inherit; white-space: nowrap; letter-spacing: -0.4px; }
.dropdown-trigger:hover { color: #2563EB; }
.dropdown-trigger .chevron { width: 13px; height: 13px; fill: #3B82F6; transition: transform 0.2s ease; margin-top: 3px; }
.dropdown.open .dropdown-trigger .chevron { transform: rotate(180deg); }
.dropdown-menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 180px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 8px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); padding: 4px; z-index: 200; display: none; max-height: 320px; overflow-y: auto; }
.dropdown.open .dropdown-menu { display: block; }
.dropdown-menu-item { display: block; width: 100%; padding: 8px 12px; background: transparent; border: none; border-radius: 5px; color: #1E293B; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; font-family: inherit; }
.dropdown-menu-item:hover { background: #EFF6FF; color: #2563EB; }
.dropdown-menu-item.active { background: #DBEAFE; color: #1D4ED8; font-weight: 600; }
.header-meta-item { font-size: 13px; color: #1E293B; }
.period-tabs-wrapper { display: flex; align-items: center; gap: 12px; padding: 12px 30px 14px 30px; flex-wrap: wrap; }
.period-tabs-group { display: inline-flex; align-items: center; padding: 3px; border: 1px solid #CBD5E1; border-radius: 8px; flex-wrap: wrap; }
.tab-pill { padding: 5px 12px; background: transparent; color: #64748B; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; border: 1px solid transparent; font-family: inherit; white-space: nowrap; transition: all 0.15s ease; }
.tab-pill:hover { background: #F1F5F9; color: #334155; }
.tab-pill.active { background: #FFFFFF; color: #2563EB; border-color: #2563EB; font-weight: 600; }
.tab-pill.summary-tab { border-color: #CBD5E1; }
.tab-pill.summary-tab.active { background: #FFFFFF; color: #2563EB; border-color: #2563EB; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.btn-import { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: #FFFFFF; color: #334155; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s ease; }
.btn-import:hover { background: #F8FAFC; border-color: #94A3B8; }
.btn-import svg { width: 14px; height: 14px; fill: #64748B; }
.btn-text-action { padding: 5px 10px; background: transparent; border: none; color: #2563EB; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; border-radius: 6px; transition: all 0.15s ease; }
.btn-text-action:hover { background: #EFF6FF; }
.btn-outlined-blue { padding: 5px 10px; background: #FFFFFF; border: 1px solid #2563EB; color: #2563EB; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; border-radius: 6px; transition: all 0.15s ease; }
.btn-outlined-blue:hover { background: #EFF6FF; }
.icon-actions { display: inline-flex; align-items: center; gap: 2px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 2px; }
.icon-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: transparent; border: none; border-radius: 4px; color: #64748B; cursor: pointer; font-family: inherit; }
.icon-action-btn:hover { background: #F1F5F9; color: #1E293B; }
.icon-action-btn svg { width: 15px; height: 15px; fill: currentColor; }
.icon-action-btn .excel-icon { fill: #217346; }

.mobile-view-tabs { display: none; }

.panels-container {
    display: flex;
    padding: 0 30px;
    height: calc(100vh - 185px);
    min-height: 300px;
    align-items: stretch;
}
.panel-left-wrapper, .panel-right-wrapper {
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    transition: flex-basis 0.3s ease, max-width 0.3s ease;
    height: 100%;
}
.panel-left {
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
    border: 1px solid #CFD8E3;
    border-right: none;
    border-radius: 8px 0 0 8px;
    display: flex;
    flex-direction: column;
    margin: 0 0 12px 0;
}
.panel-right {
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow: auto;
    border: 1px solid #CFD8E3;
    background: #FFFFFF;
    border-radius: 0 8px 8px 0;
    border-left: none;
    margin: 0 0 12px 0;
}
.panels-container.left-collapsed .panel-left-wrapper { flex: 0 0 0; max-width: 0; }
.panels-container.left-collapsed .panel-right-wrapper { flex: 1; }
.panels-container.left-collapsed .panel-right { border-radius: 8px; border-left: 1px solid #CFD8E3; }
.panels-container.right-collapsed .panel-right-wrapper { flex: 0 0 0; max-width: 0; }
.panels-container.right-collapsed .panel-left-wrapper { flex: 1; }
.panels-container.right-collapsed .panel-left { border-radius: 8px; border-right: 1px solid #CFD8E3; }
.panels-container.summary-mode .panel-right-wrapper { flex: 0 0 0; max-width: 0; }
.panels-container.summary-mode .panel-left-wrapper { flex: 1; }
.panels-container.summary-mode .panel-left { border-radius: 8px; border-right: 1px solid #CFD8E3; }
.panels-container.summary-mode .side-toggle-tabs { display: none; }

.side-toggle-tabs { width: 0; flex-shrink: 0; position: relative; margin: 0 0 12px 0; align-self: stretch; }
.side-toggle-tab {
    position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 130px; width: 27px; padding: 0; background: #3B82F6; color: #FFFFFF;
    border: 1px solid #3B82F6; font-size: 8.8px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s ease;
    writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap;
    user-select: none; line-height: 1; letter-spacing: 0.2px;
    box-shadow: 0 1px 2px rgba(59, 130, 246, 0.25); z-index: 6;
}
.side-toggle-tab.tab-left { left: 100%; top: calc(47% - 130px); border-radius: 8px 0 0 8px; border-right: none; transform: rotate(180deg); }
.side-toggle-tab.tab-left:hover, .side-toggle-tab.tab-left.active { background: #2563EB; border-color: #2563EB; }
.side-toggle-tab.tab-right { right: 100%; top: 47%; border-radius: 0 8px 8px 0; border-left: none; transform: rotate(180deg); }
.side-toggle-tab.tab-right:hover, .side-toggle-tab.tab-right.active { background: #2563EB; border-color: #2563EB; }
.side-toggle-tab svg { width: 9.8px; height: 9.8px; fill: #FFFFFF; flex-shrink: 0; transform: rotate(90deg); }

.journal-scroll { width: 100%; height: 100%; overflow: auto; position: relative; }
.journal-tables-wrapper { display: flex; width: max-content; min-width: 100%; }
.fio-table-wrapper { flex-shrink: 0; width: 210px; background: #FFFFFF; position: sticky; left: 0; z-index: 20; }
.fio-table-wrapper::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: #CFD8E3; pointer-events: none; z-index: 30; }
.fio-table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: 210px; }
.fio-table th, .fio-table td { padding: 0; text-align: left !important; font-size: 13px; height: 38px; line-height: 36px; vertical-align: middle; border: none; border-bottom: 1px solid #CFD8E3; box-sizing: border-box; background: #FFFFFF; }
.fio-table thead th { background: #EBF0F6 !important; font-weight: 400; color: #334155; font-size: 13px !important; text-align: center !important; height: 76px; line-height: 74px; padding: 0 10px; position: sticky; top: 0; z-index: 25; }
.fio-table td { padding: 0 10px; color: #1E293B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fio-table .student-number-text { display: inline-block; width: 22px; margin-right: 6px; font-size: 13.65px; text-align: right; }
.fio-table .student-name-text { display: inline-block; font-size: 13.65px; }
.fio-table tbody tr:nth-child(5n) td { border-bottom: 1px solid #000000 !important; }

.marks-table-wrapper { flex-shrink: 0; background: #FFFFFF; }
.marks-table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }
.marks-table th, .marks-table td { padding: 0; text-align: center; font-size: 12px; height: 38px; line-height: 36px; vertical-align: middle; border: none; border-right: 1px solid #CFD8E3; border-bottom: 1px solid #CFD8E3; box-sizing: border-box; position: relative; }
.marks-table th { background: #EBF0F6 !important; font-weight: 600; color: #475569; font-size: 11px; }
.marks-table thead { position: sticky; top: 0; z-index: 10; }
.marks-table thead th { background: #EBF0F6 !important; }
.col-date { width: 46px; min-width: 46px; max-width: 46px; background: #FFFFFF; }
.col-period { width: 46px; min-width: 46px; max-width: 46px; background: #FFFFFF; }
.marks-table thead tr:first-child .col-date { color: #0EA5E9 !important; font-size: 12px !important; font-weight: 400 !important; position: relative; }
.marks-table thead tr:nth-child(2) .col-date { font-size: 12px !important; color: #475569 !important; font-weight: 400 !important; cursor: pointer !important; user-select: none; }
.marks-table thead tr:nth-child(2) .col-date:hover { background: #DFE7F0 !important; }
.marks-table tbody tr:nth-child(5n) td { border-bottom: 1px solid #000000 !important; }

.marks-table thead tr:first-child th.col-date.col-today {
    padding: 4px 2px;
    line-height: 1.15;
    vertical-align: middle;
}
.marks-table thead tr:first-child th.col-date .today-date {
    display: block;
    font-size: 12px;
    color: #0EA5E9;
    font-weight: 500;
    line-height: 1.1;
}
.marks-table thead tr:first-child th.col-date .today-label {
    display: block;
    font-size: 9px;
    color: #475569;
    font-weight: 400;
    line-height: 1.1;
    margin-top: 2px;
    text-transform: lowercase;
    letter-spacing: 0.1px;
}

.marks-table th.col-today::before,
.marks-table td.col-today::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: -1px;
    left: 0;
    width: 1px;
    background: #1E40AF;
    pointer-events: none;
    z-index: 8;
}
.marks-table th.col-today::after,
.marks-table td.col-today::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: -1px;
    right: -1px;
    width: 1px;
    background: #1E40AF;
    pointer-events: none;
    z-index: 8;
}
.marks-table thead tr:first-child th.col-today {
    border-top: 1px solid #1E40AF !important;
}
.marks-table tbody tr:last-child td.col-today {
    border-bottom: 1px solid #1E40AF !important;
}

.marks-table.period-mode thead th.col-period-header {
    width: 46px; min-width: 46px; max-width: 46px; height: 76px; line-height: 16px;
    padding: 4px 2px; vertical-align: middle; font-weight: 600; font-size: 11px;
    color: #334155; background: #EBF0F6 !important;
    white-space: normal; word-wrap: break-word; overflow-wrap: break-word;
}
.marks-table.period-mode thead th.col-final-header {
    width: 46px; min-width: 46px; max-width: 46px; height: 76px; line-height: 16px;
    padding: 4px 2px; vertical-align: middle; font-weight: 700; font-size: 11px;
    color: #1E293B; background: #EBF0F6 !important;
    white-space: normal; word-wrap: break-word;
}
.marks-table.period-mode tbody td.col-period {
    font-size: 13px; background: #FFFFFF; vertical-align: middle;
    height: 38px; width: 46px; min-width: 46px; max-width: 46px;
}
.marks-table.period-mode tbody td.col-final {
    background: #FFFFFF; font-weight: 600; color: #1E293B;
}

.col-avg { width: 53px; min-width: 53px; max-width: 53px; background: #FFFFFF !important; font-size: 11px !important; color: #000000 !important; padding: 0 4px; }
.marks-table thead .col-avg { background: #EBF0F6 !important; color: #334155 !important; font-weight: 600 !important; font-size: 11px !important; vertical-align: middle !important; height: 76px; line-height: 74px; }
.col-qtr { width: 53px; min-width: 53px; max-width: 53px; background: #FFFFFF !important; font-size: 11px !important; color: #000000 !important; padding: 0 4px; }
.marks-table thead .col-qtr { background: #EBF0F6 !important; color: #334155 !important; font-weight: 600 !important; font-size: 11px !important; vertical-align: middle !important; height: 76px; line-height: 74px; }

.grade-cell { display: flex; justify-content: center; align-items: center; width: 100%; height: 36px; position: relative; }
.grade-cell input {
    width: 100%; height: 26px; text-align: center; border: none; background: transparent;
    font-size: 13.5px; cursor: pointer; position: absolute; top: 5px; left: 0; z-index: 5;
    padding: 0; color: transparent; font-family: inherit; outline: none;
}
.grade-cell input:focus { background: #FFFFFF; cursor: text; color: #1E293B !important; }
.grade-cell input::selection { background: #BFDBFE; }
.grade-display {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; pointer-events: none; gap: 1px;
    z-index: 1; position: absolute; top: 0; left: 0;
}
.grade-box { display: flex; align-items: center; justify-content: center; min-width: 14px; height: 16px; padding: 0 2px; color: #FFFFFF !important; font-weight: 700; font-size: 13.5px; line-height: 1; }
.double-grade-box { display: flex; align-items: center; justify-content: center; min-width: 11px; height: 14px; padding: 0 1px; color: #FFFFFF !important; font-weight: 700; font-size: 12px; line-height: 1; }
.slash-divider { color: #CBD5E1; font-weight: 700; font-size: 10px; margin: 0 -1px; }
.grade-4, .grade-5 { background: #65A30D !important; }
.grade-3 { background: #FB923C !important; }
.bad-grade { background: #DC2626 !important; }

.status-letter { position: absolute; top: 0; left: 3px; color: #DC2626 !important; font-size: 13px !important; font-weight: 400 !important; pointer-events: none; z-index: 4; background: transparent !important; border: none !important; padding: 0 !important; line-height: 1; }

.marks-table td.highlight-cross, .fio-table td.highlight-cross { background-color: #EFF6FF !important; }

.marks-table td.col-date:focus-within,
.marks-table td.col-qtr:focus-within,
.marks-table td.col-period:focus-within {
    position: relative;
    z-index: 9;
}
.marks-table td.col-date:focus-within::after,
.marks-table td.col-qtr:focus-within::after,
.marks-table td.col-period:focus-within::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: -1px;
    bottom: -1px;
    border: 1.5px solid #60A5FA;
    pointer-events: none;
    z-index: 10;
    box-sizing: border-box;
}
.marks-table td.col-date.col-today:focus-within,
.marks-table td.col-qtr.col-today:focus-within,
.marks-table td.col-period.col-today:focus-within {
    outline: 1.5px solid #60A5FA;
    outline-offset: -1.5px;
}
.marks-table td.col-date.col-today:focus-within::after,
.marks-table td.col-qtr.col-today:focus-within::after,
.marks-table td.col-period.col-today:focus-within::after {
    content: none;
    border: none;
}

.marks-table thead th.col-filler-head { background: #EBF0F6 !important; border-right: 1px solid #CFD8E3; border-bottom: 1px solid #CFD8E3; }
.marks-table tbody td.col-filler-body { background: #FFFFFF !important; border-right: 1px solid #CFD8E3; border-bottom: 1px solid #CFD8E3; pointer-events: none; }
.marks-table tbody tr:nth-child(5n) td.col-filler-body { border-bottom: 1px solid #000000 !important; }
.marks-table thead th.col-filler-head.col-filler-last,
.marks-table tbody td.col-filler-body.col-filler-last { border-right: none; }

.journal-scroll::-webkit-scrollbar, .panel-right::-webkit-scrollbar { width: 20px; height: 20px; background: transparent; }
.journal-scroll::-webkit-scrollbar-thumb, .panel-right::-webkit-scrollbar-thumb { background: #CFD8E3; border-radius: 6px; border: 4px solid transparent; background-clip: padding-box; }
.journal-scroll::-webkit-scrollbar-thumb:hover, .panel-right::-webkit-scrollbar-thumb:hover { background: #B8C4D4; background-clip: padding-box; }
.journal-scroll::-webkit-scrollbar-corner, .panel-right::-webkit-scrollbar-corner { background: transparent; }

.panel-right table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.panel-right table thead { position: sticky; top: 0; z-index: 30; }
.panel-right table th {
    background: #EBF0F6 !important; color: #1E293B !important; font-size: 12px !important; font-weight: 600;
    height: 76px; line-height: 18px; padding: 0 8px; text-align: center; vertical-align: middle;
    border: none; border-right: 1px solid #CFD8E3; border-bottom: 1px solid #CFD8E3;
}
.panel-right table th:last-child { border-right: none; }
.panel-right table th:nth-child(1) { width: 40px; }
.panel-right table th:nth-child(2) { width: 80px; }
.panel-right table th:nth-child(3) { width: 30%; }
.panel-right table th:nth-child(4) { width: 55%; }
.panel-right tbody td {
    background: #FFFFFF !important; border: none; border-right: 1px solid #CFD8E3; border-bottom: 1px solid #CFD8E3;
    vertical-align: top; text-align: left; padding: 4px 8px; box-sizing: border-box;
    word-wrap: break-word; height: 56px; position: relative;
}
.panel-right tbody td:last-child { border-right: none; }
.panel-right tbody td.lesson-num-cell {
    font-weight: 600; background: #F4F7FB !important; vertical-align: middle;
    color: #475569; font-size: 12px; text-align: center; padding: 0 !important;
}
.panel-right tbody td.lesson-date-cell {
    font-weight: 600; background: #FFFFFF !important; vertical-align: middle;
    color: #0EA5E9; font-size: 12px; text-align: center; padding: 0 !important;
}

.panel-right tbody tr.lesson-row.lesson-today > td {
    border-top: 1px solid #1E40AF !important;
    border-bottom: 1px solid #1E40AF !important;
}
.panel-right tbody tr.lesson-row.lesson-today > td:first-child::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: -1px;
    left: 0;
    width: 1px;
    background: #1E40AF;
    pointer-events: none;
    z-index: 8;
}
.panel-right tbody tr.lesson-row.lesson-today > td:last-child::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: -1px;
    right: -1px;
    width: 1px;
    background: #1E40AF;
    pointer-events: none;
    z-index: 8;
}

.panel-right tbody td.lesson-date-cell .today-date {
    display: block;
    font-size: 12px;
    color: #0EA5E9;
    font-weight: 500;
    line-height: 1.1;
}
.panel-right tbody td.lesson-date-cell .today-label {
    display: block;
    font-size: 9px;
    color: #475569;
    font-weight: 400;
    line-height: 1.1;
    margin-top: 2px;
    text-transform: lowercase;
    letter-spacing: 0.1px;
}

.plan-filler-cell { background: #FFFFFF !important; pointer-events: none; }

.theme-cell, .homework-cell { font-size: 13.65px; line-height: 1.3; color: #334155; white-space: pre-wrap; word-wrap: break-word; vertical-align: top; }
.homework-cell { padding-right: 84px !important; }

.cell-online-btn {
    position: absolute; top: 4px; right: 6px;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; background: #FFFFFF; border: 1px solid #93C5FD; border-radius: 6px;
    color: #2563EB; font-size: 10px; font-weight: 500; cursor: pointer; font-family: inherit;
    white-space: nowrap; line-height: 1.3; transition: all 0.15s ease; z-index: 2;
}
.cell-online-btn:hover { background: #EFF6FF; border-color: #2563EB; }
.cell-online-btn svg { width: 10px; height: 10px; fill: currentColor; flex-shrink: 0; }

.hw-list { display: block; }
.hw-list-item {
    display: block; padding: 1px 4px; margin: 0; border-radius: 6px; cursor: pointer;
    white-space: pre-wrap; word-wrap: break-word; transition: background 0.12s ease;
}

.hw-divider {
    display: block;
    height: 1px;
    background: #CFD8E3;
    margin: 3px 0 3px 0;
    border: none;
}

.placeholder-text {
    display: inline-block; color: #0EA5E9; font-style: italic; font-size: 13.65px;
    cursor: pointer; padding: 8px 12px; margin: -8px -12px; line-height: 1.3;
}

.add-hw-btn {
    display: inline-block; padding: 2px 4px; margin: 0;
    border: none; background: transparent; color: #0EA5E9; font-style: italic;
    font-size: 13.65px; font-weight: 400; cursor: pointer; font-family: inherit;

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const s = String(text);
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function formatShortName(fullName) {
    if (!fullName) return '';

    if (parts.length === 1) return parts[0];
    return parts[0] + ' ' + parts[1];

let PERIOD_SYSTEM = '';

let toastTimer = null;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
    }, 2500);
}

function isMobileView() {
    return window.matchMedia('(max-width: 1100px)').matches;
}

function switchMobileView(view) {
    MOBILE_VIEW = view;
    const container = document.getElementById('panelsContainer');
    container.classList.toggle('mobile-show-journal', view === 'journal');
    container.classList.toggle('mobile-show-plan', view === 'plan');
    document.getElementById('mobileTabJournal').classList.toggle('active', view === 'journal');
    document.getElementById('mobileTabPlan').classList.toggle('active', view === 'plan');
    requestAnimationFrame(() => {

    });

    }, 50);
    setTimeout(() => {
        if (SUMMARY_MODE) fillFillersSummary();

    }, 200);
    setTimeout(() => {
        if (SUMMARY_MODE) fillFillersSummary();
        else { fillFillers(); fillPlanFillers(); }

}

function collectSubjectsFromSchedule(schedules, classId) {
    const map = new Map();
    schedules
        .filter(s => s.class_id === classId && s.grid)
        .forEach(s => {
            Object.values(s.grid).forEach(dayGrid => {
                Object.values(dayGrid || {}).forEach(lesson => {
                    if (!lesson || !lesson.subject) return;
                    if (!map.has(lesson.subject)) {
                        map.set(lesson.subject, { name: lesson.subject, teacherName: lesson.teacherName || '' });
                    } else if (!map.get(lesson.subject).teacherName && lesson.teacherName) {
                        map.get(lesson.subject).teacherName = lesson.teacherName;
                    }
                });
            });
        });
    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function normalizeHwList(h) {
    if (Array.isArray(h)) return h.filter(x => typeof x === 'string' && x.trim() !== '');
    if (typeof h === 'string' && h.trim() !== '') return [h];
    return [];
}

/* ============================================================
   ЕДИНЫЙ РЕДАКТОР С ЗАДЕРЖКОЙ 200 МС.
   НИКАКИХ глобальных mousedown-перехватчиков.
   Редактор закрывается:
   - по blur textarea (автоматически, через 200 мс),
   - по клику на галочку (немедленно),
   - по Enter (немедленно) / Esc (отмена),
   - при открытии нового редактора (сначала blur → таймер → потом DOM).
   ============================================================ */
let activeEditor = null;

function commitActiveEditor() {
    if (!activeEditor) return;
    const ed = activeEditor;
    activeEditor = null;
    if (ed.timer) { clearTimeout(ed.timer); ed.timer = null; }
    try { ed.commit(); } catch (e) { console.error(e); }
}

function cancelActiveEditor() {
    if (!activeEditor) return;
    const ed = activeEditor;
    activeEditor = null;
    if (ed.timer) { clearTimeout(ed.timer); ed.timer = null; }
    try { ed.cancel(); } catch (e) { console.error(e); }
}

/* Мягко закрыть текущий редактор:
   1. Снимаем фокус с textarea — сработает штатный blur → таймер.
   2. Удаляем DOM.
   Таймер продолжит жить и через 200 мс вызовет commit(). */
function detachActiveEditorDom() {
    if (!activeEditor) return;
    const ed = activeEditor;
    activeEditor = null;
    if (ed.textarea && typeof ed.textarea.blur === 'function') {
        try { ed.textarea.blur(); } catch (e) {}
    }
    if (ed.dom && ed.dom.parentNode) {
        ed.dom.parentNode.removeChild(ed.dom);
    }
    if (!ed.timer) {
        try { ed.commit(); } catch (e) { console.error(e); }
    }
}

async function init() {
    const { classId, subjectId } = getUrlParams();
    if (!classId || !subjectId) { showEmpty('Не заданы параметры', 'В URL отсутствуют параметры class и subject.'); return; }
    CLASS_ID = classId;
    SUBJECT_ID = subjectId;

    const classes = await DB.getAll('classes');
    ALL_CLASSES = classes;
    CLASS_OBJ = classes.find(c => c.id === CLASS_ID);
    if (!CLASS_OBJ) { showEmpty('Класс не найден', 'В базе данных нет класса с указанным ID.'); return; }

    const subjects = await DB.getAll('subjects');
    SUBJECT_OBJ = subjects.find(s => s.id === SUBJECT_ID);
    if (!SUBJECT_OBJ) { showEmpty('Предмет не найден', 'В базе данных нет предмета с указанным ID.'); return; }
    SUBJECT_NAME = SUBJECT_OBJ.name;

    ALL_SCHEDULES = await DB.getAll('class_schedules');
    const classSubjects = collectSubjectsFromSchedule(ALL_SCHEDULES, CLASS_ID);
    const matched = classSubjects.find(s => s.name === SUBJECT_NAME);
    if (matched) TEACHER_NAME = matched.teacherName || '';

    ALL_CLASS_SUBJECTS = [];
    classSubjects.forEach(cs => {
        const subjObj = subjects.find(s => s.name === cs.name);
        if (subjObj) ALL_CLASS_SUBJECTS.push({ id: subjObj.id, name: cs.name });
    });

    const allStudents = await DB.getAll('students');
    STUDENTS = allStudents
        .filter(s => s.class_id === CLASS_ID)
        .sort((a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'ru'));

    const periodDocs = await DB.getAll('educational_periods');
    const periodDoc = periodDocs[0] || null;
    PERIODS = periodDoc ? (periodDoc.periods || []) : [];
    PERIOD_SYSTEM = periodDoc ? (periodDoc.system || '') : '';

    const journalRecord = await DB.getJournal(CLASS_ID, SUBJECT_ID);
    if (journalRecord) {
        JOURNAL = {
            grades: journalRecord.grades || {},
            lessons: journalRecord.lessons || {},
            qtrGrades: journalRecord.qtr_grades || {},
            lessonTypes: journalRecord.lesson_types || {}
        };
    } else {
        JOURNAL = { grades: {}, lessons: {}, qtrGrades: {}, lessonTypes: {} };
    }

    ACTIVE_PERIOD_INDEX = findActivePeriodIndex();
    SUMMARY_MODE = false;

    MOBILE_VIEW = 'journal';
    const container = document.getElementById('panelsContainer');
    container.classList.add('mobile-show-journal');
    document.getElementById('mobileTabJournal').classList.add('active');

    renderHeader();
    renderPeriodTabs();

    if (STUDENTS.length === 0) { showEmpty('В классе нет учеников', 'Добавьте учеников в этот класс через панель администратора.'); return; }

    DATES = await buildDatesForPeriod(ACTIVE_PERIOD_INDEX);

    renderMainTable();
    fillFillers();
    requestAnimationFrame(() => {
        fillFillers();
        fillPlanFillers();
        centerOnToday();
    });

    setupObservers();

    document.title = CLASS_OBJ.name + ' · ' + SUBJECT_NAME + ' — Журнал';
}

let planObserver = null;
let journalObserver = null;
function setupObservers() {
    if (typeof ResizeObserver === 'undefined') return;
    const panelRight = document.getElementById('panelRight');
    if (panelRight) {
        if (planObserver) planObserver.disconnect();
        planObserver = new ResizeObserver(() => {
            requestAnimationFrame(fillPlanFillers);
        });
        planObserver.observe(panelRight);
    }
    const journalScroll = document.getElementById('journalScroll');
    if (journalScroll) {
        if (journalObserver) journalObserver.disconnect();
        journalObserver = new ResizeObserver(() => {
            requestAnimationFrame(() => {
                if (SUMMARY_MODE) fillFillersSummary();
                else fillFillers();
            });
        });
        journalObserver.observe(journalScroll);
    }
}

function findActivePeriodIndex() {
    if (PERIODS.length === 0) return 0;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let i = 0; i < PERIODS.length; i++) {
        const per = PERIODS[i];
        const start = new Date(per.start + 'T00:00:00');
        const end = new Date(per.end + 'T23:59:59');
        if (today >= start && today <= end) return i;
    }
    return 0;
}

async function buildDatesForPeriod(periodIndex) {
    if (PERIODS.length === 0) return [];
    const subPeriod = PERIODS[periodIndex];
    if (!subPeriod) return [];

    let classSchedule = ALL_SCHEDULES.find(s => s.class_id === CLASS_ID && s.period_index === periodIndex);
    if (!classSchedule && periodIndex === 0) {
        classSchedule = ALL_SCHEDULES.find(s => s.class_id === CLASS_ID && s.period_index === undefined);
    }
    if (!classSchedule || !classSchedule.grid) return [];

    const grid = classSchedule.grid;
    const result = [];
    const seen = new Set();
    const start = new Date(subPeriod.start + 'T00:00:00');
    const end = new Date(subPeriod.end + 'T23:59:59');
    const cursor = new Date(start);

    while (cursor <= end) {
        const jsDay = cursor.getDay();
        const dayKey = DAYS_KEYS.find(k => DAYS_JS_INDEX[k] === jsDay);
        if (dayKey && grid[dayKey]) {
            const dayGrid = grid[dayKey];
            for (const lessonNumStr in dayGrid) {
                const lesson = dayGrid[lessonNumStr];
                if (lesson && lesson.subject === SUBJECT_NAME) {
                    const iso = formatIso(cursor);
                    const key = iso + '_' + lessonNumStr;
                    if (!seen.has(key)) {
                        seen.add(key);
                        result.push({
                            iso, dateNoYear: formatDateNoYear(cursor), dateFull: formatDateFull(cursor),
                            dayKey, lessonNum: parseInt(lessonNumStr, 10), gradeKey: key
                        });
                    }
                }
            }
        }
        cursor.setDate(cursor.getDate() + 1);
    }
    result.sort((a, b) => a.iso !== b.iso ? a.iso.localeCompare(b.iso) : a.lessonNum - b.lessonNum);
    return result;
}

function formatIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function formatDateNoYear(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function formatDateFull(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }

function renderHeader() {
    document.getElementById('classDropdownName').textContent = CLASS_OBJ.name;
    document.getElementById('subjectDropdownName').textContent = SUBJECT_NAME;
    document.getElementById('teacherLabel').textContent = 'Учитель: ' + (TEACHER_NAME || '—');
    document.getElementById('navChain').textContent = CLASS_OBJ.name + ', ' + SUBJECT_NAME;
    document.getElementById('yearLabel').textContent = '2026/2027 учебный год';
    renderClassDropdownMenu();
    renderSubjectDropdownMenu();
}

function renderClassDropdownMenu() {
    const menu = document.getElementById('classDropdownMenu');
    menu.innerHTML = '';
    ALL_CLASSES.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-menu-item' + (c.id === CLASS_ID ? ' active' : '');
        btn.textContent = c.name;
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (c.id === CLASS_ID) return;
            const schedules = await DB.getAll('class_schedules');
            const subjList = collectSubjectsFromSchedule(schedules, c.id);
            if (subjList.length === 0) { showToast('В классе нет расписания'); return; }
            const subjects = await DB.getAll('subjects');
            const firstSubjObj = subjects.find(s => s.name === subjList[0].name);
            if (!firstSubjObj) { showToast('Предмет не найден'); return; }
            window.location.href = 'journal-view.html?class=' + encodeURIComponent(c.id) + '&subject=' + encodeURIComponent(firstSubjObj.id);
        });
        menu.appendChild(btn);
    });
}

function renderSubjectDropdownMenu() {
    const menu = document.getElementById('subjectDropdownMenu');
    menu.innerHTML = '';
    ALL_CLASS_SUBJECTS.forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-menu-item' + (s.id === SUBJECT_ID ? ' active' : '');
        btn.textContent = s.name;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (s.id === SUBJECT_ID) return;
            window.location.href = 'journal-view.html?class=' + encodeURIComponent(CLASS_ID) + '&subject=' + encodeURIComponent(s.id);
        });
        menu.appendChild(btn);
    });
}

    if (!isOpen) dd.classList.add('open');

function toggleSubjectDropdown(e) {

    const isOpen = dd.classList.contains('open');

}

function renderPeriodTabs() {
    const container = document.getElementById('periodTabs');
    container.innerHTML = '';
    if (PERIODS.length === 0) {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'tab-pill active';
        tab.textContent = 'Периоды не созданы';
        tab.disabled = true;
        container.appendChild(tab);
        return;
    }
    const labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
    PERIODS.forEach((p, idx) => {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'tab-pill' + (!SUMMARY_MODE && idx === ACTIVE_PERIOD_INDEX ? ' active' : '');
        tab.textContent = labels[idx] || ('Период ' + (idx + 1));
        tab.title = p.start + ' – ' + p.end;
        tab.addEventListener('click', async () => {
            commitActiveEditor();
            SUMMARY_MODE = false;
            ACTIVE_PERIOD_INDEX = idx;
            renderPeriodTabs();
            DATES = await buildDatesForPeriod(ACTIVE_PERIOD_INDEX);
            document.getElementById('panelsContainer').classList.remove('summary-mode');
            document.getElementById('mainContent').style.display = '';
            document.getElementById('emptyState').style.display = 'none';
            if (isMobileView()) {
                document.querySelector('.mobile-view-tabs').style.display = '';
                document.getElementById('panelsContainer').classList.add('mobile-show-journal');
                document.getElementById('panelsContainer').classList.remove('mobile-show-plan');
                document.getElementById('mobileTabJournal').classList.add('active');
                document.getElementById('mobileTabPlan').classList.remove('active');
                MOBILE_VIEW = 'journal';
            }
            renderMainTable();
            fillFillers();
            requestAnimationFrame(() => {
                fillFillers();
                fillPlanFillers();
                centerOnToday();
            });
        });
        container.appendChild(tab);
    });
    const summaryTab = document.createElement('button');
    summaryTab.type = 'button';
    summaryTab.className = 'tab-pill summary-tab' + (SUMMARY_MODE ? ' active' : '');
    summaryTab.textContent = 'Итог';
    summaryTab.title = 'Итоговые оценки по всем периодам';
    summaryTab.addEventListener('click', () => {
        commitActiveEditor();
        SUMMARY_MODE = true;
        renderPeriodTabs();
        document.getElementById('mainContent').style.display = '';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('panelsContainer').classList.add('summary-mode');
        if (isMobileView()) {
            document.querySelector('.mobile-view-tabs').style.display = 'none';
        }
        renderSummaryTable();
        requestAnimationFrame(() => {
            fillFillersSummary();
            requestAnimationFrame(fillFillersSummary);
        });
        setTimeout(fillFillersSummary, 50);
        setTimeout(fillFillersSummary, 200);
    });
    container.appendChild(summaryTab);
}

function hlSum(input, active) {
    const td = input.closest('td');
    const tr = input.closest('tr');
    if (!tr) return;
    tr.querySelectorAll('td').forEach(x => x.classList.toggle('highlight-cross', active));
    const jBody = document.getElementById('jBody');
    const rows = Array.from(jBody.querySelectorAll('tr'));
    const rowIdx = rows.indexOf(tr);
    const fioRows = document.querySelectorAll('#fioBody tr');
    if (fioRows[rowIdx]) {
        fioRows[rowIdx].querySelectorAll('td').forEach(x => x.classList.toggle('highlight-cross', active));
    }
    if (td) {
        if (td.classList.contains('col-final')) {
            jBody.querySelectorAll('td.col-final').forEach(x => x.classList.toggle('highlight-cross', active));
        } else if (td.dataset.periodIdx !== undefined) {
            const pi = td.dataset.periodIdx;
            jBody.querySelectorAll('td.col-period[data-period-idx="' + pi + '"]').forEach(x => x.classList.toggle('highlight-cross', active));
        }
    }
    setTimeout(fillFillersSummary, 0);
}

async function upqtrSummary(studentId, periodIdx, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    if (!/^([1-5][+-]?)?$/.test(up)) {
        alert('Для итоговой оценки используйте баллы от 1 до 5');
        inputElement.value = (JOURNAL.qtrGrades[studentId] || {})[periodIdx] || '';
        return;
    }
    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) displayLayer.innerHTML = !up ? '' : '<div class="grade-display"><div style="color:#475569;font-weight:400;font-size:13.5px;">' + escapeHtml(up) + '</div></div>';
    setTimeout(async () => {
        if (!JOURNAL.qtrGrades[studentId]) JOURNAL.qtrGrades[studentId] = {};
        JOURNAL.qtrGrades[studentId][periodIdx] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, EDIT_DELAY_MS);
}

async function upFinal(studentId, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    if (!/^([1-5][+-]?)?$/.test(up)) {
        alert('Для итоговой оценки используйте баллы от 1 до 5');
        inputElement.value = (JOURNAL.qtrGrades[studentId] || {})['final'] || '';
        return;
    }
    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) displayLayer.innerHTML = !up ? '' : '<div class="grade-display"><div style="color:#475569;font-weight:400;font-size:13.5px;">' + escapeHtml(up) + '</div></div>';
    setTimeout(async () => {
        if (!JOURNAL.qtrGrades[studentId]) JOURNAL.qtrGrades[studentId] = {};
        JOURNAL.qtrGrades[studentId]['final'] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, EDIT_DELAY_MS);
}

    const sRow = document.getElementById('sRow');
    const jBody = document.getElementById('jBody');
    const fioBody = document.getElementById('fioBody');
    const pBody = document.getElementById('pBody');

    mRow.innerHTML = ''; sRow.innerHTML = ''; jBody.innerHTML = ''; fioBody.innerHTML = ''; pBody.innerHTML = '';

    const todayIsoStr = todayIso();

    STUDENTS.forEach((student, sIdx) => {
        const shortName = formatShortName(student.full_name);
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.style.cursor = 'pointer';
        td.innerHTML = '<span class="student-number-text">' + (sIdx + 1) + '</span><span class="student-name-text">' + escapeHtml(shortName) + '</span>';
        td.addEventListener('click', () => { window.location.href = 'student-view.html?id=' + encodeURIComponent(student.id); });
        tr.appendChild(td);
        fioBody.appendChild(tr);
    });

    DATES.forEach((d) => {
        const th = document.createElement('th');
        th.className = 'col-date';

function findNearestDateIndex() {
    if (!DATES || DATES.length === 0) return -1;
    const t = todayIso();
    let exact = -1;
    let firstAfter = -1;
    let lastBefore = -1;
    for (let i = 0; i < DATES.length; i++) {
        if (DATES[i].iso === t) { exact = i; break; }
        if (DATES[i].iso < t) lastBefore = i;
        if (DATES[i].iso > t && firstAfter === -1) firstAfter = i;
    }
    if (exact !== -1) return exact;
    if (firstAfter !== -1) return firstAfter;
    if (lastBefore !== -1) return lastBefore;
    return -1;
}

function centerOnToday() {
    const idx = findNearestDateIndex();
    if (idx === -1) return;

    const journalScroll = document.getElementById('journalScroll');
    if (journalScroll && !SUMMARY_MODE) {
        const allDateThs = document.querySelectorAll('#mRow th.col-date');
        const th = allDateThs[idx];
        if (th) {
            const scrollRect = journalScroll.getBoundingClientRect();
            const thRect = th.getBoundingClientRect();
            const contentLeft = thRect.left - scrollRect.left + journalScroll.scrollLeft;
            const targetScrollLeft = contentLeft + thRect.width / 2 - journalScroll.clientWidth / 2;
            journalScroll.scrollLeft = Math.max(0, targetScrollLeft);
        }
    }

    const panelRight = document.getElementById('panelRight');
    if (panelRight) {
        const pBody = document.getElementById('pBody');
        const rows = pBody ? pBody.querySelectorAll('tr.lesson-row:not(.plan-filler-row)') : [];
        const row = rows[idx];
        if (row) {
            const panelRect = panelRight.getBoundingClientRect();
            const rowRect = row.getBoundingClientRect();
            const contentTop = rowRect.top - panelRect.top + panelRight.scrollTop;
            const targetScrollTop = contentTop + rowRect.height / 2 - panelRight.clientHeight / 2;
            panelRight.scrollTop = Math.max(0, targetScrollTop);
        }
    }
}

function fillPlanFillers() {
    const pBody = document.getElementById('pBody');
    if (!pBody) return;
    pBody.querySelectorAll('.plan-filler-row').forEach(r => r.remove());

    const panelRight = document.getElementById('panelRight');
    if (!panelRight) return;
    if (document.getElementById('panelsContainer').classList.contains('summary-mode')) return;

    const table = document.getElementById('lessonPlanTable');
    if (!table) return;

    const panelRect = panelRight.getBoundingClientRect();
    const tableRect = table.getBoundingClientRect();
    const freeSpace = panelRect.bottom - tableRect.bottom;

    if (freeSpace <= 0) return;

    const rowH = getPlanFillerRowHeight();
    const fullRows = Math.floor(freeSpace / rowH);
    const remainder = Math.round(freeSpace - fullRows * rowH);

    for (let i = 0; i < fullRows; i++) {
        pBody.appendChild(createPlanFillerRow(null));
    }
    if (remainder >= 4) {
        pBody.appendChild(createPlanFillerRow(remainder + 'px'));
    }
}

function createPlanFillerRow(height) {
    const tr = document.createElement('tr');
    tr.className = 'lesson-row plan-filler-row';

    const td1 = document.createElement('td');
    td1.className = 'lesson-num-cell plan-filler-cell';
    if (height) td1.style.height = height;
    tr.appendChild(td1);

    const td2 = document.createElement('td');
    td2.className = 'lesson-date-cell plan-filler-cell';
    if (height) td2.style.height = height;
    tr.appendChild(td2);

    const td3 = document.createElement('td');
    td3.className = 'theme-cell plan-filler-cell';
    if (height) td3.style.height = height;
    tr.appendChild(td3);

    const td4 = document.createElement('td');
    td4.className = 'homework-cell plan-filler-cell';
    if (height) td4.style.height = height;
    tr.appendChild(td4);

    return tr;
}

function renderThemeContent(cell, gradeKey, value) {

        ph.className = 'placeholder-text';
        ph.textContent = 'Добавить тему';
        cell.appendChild(ph);

        const div = document.createElement('div');

function openThemeEditInline(cell, gradeKey, value) {
    cell.innerHTML = '';
    const bubble = document.createElement('div');
    bubble.className = 'edit-bubble';
    const ta = document.createElement('textarea');
    ta.rows = 1;
    ta.value = value || '';
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'confirm-btn';
    ok.title = 'Сохранить';
    ok.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    bubble.appendChild(ta);
    bubble.appendChild(ok);
    cell.appendChild(bubble);
    autoGrow(ta);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    const commit = () => {
        const txt = ta.value.trim();
        if (!JOURNAL.lessons[gradeKey]) JOURNAL.lessons[gradeKey] = { t: '', h: [] };
        JOURNAL.lessons[gradeKey].t = txt;
        renderThemeContent(cell, gradeKey, txt);
        saveJournal();
    };
    const cancel = () => {
        const current = (JOURNAL.lessons[gradeKey] && JOURNAL.lessons[gradeKey].t) || value || '';
        renderThemeContent(cell, gradeKey, current);
    };

    const ed = { commit, cancel, dom: bubble, textarea: ta, timer: null };
    activeEditor = ed;

    const scheduleCommit = () => {
        if (ed.timer) return;
        ed.timer = setTimeout(() => {
            ed.timer = null;
            if (activeEditor === ed) activeEditor = null;
            try { commit(); } catch (e) { console.error(e); }
        }, EDIT_DELAY_MS);
    };

    ta.addEventListener('input', () => autoGrow(ta));
    ta.addEventListener('blur', () => { scheduleCommit(); });
    ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (ed.timer) { clearTimeout(ed.timer); ed.timer = null; } commitActiveEditor(); }
        if (e.key === 'Escape') { e.preventDefault(); if (ed.timer) { clearTimeout(ed.timer); ed.timer = null; } cancelActiveEditor(); }
    });
    ok.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); });
    ok.addEventListener('click', (e) => { e.stopPropagation(); if (ed.timer) { clearTimeout(ed.timer); ed.timer = null; } commitActiveEditor(); });
}

function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(28, el.scrollHeight) + 'px';
}

function fillFillers() {
    document.querySelectorAll('.marks-table .col-filler-head').forEach(el => el.remove());
    document.querySelectorAll('.marks-table tbody td.col-filler-body').forEach(el => el.remove());

    const journalScroll = document.getElementById('journalScroll');
    if (!journalScroll) return;
    if (isMobileView() && MOBILE_VIEW !== 'journal') return;

    const scrollWidth = journalScroll.clientWidth;
    const fioWrapper = document.querySelector('.fio-table-wrapper');
    const fioWidth = fioWrapper ? Math.ceil(fioWrapper.getBoundingClientRect().width) : 210;
    const marksWrapper = document.querySelector('.marks-table-wrapper');
    if (!marksWrapper) return;

    const marksWidth = Math.ceil(marksWrapper.getBoundingClientRect().width);
    const freeSpace = scrollWidth - fioWidth - marksWidth;
    if (freeSpace <= 0) return;

    const colW = getFillerColWidth();
    const fullCols = Math.floor(freeSpace / colW);
    const remainder = Math.round(freeSpace - fullCols * colW);

    const mRow = document.getElementById('mRow');
    const sRow = document.getElementById('sRow');
    const jBody = document.getElementById('jBody');

    for (let i = 0; i < fullCols; i++) {
        [mRow, sRow].forEach(row => {
            const th = document.createElement('th');
            th.className = 'col-filler-head';
            th.style.width = colW + 'px';
            th.style.minWidth = colW + 'px';
            th.style.maxWidth = colW + 'px';
            row.appendChild(th);
        });
    }
    jBody.querySelectorAll('tr').forEach(tr => {
        for (let i = 0; i < fullCols; i++) {
            const td = document.createElement('td');
            td.className = 'col-filler-body';
            td.style.width = colW + 'px';
            td.style.minWidth = colW + 'px';
            td.style.maxWidth = colW + 'px';
            tr.appendChild(td);
        }
    });

    if (remainder >= 2) {
        const rw = remainder + 'px';
        [mRow, sRow].forEach(row => {
            const th = document.createElement('th');
            th.className = 'col-filler-head col-filler-last';
            th.style.width = rw;
            th.style.minWidth = rw;
            th.style.maxWidth = rw;
            row.appendChild(th);
        });
        jBody.querySelectorAll('tr').forEach(tr => {
            const td = document.createElement('td');
            td.className = 'col-filler-body col-filler-last';
            td.style.width = rw;
            td.style.minWidth = rw;
            td.style.maxWidth = rw;
            tr.appendChild(td);
        });
    }
}

function fillFillersSummary() {
    document.querySelectorAll('.marks-table .col-filler-head').forEach(el => el.remove());
    document.querySelectorAll('.marks-table tbody td.col-filler-body').forEach(el => el.remove());

    const journalScroll = document.getElementById('journalScroll');
    if (!journalScroll) return;

    const scrollWidth = journalScroll.clientWidth;
    const fioWrapper = document.querySelector('.fio-table-wrapper');
    const fioWidth = fioWrapper ? Math.ceil(fioWrapper.getBoundingClientRect().width) : 210;
    const marksWrapper = document.querySelector('.marks-table-wrapper');
    if (!marksWrapper) return;

    const marksWidth = Math.ceil(marksWrapper.getBoundingClientRect().width);
    const freeSpace = scrollWidth - fioWidth - marksWidth;
    if (freeSpace <= 0) return;

    const colW = getFillerColWidth();
    const fullCols = Math.floor(freeSpace / colW);
    const remainder = Math.round(freeSpace - fullCols * colW);

    const mRow = document.getElementById('mRow');
    const jBody = document.getElementById('jBody');

    for (let i = 0; i < fullCols; i++) {
        const th = document.createElement('th');
        th.className = 'col-filler-head';
        th.setAttribute('rowspan', '2');
        th.style.width = colW + 'px';
        th.style.minWidth = colW + 'px';
        th.style.maxWidth = colW + 'px';
        mRow.appendChild(th);
    }
    jBody.querySelectorAll('tr').forEach(tr => {
        for (let i = 0; i < fullCols; i++) {
            const td = document.createElement('td');
            td.className = 'col-filler-body';
            td.style.width = colW + 'px';
            td.style.minWidth = colW + 'px';
            td.style.maxWidth = colW + 'px';
            tr.appendChild(td);
        }
    });

    if (remainder >= 2) {
        const rw = remainder + 'px';
        const th = document.createElement('th');
        th.className = 'col-filler-head col-filler-last';
        th.setAttribute('rowspan', '2');
        th.style.width = rw;
        th.style.minWidth = rw;
        th.style.maxWidth = rw;
        mRow.appendChild(th);
        jBody.querySelectorAll('tr').forEach(tr => {
            const td = document.createElement('td');
            td.className = 'col-filler-body col-filler-last';
            td.style.width = rw;
            td.style.minWidth = rw;
            td.style.maxWidth = rw;
            tr.appendChild(td);
        });
    }
}

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (SUMMARY_MODE) { fillFillersSummary(); }
        else {
            if (isMobileView()) {
                if (MOBILE_VIEW === 'journal') fillFillers();
                else fillPlanFillers();
            } else {
                fillFillers();
                fillPlanFillers();
            }
        }
    }, 100);
});

function getGradeClass(value) {
    if (!value || typeof value !== 'string') return '';
    const base = value.trim().charAt(0);
    if (base === '1' || base === '2') return 'bad-grade';
    if (base === '3') return 'grade-3';
    if (base === '4' || base === '5') return 'grade-4';
    return '';
}

function makeGradeDisplay(v) {
    if (!v) return '';
    let up = v.toUpperCase().trim();
    if (!up) return '';
    let letterPart = '';
    const foundLetter = up.match(/^(Н|О|Б|П|СП)/);
    if (foundLetter) letterPart = '<span class="status-letter">' + foundLetter[0] + '</span>';
    let gradePart = up.replace(/^(Н|О|Б|П|СП)/, '').trim();
    if (!gradePart) return letterPart;
    if (gradePart.includes('/')) {
        const parts = gradePart.split('/');
        return letterPart + '<div class="grade-display">' +
            '<div class="double-grade-box ' + getGradeClass(parts[0]) + '">' + parts[0] + '</div>' +
            '<span class="slash-divider">/</span>' +
            '<div class="double-grade-box ' + getGradeClass(parts[1]) + '">' + (parts[1] || '') + '</div>' +
        '</div>';
    }
    return letterPart + '<div class="grade-display"><div class="grade-box ' + getGradeClass(gradePart) + '">' + gradePart + '</div></div>';
}

function hl(input, colIdx, active) {
    const tr = input.closest('tr');
    if (tr) {
        tr.querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
        const trIndex = Array.from(tr.parentNode.children).indexOf(tr);
        const fioRows = document.querySelectorAll('#fioBody tr');
        if (fioRows[trIndex]) fioRows[trIndex].querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
    }
    document.querySelectorAll('#jBody td[data-col="' + colIdx + '"]').forEach(td => td.classList.toggle('highlight-cross', active));
    setTimeout(fillFillers, 0);
}

function hlQtr(input, active) {
    const tr = input.closest('tr');
    if (tr) {
        tr.querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
        const trIndex = Array.from(tr.parentNode.children).indexOf(tr);
        const fioRows = document.querySelectorAll('#fioBody tr');
        if (fioRows[trIndex]) fioRows[trIndex].querySelectorAll('td').forEach(td => td.classList.toggle('highlight-cross', active));
    }
    document.querySelectorAll('#jBody td.col-qtr').forEach(td => td.classList.toggle('highlight-cross', active));
    setTimeout(fillFillers, 0);
}

function getEditableCellsInRow(tr) {
    return Array.from(tr.querySelectorAll('td')).filter(td => td.dataset.col !== undefined || td.classList.contains('col-qtr') || td.classList.contains('col-period'));
}

function navigateGradeCell(input, direction) {
    const td = input.closest('td');
    if (!td) return;
    const tr = td.closest('tr');
    if (!tr) return;
    const jBody = document.getElementById('jBody');
    const rows = Array.from(jBody.querySelectorAll('tr'));
    const rowIdx = rows.indexOf(tr);
    if (rowIdx === -1) return;
    const cellsInRow = getEditableCellsInRow(tr);
    const colIdx = cellsInRow.indexOf(td);
    if (colIdx === -1) return;
    let targetTd = null;
    if (direction === 'left' || direction === 'right') {
        const nextCol = direction === 'left' ? colIdx - 1 : colIdx + 1;
        if (nextCol < 0 || nextCol >= cellsInRow.length) return;
        targetTd = cellsInRow[nextCol];
    } else {
        const nextRow = direction === 'up' ? rowIdx - 1 : rowIdx + 1;
        if (nextRow < 0 || nextRow >= rows.length) return;
        const targetCells = getEditableCellsInRow(rows[nextRow]);
        targetTd = targetCells[colIdx] || null;
    }
    if (!targetTd) return;
    const targetInput = targetTd.querySelector('input');
    if (!targetInput) return;
    targetInput.focus();
    setTimeout(() => { try { targetInput.select(); } catch (e) {} }, 0);
}

function handleGradeKeydown(e, input) {
    const key = e.key;
    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'ArrowUp' && key !== 'ArrowDown') return;
    const val = input.value || '';
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || 0;
    const atStart = start === 0 && end === 0;
    const atEnd = start === val.length && end === val.length;
    if (key === 'ArrowLeft' && !atStart) return;
    if (key === 'ArrowRight' && !atEnd) return;
    e.preventDefault();
    navigateGradeCell(input, key === 'ArrowLeft' ? 'left' : key === 'ArrowRight' ? 'right' : key === 'ArrowUp' ? 'up' : 'down');
}

async function upg(studentId, gradeKey, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    const validRegex = /^(([НОБП]|СП)\s*)?([1-5][+-]?(\/([1-5][+-]?)?)?)?$/i;
    if (!validRegex.test(up)) {
        alert('Используйте оценки от 1 до 5 (можно с + или -, двойные через /), буквы отсутствия (Н, О, Б, П, СП)');
        inputElement.value = (JOURNAL.grades[studentId] || {})[gradeKey] || '';
        return;
    }
    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) displayLayer.innerHTML = !up ? '' : '<div class="grade-display"><div style="color:#475569; font-weight:400; font-size:13.5px;">' + escapeHtml(up) + '</div></div>';
    setTimeout(async () => {
        if (!JOURNAL.grades[studentId]) JOURNAL.grades[studentId] = {};
        JOURNAL.grades[studentId][gradeKey] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, EDIT_DELAY_MS);
}

async function upqtr(studentId, inputElement) {
    const v = inputElement.value.trim();
    const up = v.toUpperCase();
    if (!/^([1-5][+-]?)?$/.test(up)) {
        alert('Для итоговой оценки используйте баллы от 1 до 5');
        inputElement.value = (JOURNAL.qtrGrades[studentId] || {})[ACTIVE_PERIOD_INDEX] || '';
        return;
    }
    const displayLayer = inputElement.previousElementSibling;
    if (displayLayer) displayLayer.innerHTML = !up ? '' : '<div class="grade-display"><div style="color:#475569;font-weight:400;font-size:13.5px;">' + escapeHtml(up) + '</div></div>';
    setTimeout(async () => {
        if (!JOURNAL.qtrGrades[studentId]) JOURNAL.qtrGrades[studentId] = {};
        JOURNAL.qtrGrades[studentId][ACTIVE_PERIOD_INDEX] = up;
        await saveJournal();
        if (displayLayer) displayLayer.innerHTML = makeGradeDisplay(up);
    }, EDIT_DELAY_MS);
}

async function saveJournal() {
    await DB.upsertJournal(CLASS_ID, SUBJECT_ID, {
        grades: JOURNAL.grades,
        lessons: JOURNAL.lessons,
        qtr_grades: JOURNAL.qtrGrades,
        lesson_types: JOURNAL.lessonTypes
    });
}

let currentLessonTypeContext = { gradeKey: null };
let popupJustOpened = false;

function openLessonTypePopup(anchorEl, gradeKey) {
    commitActiveEditor();
    const popup = document.getElementById('lessonTypePopup');
    const search = document.getElementById('lessonTypePopupSearch');
    currentLessonTypeContext = { gradeKey };
    popupJustOpened = true;
    search.value = '';
    renderLessonTypePopupList();
    popup.classList.add('show');
    const rect = anchorEl.getBoundingClientRect();
    const popupWidth = 260, popupMaxHeight = 340;
    let left = rect.left + rect.width / 2 - popupWidth / 2;
    if (left < 8) left = 8;
    if (left + popupWidth > window.innerWidth - 8) left = window.innerWidth - popupWidth - 8;
    let top = rect.bottom + 4;
    if (top + popupMaxHeight > window.innerHeight - 8) { top = rect.top - popupMaxHeight - 4; if (top < 8) top = 8; }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    setTimeout(() => search.focus(), 50);
    setTimeout(() => { popupJustOpened = false; }, 100);
}

function renderLessonTypePopupList() {
    const list = document.getElementById('lessonTypePopupList');
    const search = (document.getElementById('lessonTypePopupSearch').value || '').toLowerCase().trim();
    const currentAbbr = (JOURNAL.lessonTypes || {})[currentLessonTypeContext.gradeKey] || 'ОТВ';
    list.innerHTML = '';
    const filtered = LESSON_TYPES.filter(t => !search || t.abbr.toLowerCase().includes(search) || t.full.toLowerCase().includes(search));
    if (filtered.length === 0) { list.innerHTML = '<div class="lesson-type-popup-empty">Ничего не найдено</div>'; return; }
    filtered.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lesson-type-popup-item' + (t.abbr === currentAbbr ? ' active' : '');
        btn.innerHTML = '<span class="abbr">' + escapeHtml(t.abbr) + '</span><span class="full">' + escapeHtml(t.full) + '</span>';
        btn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); selectLessonType(t.abbr); });
        list.appendChild(btn);
    });
}

async function selectLessonType(abbr) {
    const { gradeKey } = currentLessonTypeContext;
    if (!gradeKey) return;
    JOURNAL.lessonTypes[gradeKey] = abbr;
    await saveJournal();
    const th = document.querySelector('th.type-lesson-col[data-grade-key="' + gradeKey + '"]');
    if (th) th.textContent = abbr;
    closeLessonTypePopup();
}

function closeLessonTypePopup() { document.getElementById('lessonTypePopup').classList.remove('show'); }

document.addEventListener('click', (e) => {
    const popup = document.getElementById('lessonTypePopup');
    if (!popup.classList.contains('show') || popupJustOpened) return;
    if (!popup.contains(e.target)) closeLessonTypePopup();
});
document.addEventListener('mousedown', (e) => {
    const popup = document.getElementById('lessonTypePopup');
    if (!popup.classList.contains('show') || popupJustOpened) return;
    if (!popup.contains(e.target) && !e.target.closest('.type-lesson-col')) closeLessonTypePopup();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLessonTypePopup(); });

function toggleLeftPanel() {
    if (SUMMARY_MODE) return;
    if (isMobileView()) { switchMobileView('plan'); return; }
    const container = document.getElementById('panelsContainer');
    const tabLeft = document.getElementById('tabLeft');
    leftCollapsed = !leftCollapsed;
    container.classList.toggle('left-collapsed', leftCollapsed);
    tabLeft.classList.toggle('active', leftCollapsed);
    if (leftCollapsed) {
        rightCollapsed = false;
        container.classList.remove('right-collapsed');
        document.getElementById('tabRight').classList.remove('active');
    }
    updateTabIcons();
    requestAnimationFrame(() => { fillFillers(); fillPlanFillers(); });
    setTimeout(() => { fillFillers(); fillPlanFillers(); }, 100);
    setTimeout(() => { fillFillers(); fillPlanFillers(); }, 350);
}

function toggleRightPanel() {
    if (SUMMARY_MODE) return;
    if (isMobileView()) { switchMobileView('journal'); return; }
    const container = document.getElementById('panelsContainer');
    const tabRight = document.getElementById('tabRight');
    rightCollapsed = !rightCollapsed;
    container.classList.toggle('right-collapsed', rightCollapsed);
    tabRight.classList.toggle('active', rightCollapsed);
    if (rightCollapsed) {
        leftCollapsed = false;
        container.classList.remove('left-collapsed');
        document.getElementById('tabLeft').classList.remove('active');
    }
    updateTabIcons();
    requestAnimationFrame(() => { fillFillers(); fillPlanFillers(); });
    setTimeout(() => { fillFillers(); fillPlanFillers(); }, 100);
    setTimeout(() => { fillFillers(); fillPlanFillers(); }, 350);
}

function updateTabIcons() {
    const tabLeft = document.getElementById('tabLeft');
    const tabRight = document.getElementById('tabRight');
    const iconLeft = leftCollapsed
        ? '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>'
        : '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>';
    const iconRight = rightCollapsed
        ? '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>'
        : '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>';
    tabLeft.innerHTML = '<svg viewBox="0 0 24 24">' + iconLeft + '</svg>Раскрыть журнал';
    tabRight.innerHTML = '<svg viewBox="0 0 24 24">' + iconRight + '</svg>Раскрыть поуроч. план';
}

function showEmpty(title, text) {
    document.getElementById('mainContent').style.display = 'none';
    const empty = document.getElementById('emptyState');
    empty.style.display = 'block';
    document.getElementById('emptyTitle').textContent = title;
    document.getElementById('emptyText').textContent = text;
}

function goBack() { window.location.href = 'admin.html'; }

init().catch(err => {
    console.error('Ошибка init:', err);
    showEmpty('Ошибка', 'Не удалось загрузить журнал. Проверьте консоль (F12).');
});
updateTabIcons();
