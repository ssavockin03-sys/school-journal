<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успеваемость — Дневник.ру</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===================== БАЗА ===================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #ffffff; min-height: 100vh; }
        body { font-family: "Open Sans", Arial, sans-serif; font-size: 15px; color: #0f3159; min-width: 990px; }
        .app-shell { width: 100%; max-width: 968px; margin: 0 auto; position: relative; }
        .header-inner-wrap { width: 940px; margin: 0 auto; position: relative; }

        /* ===================== ШАПКА ===================== */
        .header { background: #fff; width: 100%; padding: 0; border-bottom: 1px solid #e0e0e0; position: relative; z-index: 15; }
        .header-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; height: 60px; }
        .logo { font-size: 22px; color: #0273b2; font-weight: 700; text-decoration: none; }
        .logo span { font-weight: 400; color: #777; }
        .user-zone { display: flex; align-items: center; gap: 20px; }
        .user-info { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
        .user-name { font-weight: 700; font-size: 14px; }
        .user-role { font-size: 11px; color: #777; text-transform: uppercase; }
        .user-actions { display: flex; gap: 12px; font-size: 13px; }
        .user-actions a { color: #0273b2; text-decoration: none; }
        .user-actions a.logout { color: #d9534f; }

        /* ===================== МЕНЮ ===================== */
        .header-menu { height: 45px; width: 940px; background-color: #0273b2; border-radius: 5px 5px 0 0; margin: 0 14px; display: block; padding: 0; list-style: none; position: relative; }
        .header-menu > li { display: inline-block; height: 45px; line-height: 45px; float: left; }
        .header-menu > li > a { display: block; height: 100%; padding: 0 20px; color: #fff; text-decoration: none; font-size: 14px; border-bottom: 3px solid transparent; }
        .header-menu > li > a.active { background: #015b8e; border-bottom-color: #fff; font-weight: 600; }

        /* ===================== ПОДМЕНЮ ===================== */
        .header-submenu { position: absolute; top: 45px; left: 0; width: 938px; height: 42px; background-color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.11); display: flex; align-items: center; font-size: 14px; overflow: hidden; padding-left: 0; list-style: none; margin: 0; border-radius: 0 0 5px 5px; }
        .header-submenu__item { margin: 0 0 0 18px; height: 42px; list-style-type: none; display: flex; align-items: center; }
        .header-submenu__link { text-decoration: none; color: #000; padding: 11px 0; display: block; font-size: 14px; line-height: 20px; border-bottom: 2px solid transparent; }
        .header-submenu__link:hover { color: #0273b2; }
        .header-submenu__item_active .header-submenu__link { color: #0273b2; border-bottom-color: #0273b2; }

        /* ===================== КОНТЕНТ ===================== */
        .content-wrap { padding: 60px 14px 60px; width: 100%; max-width: 968px; margin: 0 auto; }
        .top-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .student-name { font-size: 18px; font-weight: 700; flex-shrink: 0; }
        .toolbar-center { flex: 1; display: flex; justify-content: center; min-width: 0; }
        
        .view-switch { display: flex; font-family: "Open Sans", sans-serif; border-radius: 8px; font-weight: 600; font-size: 14px; background-color: #fff; padding: 1px; box-shadow: 0 3.11111px 6.22222px rgba(0,0,0,0.06); border: 1px solid #e5eaf0; margin: 0 auto; }
        .view-btn { margin: 1px; padding: 5px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; color: #0f3159; background: transparent; border: none; font-family: inherit; font-size: inherit; font-weight: inherit; }
        .view-btn.active { background: #2f80ed; color: #fff; }
        .view-pane { display: none; }
        .view-pane.active { display: block; }

        /* ===================== ТЕКУЩАЯ (ДНЕВНИК) ===================== */
        .diary-container { background-color: #cbd9f3; border-radius: 8px; padding: 20px 0; position: relative; width: 100%; overflow: hidden; }
        
        .week-grid-wrapper { position: relative; padding: 0 40px; }
        
        .week-grid { 
            display: flex; 
            gap: 6px; 
            width: 100%;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .week-grid::-webkit-scrollbar { display: none; }

        .day-column { 
            flex: 1 1 0;
            min-width: 120px;
            background: #fff; 
            box-shadow: 0 3.11111px 6.22222px rgba(0, 0, 0, 0.06); 
            border-radius: 8px; 
            padding-bottom: 8px; 
            border: 1px solid #61a5e3; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        .day-header { 
            padding: 10px 12px; 
            font-weight: 600; 
            font-size: 14px; 
            color: #fff; 
            background-color: #61a5e3; 
            text-align: left; 
        }
        .day-column.weekend .day-header { background-color: #c4d0e0; }
        .day-header.today { background-color: #2f80ed; }

        .day-body { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .lesson-card { display: flex; flex-direction: column; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; position: relative; }
        .lesson-card:last-child { border-bottom: none; }
        .lesson-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 2px; }
        .lesson-meta { font-size: 11px; color: #777; margin-bottom: 4px; }
        .lesson-hw { font-size: 12px; color: #333; background: #f8f9fb; padding: 6px 8px; border-radius: 6px; margin-top: 4px; display: flex; align-items: flex-start; gap: 6px; }
        .lesson-hw input { margin-top: 2px; cursor: pointer; }

        /* Плитки оценок */
        .dnevnik-grade-tile { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 6px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; position: absolute; top: 0; right: 0; cursor: pointer; }
        
        /* Градиенты как в student.html */
        .dnevnik-grade-tile.g5, .dnevnik-grade-tile.g4, .dnevnik-grade-tile-table.g5, .dnevnik-grade-tile-table.g4 { background-image: linear-gradient(-45deg, #b4ec51 0%, #429321 100%); background-color: #4b9a25; }
        .dnevnik-grade-tile.g3, .dnevnik-grade-tile-table.g3 { background-image: linear-gradient(-38deg, #fad961 0%, #f76b1c 100%); background-color: #ff8f00; }
        .dnevnik-grade-tile.g2, .dnevnik-grade-tile.g1, .dnevnik-grade-tile-table.g2, .dnevnik-grade-tile-table.g1 { background-image: linear-gradient(-45deg, #ff7a7a 0%, #c0392b 100%); background-color: #cf3838; }
        .dnevnik-grade-tile.gn, .dnevnik-grade-tile-table.gn { background: #94acc8; }

        .weekend-text { text-align: center; color: #999; font-size: 13px; margin-top: 20px; }

        .scroll-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0f3159;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
        }
        .scroll-arrow:hover { background-color: #f0f7ff; border-color: #2f80ed; }
        .scroll-arrow.left { left: 0; }
        .scroll-arrow.right { right: 0; }

        /* ===================== ТАБЛИЦА (ПО ПЕРИОДАМ) ===================== */
        .period-tabs-wrapper { margin-bottom: 16px; }
        .period-tabs-group { display: flex; font-family: "Open Sans", sans-serif; border: 1px solid #e0e7ed; border-radius: 8px; font-weight: 400; font-size: 14px; line-height: 19px; background-color: #fff; align-items: center; margin-right: auto; width: fit-content; }
        .tab-pill { margin: 6px 0; padding: 0 8px; border-style: solid; border-color: #e0e7ed; border-width: 0 1px 0 0; color: #0f3159; font-weight: 400; cursor: pointer; background: transparent; font-family: inherit; font-size: inherit; line-height: inherit; }
        .tab-pill:first-child { border-radius: 8px 0 0 8px; }
        .tab-pill:last-child { border-radius: 0 8px 8px 0; border-width: 0; }
        .tab-pill.active { padding: 6px 8px; margin: -1px; border: 1px solid #2f80ed; border-radius: 8px; color: #2f80ed; z-index: 1; background: #fff; }

        .dnevnik-marks-wrapper { background: transparent; border-radius: 12px; border: 1px solid #e5eaf0; overflow: hidden; margin-bottom: 20px; }
        .dnevnik-table-header { background: #f2f6fb; font-weight: 700; font-size: 15px; color: #0273b2; padding: 12px 16px; border-bottom: 1px solid #e5eaf0; }
        .dnevnik-marks-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; table-layout: fixed; }
        .dnevnik-marks-table th { background: #f9f9f9; font-weight: 600; font-size: 11px; color: #777; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid #e5eaf0; text-align: left; }
        .dnevnik-marks-table th.center { text-align: center; }
        .dnevnik-marks-table td { min-height: 28px; vertical-align: middle; padding: 10px 12px; border-bottom: 1px solid #e5eaf0; font-size: 12px; line-height: 1.4; }
        .dnevnik-marks-table tr:last-child td { border-bottom: none; }
        .dnevnik-marks-table td.subject-name { font-weight: 600; color: #333; font-size: 14px; }
        
        /* Обычные оценки в таблице */
        .dnevnik-grade-tile-table {
            display: inline-block;
            height: 17px;
            box-sizing: border-box;
            color: #fff;
            padding: 4px;
            font-weight: 400;
            font-size: 14px;
            line-height: 9px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 4px;
            margin-bottom: 4px;
            text-align: center;
            min-width: 17px;
            vertical-align: middle;
            transition: transform 0.1s;
        }
        .dnevnik-grade-tile-table:hover { transform: scale(1.15); }

        /* --- НОВЫЕ СРЕДНИЕ БАЛЛЫ (КУБИКИ) --- */
        .dnevnik-avg-tile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px; 
            height: 48px;
            border-radius: 10px;
            color: #fff;
            font-size: 28px;
            font-weight: 400;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            vertical-align: middle;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }

        /* Градиенты для среднего балла */
        .dnevnik-avg-tile.avg-green { background-image: linear-gradient(-45deg, #b4ec51 0%, #429321 100%); }
        .dnevnik-avg-tile.avg-orange { background-image: linear-gradient(-38deg, #fad961 0%, #f76b1c 100%); }
        .dnevnik-avg-tile.avg-red { background-image: linear-gradient(-45deg, #ff7a7a 0%, #c0392b 100%); }
        .dnevnik-avg-tile.avg-empty { background: #e2e8f0; color: #94a3b8; box-shadow: none; font-size: 20px; }

        .dnevnik-qtr-tile { display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 48px; border-radius: 10px; font-weight: 400; font-size: 28px; color: #fff; line-height: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .dnevnik-qtr-tile.g5, .dnevnik-qtr-tile.g4 { background-image: linear-gradient(-45deg, #b4ec51 0%, #429321 100%); }
        .dnevnik-qtr-tile.g3 { background-image: linear-gradient(-38deg, #fad961 0%, #f76b1c 100%); }
        .dnevnik-qtr-tile.g2, .dnevnik-qtr-tile.g1 { background-image: linear-gradient(-45deg, #ff7a7a 0%, #c0392b 100%); }
        .dnevnik-qtr-tile.no-grade { background: #e2e8f0; color: #94a3b8; font-size: 20px; box-shadow: none; }

        /* ===================== МОДАЛКИ И ЧАТ ===================== */
        #subjectModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        #subjectModal.show { display: flex; }
        .subj-modal-box { background: #fff; width: 100%; max-width: 700px; border-radius: 8px; padding: 24px; color: #333; position: relative; }
        .subj-modal-close { position: absolute; top: 15px; right: 15px; background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        #gradeStatModal { display: none; position: fixed; inset: 0; background: rgba(26,43,74,0.45); backdrop-filter: blur(2px); z-index: 1100; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.2s ease; }
        #gradeStatModal.show { display: flex; opacity: 1; }
        .stat-modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); padding: 22px 22px 26px; position: relative; transform: translateY(10px); transition: transform 0.2s ease; }
        #gradeStatModal.show .stat-modal-box { transform: translateY(0); }
        .stat-modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; background: #e2e8f0; border: none; border-radius: 50%; color: #64748b; font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .stat-modal-close:hover { background: #cbd5e1; color: #334155; }
        
        .stat-modal-subject { font-size: 24px; font-weight: 700; color: #1e293b; line-height: 1.2; margin-bottom: 4px; padding-right: 30px; }
        .stat-modal-meta { font-size: 14px; color: #64748b; margin-bottom: 16px; }
        .stat-modal-divider { height: 1px; background: #e2e8f0; margin: 0 -22px 16px; }
        .stat-modal-teacher { font-size: 14px; color: #64748b; margin-bottom: 18px; }
        .stat-modal-teacher span { color: #64748b; }
        .stat-modal-teacher b { color: #1e293b; font-weight: 400; }

        .stat-card { background: #f1f5f9; border-radius: 16px; padding: 18px 20px; display: flex; gap: 20px; align-items: stretch; }
        .stat-left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        .stat-title { font-size: 14px; font-weight: 700; color: #1e293b; text-align: center; }
        
        .stat-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .stat-circle::before { content: ''; position: absolute; inset: 8px; background: #f1f5f9; border-radius: 50%; }
        .stat-circle-value { position: relative; z-index: 1; font-size: 32px; font-weight: 400; color: #475569; line-height: 1; }
        
        .stat-avg { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 6px; }
        .stat-avg-pill { background: #65A30D; color: #fff; padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
        .stat-avg-pill.up::after { content: '↑'; font-size: 14px; }

        .stat-right { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
        .stat-right-title { font-size: 14px; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 4px; }
        .stat-row { display: flex; align-items: center; gap: 8px; }
        .stat-row-badge { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
        .stat-row-badge.g5, .stat-row-badge.g4 { background: #65A30D; }
        .stat-row-badge.g3 { background: #FB923C; }
        .stat-row-badge.g2, .stat-row-badge.g1 { background: #DC2626; }
        .stat-row-text { font-size: 14px; color: #1e293b; white-space: nowrap; }

        #chatFab { position: fixed; right: 20px; bottom: 20px; z-index: 9998; height: 44px; padding: 0 18px; background: #0273b2; color: #fff; border: none; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        #chatFab svg { width: 18px; height: 18px; fill: currentColor; }
        #chatPanel { position: fixed; right: 20px; bottom: 76px; z-index: 9999; width: 320px; height: 480px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; flex-direction: column; overflow: hidden; }
        #chatPanel.show { display: flex; }
        .chat-header { padding: 12px 16px; background: #0273b2; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        .chat-header-close { background: rgba(255,255,255,0.2); border: none; width: 26px; height: 26px; border-radius: 50%; color: #fff; cursor: pointer; }
        .chat-contacts { flex: 1; overflow-y: auto; }
        .chat-contact { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-avatar { width: 36px; height: 36px; border-radius: 50%; background: #eee; color: #555; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #f9f9f9; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
        .chat-msg.mine { align-self: flex-end; background: #0273b2; color: #fff; border-bottom-right-radius: 2px; }
        .chat-msg.theirs { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 2px; }
        .chat-input-bar { display: flex; gap: 6px; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        .chat-input-bar input { flex: 1; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 18px; font-size: 13px; }
        .chat-send-btn { width: 36px; height: 36px; border-radius: 50%; background: #0273b2; border: none; cursor: pointer; color: #fff; }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="header">
        <div class="header-top">
            <a href="#" class="logo">Дневник<span>.ру</span></a>
            <div class="user-zone">
                <div class="user-info">
                    <span class="user-name" id="userName">&nbsp;</span>
                    <span class="user-role">Ученик</span>
                </div>
                <div class="user-actions">
                    <a href="#" onclick="return false">Помощь</a>
                    <a href="#" class="logout" onclick="logout()">Выход</a>
                </div>
            </div>
        </div>
        
        <div class="header-inner-wrap">
            <ul class="header-menu">
                <li><a href="#" class="active" onclick="return false">ОБРАЗОВАНИЕ</a></li>
                <li><a href="#" onclick="return false">ОБЩЕНИЕ</a></li>
                <li><a href="#" onclick="return false">ПРИЛОЖЕНИЯ</a></li>
                
                <ul class="header-submenu">
                    <li class="header-submenu__item"><a href="student.html" class="header-submenu__link">Сегодня</a></li>
                    <li class="header-submenu__item header-submenu__item_active"><a href="student-performance.html" class="header-submenu__link">Успеваемость</a></li>
                    <li class="header-submenu__item"><a href="student-group.html" class="header-submenu__link">Моя группа</a></li>
                    <li class="header-submenu__item"><a href="student-schedule.html" class="header-submenu__link">Расписание</a></li>
                </ul>
            </ul>
        </div>
    </header>
</div>

<div class="content-wrap">
    <div class="top-toolbar">
        <div class="student-name" id="studentName">Загрузка...</div>
        <div class="toolbar-center">
            <div class="view-switch" id="viewSwitch">
                <button class="view-btn active" data-view="current" type="button">Текущая</button>
                <button class="view-btn" data-view="semesters" id="btnSemesters" type="button">По периодам</button>
                <button class="view-btn" data-view="rating" type="button">Рейтинг</button>
            </div>
        </div>
    </div>

    <div class="view-pane active" id="pane-current">
        <div id="diaryContent"></div>
    </div>

    <div class="view-pane" id="pane-semesters">
        <div id="warningContainer"></div>
        <div class="period-tabs-wrapper"><div class="period-tabs-group" id="periodTabs"></div></div>
        <div id="gradesTableContainer"></div>
    </div>

    <div class="view-pane" id="pane-rating">
        <div id="ratingContent"></div>
    </div>
</div>

<div id="subjectModal">
    <div class="subj-modal-box">
        <button class="subj-modal-close" onclick="document.getElementById('subjectModal').classList.remove('show')">×</button>
        <div class="subj-modal-title" id="subjModalTitle"></div>
        <div class="subj-info-card" id="subjModalInfo"></div>
        <div class="subj-list" id="subjModalList"></div>
    </div>
</div>

<div id="gradeStatModal" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="stat-modal-box" onclick="event.stopPropagation()" id="statModalContent"></div>
</div>

<button id="chatFab" type="button" title="Чаты">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    Чаты
</button>
<div id="chatPanel"></div>

<script src="supabase-config.js"></script>
<script>
    // ================================================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ================================================================
    const DAYS_KEYS   = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']; 
    const DAYS_RU     = { mon: 'Пн', tue: 'Вт', wed: 'Ср', thu: 'Чт', fri: 'Пт', sat: 'Сб', sun: 'Вс' };
    const JS_DAY_MAP  = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat', 0: 'sun' };
    const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    
    const PERIOD_NAMES = { 'Четверти': 'четверть', 'Семестры': 'семестр', 'Триместры': 'триместр', 'Полугодия': 'полугодие' };

    let ALL_ROOMS = [];
    let ALL_STUDENTS = [];

    let PERIODS = [];

    function escapeHtml(text) { if (text === null || text === undefined) return ''; const div = document.createElement('div'); div.textContent = String(text); return div.innerHTML; }
    function formatDateRu(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
    function formatDateShort(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`; }
    function formatDateHuman(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
    function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function parseKey(key) { const p = String(key).split('_'); const d = new Date(p[0] + 'T00:00:00'); return { date: isNaN(d.getTime()) ? null : d, dateRu: isNaN(d.getTime()) ? p[0] : formatDateRu(d), lesson: p[1] || '' }; }
    function parseCell(raw) { if (raw === null || raw === undefined || raw === '') return { grade: '', presence: '' }; const s = String(raw).toUpperCase().trim(); const m = s.match(/^(СП|Н|О|Б|П)/); let presence = ''; let grade = s; if (m) { presence = m[0]; grade = s.slice(presence.length).trim(); } return { grade, presence }; }
    function gradeClass(grade) { const s = String(grade == null ? '' : grade); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); if (c >= 49 && c <= 53) { const d = c - 48; if (d === 5 || d === 4) return 'g5'; if (d === 3) return 'g3'; if (d === 2 || d === 1) return 'g2'; } } return 'gn'; }
    function firstDigit(v) { const s = String(v == null ? '' : v); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); if (c >= 49 && c <= 53) return c - 48; } return null; }
    function getMondayOfCurrentWeek() { const t = new Date(); t.setHours(0,0,0,0); const dow = t.getDay(); const diff = (dow === 0 ? -6 : 1 - dow); const m = new Date(t); m.setDate(t.getDate() + diff); return m; }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
    function getLessonTypeFullName(abbr) { const map = { 'ОТВ': 'Ответ на уроке', 'К/Р': 'Контрольная работа', 'С/Р': 'Самостоятельная работа', 'Д': 'Диктант', 'СОЧ': 'Сочинение', 'И': 'Изложение', 'Тест': 'Тест', 'ПР': 'Проверочная работа', 'Л/Р': 'Лабораторная работа', 'Пр-т': 'Проект', 'РЕФ': 'Реферат', 'Зчт': 'Зачет', 'ДОК': 'Доклад', 'Р/У': 'Работа на уроке', 'РНО': 'Работа над ошибками', 'О': 'Опрос', 'Д/Р': 'Домашняя работа', 'УС': 'Устный счет', 'Наиз': 'Наизусть', 'ЧИТ': 'Чтение' }; return map[abbr] || abbr; }

    async function logout() {
        if (!confirm('Выйти из кабинета?')) return;
        try { const fb = await window._fbReady; await fb.signOut(fb.auth); } catch (e) {}
        try { localStorage.removeItem('sj_session'); } catch (e) {}
        window.location.replace('index.html');
    }

    function calcAverageFromValues(values) {
        let sum = 0, cnt = 0;
        (values || []).forEach(raw => {
            if (raw === null || raw === undefined) return;
            const parsed = parseCell(raw);
            const cleaned = String(parsed.grade || '').replace(/[НОБП]|СП/g, '').trim();
            if (!cleaned) return;
            if (cleaned.includes('/')) {
                cleaned.split('/').forEach(p => { const d = firstDigit(p); if (d !== null) { sum += d; cnt++; } });
            } else {
                const d = firstDigit(cleaned);
                if (d !== null) { sum += d; cnt++; }
            }
        });
        return cnt === 0 ? null : sum / cnt;
    }

    // Функция для определения цвета кубика среднего балла
    function getAvgClass(avg) {
        if (avg === null || avg === undefined) return 'avg-empty';
        if (avg <= 2.5) return 'avg-red';
        if (avg <= 3.49) return 'avg-orange';
        return 'avg-green'; // 3.5 - 5
    }

    function setupViewSwitcher() {
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
                document.getElementById('pane-' + e.currentTarget.dataset.view).classList.add('active');
            });
        });
    }

    function getPeriodForDate(date) {
        if (!date || !PERIODS.length) return null;
        const dStr = isoDate(date);
        return PERIODS.find(p => dStr >= p.start && dStr <= p.end) || null;
    }
    function getPeriodIndexForDate(date) {
        const period = getPeriodForDate(date);
        if (!period) return null;
        return PERIODS.indexOf(period);
    }
    function getGridForDate(date) {
        const idx = getPeriodIndexForDate(date);
        if (idx === null) return null;
        const schedule = CURRENT_SCHEDULES.find(s => s.period_index === idx);
        if (schedule && schedule.grid) return schedule.grid;
        if (CURRENT_SCHEDULES.length > 0 && CURRENT_SCHEDULES[0].grid) return CURRENT_SCHEDULES[0].grid;
        return null;
    }

    function findActivePeriodIndex() {
        if (PERIODS.length === 0) return 0;
        const t = new Date(); t.setHours(0,0,0,0);
        for (let i = 0; i < PERIODS.length; i++) {
            const s = new Date(PERIODS[i].start + 'T00:00:00');
            const e = new Date(PERIODS[i].end + 'T23:59:59');
            if (t >= s && t <= e) return i;
        }
        return 0;
    }

    function collectAllStudentGrades() {
        const result = [];
        ALL_JOURNALS.forEach(journal => {
            const sg = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            const subjObj = ALL_SUBJECTS.find(s => s.id === journal.subject_id);
            if (!subjObj) return;
            Object.entries(sg).forEach(([key, val]) => {
                if (val === '' || val === null || val === undefined) return;
                const parsed = parseKey(key);
                const cell = parseCell(val);
                const base = { subject: subjObj.name, subjectObj: subjObj, key, date: parsed.date, dateRu: parsed.dateRu, lesson: parsed.lesson };
                if (cell.grade) result.push({ ...base, kind: 'grade', grade: cell.grade, presence: '' });
                if (cell.presence) result.push({ ...base, kind: 'presence', grade: '', presence: cell.presence });
            });
        });
        return result;
    }

        renderRating();

    function renderDiary() {
        const container = document.getElementById('diaryContent');
        if (!CURRENT_STUDENT) { container.innerHTML = 'Загрузка...'; return; }
        
        const monday = CURRENT_WEEK_START;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        
        let html = `
        <div class="diary-container">
            <div class="week-grid-wrapper">
                <button class="scroll-arrow left" id="scrollLeftBtn">‹</button>
                <div class="week-grid" id="weekGrid">
        `;
        
        let maxLesson = 7;
        CURRENT_SCHEDULES.forEach(s => {
            if (!s.grid) return;
            Object.values(s.grid).forEach(dayGrid => {
                Object.keys(dayGrid || {}).forEach(num => { const n = parseInt(num, 10); if (!isNaN(n) && n > maxLesson) maxLesson = n; });
            });
        });
        
        const all = collectAllStudentGrades();
        
        DAYS_KEYS.forEach((dayKey, idx) => {
            const date = addDays(monday, idx);
            const isWeekend = (dayKey === 'sun');
            const isToday = date.getTime() === today.getTime();
            
            const grid = getGridForDate(date);
            const dayGrid = (grid && grid[dayKey]) || {};
            
            let lessonsHtml = '';
            
            if (isWeekend) {
                lessonsHtml = `<div class="weekend-text">Выходной день</div>`;
            } else {
                for (let n = 1; n <= maxLesson; n++) {
                    const lesson = dayGrid[n] || dayGrid[String(n)];
                    if (!lesson || !lesson.subject) continue;
                    
                    let teacherName = lesson.teacherName || '';
                    if (!teacherName && lesson.teacherId) { const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId); if (t) teacherName = t.full_name; }
                    let roomName = lesson.roomName || '';
                    if (!roomName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) roomName = r.number; }
                    
                    const timeStr = lesson.start && lesson.end ? `${lesson.start} - ${lesson.end}` : '';
                    const roomStr = roomName ? `, ${roomName} каб.` : '';
                    const metaText = `${timeStr}${roomStr}`.replace(/^,\s*/, '');
                    
                    const key = isoDate(date) + '_' + n;
                    let topic = '', homework = '';
                    const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
                    if (subjObj) {
                        const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                        if (journal && journal.lessons && journal.lessons[key]) { topic = journal.lessons[key].t || ''; homework = journal.lessons[key].h || ''; }
                    }
                    
                    const gradeRec = all.find(g => g.subject === lesson.subject && g.key === key && g.kind === 'grade');
                    const presRec  = all.find(g => g.subject === lesson.subject && g.key === key && g.kind === 'presence');
                    const gradeVal = gradeRec ? gradeRec.grade : null;
                    const presVal  = presRec ? presRec.presence : null;

                    let gradesWrap = '';
                    if (presVal)  gradesWrap += `<span class="dnevnik-grade-tile ${gradeClass(presVal)}">${presVal}</span>`;
                    if (gradeVal) gradesWrap += `<span class="dnevnik-grade-tile ${gradeClass(gradeVal)}">${gradeVal}</span>`;

                    let hwHtml = '';
                    if (homework) {
                        hwHtml = `<div class="lesson-hw"><input type="checkbox"> <span>${homework}</span></div>`;
                    } else if (topic) {
                        hwHtml = `<div class="lesson-hw"><input type="checkbox"> <span>${topic}</span></div>`;
                    }

                    lessonsHtml += `<div class="lesson-card">
                        ${gradesWrap}
                        <div class="lesson-title">${n}. ${lesson.subject}</div>
                        <div class="lesson-meta">${metaText}</div>
                        ${hwHtml}
                    </div>`;
                }
            }
            
            const headerClass = isWeekend ? 'weekend' : (isToday ? 'today' : '');
            const headerBg = isWeekend ? 'background-color:#c4d0e0;' : (isToday ? 'background-color:#2f80ed;' : '');
            
            html += `<div class="day-column ${isWeekend ? 'weekend' : ''}">
                <div class="day-header" style="${headerBg}">${DAYS_RU[dayKey]}, ${formatDateShort(date)}${isToday ? ', сегодня' : ''}</div>
                <div class="day-body">${lessonsHtml}</div>
            </div>`;
        });
        
        html += `
                </div>
                <button class="scroll-arrow right" id="scrollRightBtn">›</button>
            </div>
        </div>`;
        container.innerHTML = html;

        const gridEl = document.getElementById('weekGrid');
        const leftBtn = document.getElementById('scrollLeftBtn');
        const rightBtn = document.getElementById('scrollRightBtn');

        const checkScroll = () => {
            if (gridEl.scrollWidth <= gridEl.clientWidth) {
                leftBtn.style.display = 'none';
                rightBtn.style.display = 'none';
            } else {
                leftBtn.style.display = 'flex';
                rightBtn.style.display = 'flex';
            }
        };
        checkScroll();
        window.addEventListener('resize', checkScroll);

        leftBtn.addEventListener('click', () => { gridEl.scrollBy({ left: -250, behavior: 'smooth' }); });
        rightBtn.addEventListener('click', () => { gridEl.scrollBy({ left: 250, behavior: 'smooth' }); });
    }

    function renderWarnings() {
        const container = document.getElementById('warningContainer');
        if (!CURRENT_STUDENT) return;
        container.innerHTML = '';
    }

    function renderPeriodTabs() {
        const container = document.getElementById('periodTabs');
        if (!container) return;
        container.innerHTML = '';

        });

        totalTab.className = 'tab-pill';

    function getScheduleSubjects() {
        const set = new Set();
        CURRENT_SCHEDULES.forEach(s => {
            if (!s.grid) return;
            Object.values(s.grid).forEach(g => Object.values(g || {}).forEach(l => { if (l && l.subject) set.add(l.subject); }));
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function getPeriodRange() {
        if (PERIODS.length === 0) return null;
        const p = PERIODS[ACTIVE_PERIOD_INDEX];
        if (!p) return null;
        return { start: p.start, end: p.end };
    }

    function renderGradesTable() {
        const container = document.getElementById('gradesTableContainer');
        if (!CURRENT_STUDENT) { container.innerHTML = 'Загрузка...'; return; }
        
        const subjectsFromSchedule = getScheduleSubjects();
        if (subjectsFromSchedule.length === 0) {
            container.innerHTML = `<div style="text-align:center;padding:40px;color:#999;">Расписание ещё не составлено.</div>`;
            return;
        }
        
        const range = getPeriodRange();
        
        let periodLabel = 'Итог';
        if (PERIODS.length > 0 && PERIODS[ACTIVE_PERIOD_INDEX]) {
            const pName = PERIOD_NAMES[PERIOD_SYSTEM] || 'Период';
            periodLabel = (ACTIVE_PERIOD_INDEX + 1) + ' ' + pName;
        }

        let html = '<div class="dnevnik-marks-wrapper">';
        html += '<div class="dnevnik-table-header">' + periodLabel + '</div>';
        html += '<table class="dnevnik-marks-table">';
        html += '<colgroup><col style="width:40%"><col style="width:45%"><col style="width:8%"><col style="width:7%"></colgroup>';
        html += '<thead><tr><th>Предмет</th><th>Оценки</th><th class="center">Ср. балл</th><th class="center">' + periodLabel + '</th></tr></thead><tbody>';

        subjectsFromSchedule.forEach(subjectName => {
            const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
            if (!subjObj) {
                html += `<tr><td class="subject-name">${escapeHtml(subjectName)}</td><td colspan="3" style="color:#999;font-style:italic;">Журнал не найден</td></tr>`;
                return;
            }

            const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id && j.class_id === CURRENT_STUDENT.class_id);
            
            if (!journal) {
                html += `<tr><td class="subject-name">${escapeHtml(subjectName)}</td><td colspan="3" style="color:#999;font-style:italic;">Журнал не найден</td></tr>`;
                return;
            }

            let displayGrades = [];
            
            const sg = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            Object.entries(sg).forEach(([key, val]) => {
                if (!val) return;
                if (range) {
                    const dateStr = key.split('_')[0];
                    if (dateStr < range.start || dateStr > range.end) return;
                }
                const cell = parseCell(val);
                if (cell.grade) displayGrades.push({ val: cell.grade, key, kind: 'grade' });
                if (cell.presence) displayGrades.push({ val: cell.presence, key, kind: 'presence' });
            });
            
            displayGrades.sort((a, b) => a.key.localeCompare(b.key));
            const avg = calcAverageFromValues(displayGrades.map(x => x.val));

            const qtrGrades = journal.qtr_grades ? (journal.qtr_grades[CURRENT_STUDENT.id] || {}) : {};
            const periodQtr = qtrGrades[ACTIVE_PERIOD_INDEX] || qtrGrades[String(ACTIVE_PERIOD_INDEX)] || null;

            html += '<tr>';
            html += `<td class="subject-name">${escapeHtml(subjectName)}</td>`;
            
            if (displayGrades.length === 0) {
                html += '<td><span style="color:#999;font-style:italic;font-size:12px;">Нет оценок</span></td>';
            } else {
                html += '<td>';
                displayGrades.forEach(item => {
                    const cls = gradeClass(item.val);
                    const safeSubj = escapeHtml(subjectName).replace(/'/g, "\\'");
                    const safeVal = escapeHtml(item.val).replace(/'/g, "\\'");
                    const safeKey = escapeHtml(item.key).replace(/'/g, "\\'");
                    html += `<span class="dnevnik-grade-tile-table ${cls}" onclick="openGradeStat('${safeSubj}','${safeVal}','${safeKey}','${item.kind}')">${item.val}</span>`;
                });
                html += '</td>';
            }
            
            // ВЫВОДИМ СРЕДНИЙ БАЛЛ КАК КУБИК
            if (avg !== null) {
                const avgCls = getAvgClass(avg);
                html += `<td class="avg-cell" style="text-align:center;">
                    <div class="dnevnik-avg-tile ${avgCls}" style="margin: 0 auto;">
                        ${avg.toFixed(2).replace(/\.00$/, '')}
                    </div>
                </td>`;
            } else {
                html += `<td class="avg-cell" style="text-align:center;">
                    <div class="dnevnik-avg-tile avg-empty" style="margin: 0 auto;">—</div>
                </td>`;
            }

            if (periodQtr) {
                html += `<td class="qtr-cell" style="text-align:center;"><span class="dnevnik-qtr-tile ${gradeClass(periodQtr)}">${periodQtr}</span></td>`;
            } else {
                html += `<td class="qtr-cell" style="text-align:center;"><span class="dnevnik-qtr-tile no-grade">-</span></td>`;
            }
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    function fmtScore(n) { return n == null ? '—' : Number(n).toFixed(2); }

    function calcStudentOverallAvg(studentId, classId, periodRange) {
        let sum = 0, count = 0;
        ALL_JOURNALS.forEach(journal => {
            const sg = journal.grades && journal.grades[studentId];
            if (!sg) return;
            Object.entries(sg).forEach(([key, val]) => {
                if (periodRange) {
                    const dStr = key.split('_')[0];
                    if (dStr < periodRange.start || dStr > periodRange.end) return;
                }
                const d = firstDigit(parseCell(val).grade);
                if (d) { sum += d; count++; }
            });
        });
        return count > 0 ? sum / count : null;
    }

    function renderRating() {
        const container = document.getElementById('ratingContent');
        if (!container) return;
        if (!CURRENT_STUDENT || !CURRENT_CLASS) { container.innerHTML = 'Загрузка...'; return; }

        const periodRange = getPeriodRange();
        const myId = CURRENT_STUDENT.id;
        const myClassId = CURRENT_CLASS.id;

        const classStudents = ALL_STUDENTS.filter(s => s.class_id === myClassId);
        const classAvgs = classStudents.map(s => ({
            id: s.id, full_name: s.full_name, avg: calcStudentOverallAvg(s.id, myClassId, periodRange)
        })).filter(x => x.avg != null).sort((a, b) => b.avg - a.avg);

        let html = `<div style="text-align:center;font-size:22px;font-weight:700;margin-bottom:24px;">Ваш рейтинг</div>`;
        html += `<div style="background:#f9f9f9;border-radius:5px;padding:20px;margin-bottom:20px;">`;
        html += `<div style="font-size:16px;font-weight:700;margin-bottom:12px;">Рейтинг в классе</div>`;
        if (classAvgs.length === 0) {
            html += `<div style="color:#999;">Нет данных</div>`;
        } else {
            classAvgs.slice(0, 5).forEach((row, i) => {
                const isMe = row.id === myId;
                html += `<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:5px;margin-bottom:4px;${isMe ? 'background:#fff;border:1px solid #0273b2;' : ''}">
                    <div style="width:28px;height:28px;border-radius:50%;background:#eee;color:#555;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">${i+1}</div>
                    <div style="flex:1;font-weight:600;font-size:13px;">${escapeHtml(row.full_name)}</div>
                    <div style="font-weight:700;color:#0273b2;">${fmtScore(row.avg)}</div>
                </div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    window.openGradeStat = function(subjectName, value, lessonKey, kind) {
        if (!CURRENT_STUDENT) return;

        const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
        const journal = subjObj ? ALL_JOURNALS.find(j => j.subject_id === subjObj.id && j.class_id === CURRENT_STUDENT.class_id) : null;
        const parsed = parseKey(lessonKey);
        const lessonType = (journal && journal.lesson_types && journal.lesson_types[lessonKey]) || DEFAULT_LESSON_TYPE;
        const typeFullName = getLessonTypeFullName(lessonType);

        const parsedCell = parseCell(value);
        const myGrade = parsedCell.grade;
        const myDigit = firstDigit(myGrade) || 0;

        let teacherName = '—';
        const grid = getGridForDate(parsed.date);
        if (grid) {
            const dowKey = JS_DAY_MAP[parsed.date.getDay()];
            if (dowKey) {
                const dayGrid = grid[dowKey] || {};
                const lessonInGrid = dayGrid[parsed.lesson] || dayGrid[String(parsed.lesson)];
                if (lessonInGrid) {
                    teacherName = lessonInGrid.teacherName || '—';
                    if (!teacherName && lessonInGrid.teacherId) {
                        const t = ALL_TEACHERS.find(x => x.id === lessonInGrid.teacherId);
                        if (t) teacherName = t.full_name;
                    }
                }
            }
        }

        let currentPeriod = null;
        if (parsed.date) {
            const dStr = isoDate(parsed.date);
            currentPeriod = PERIODS.find(p => dStr >= p.start && dStr <= p.end);
        }

        let sum = 0, count = 0;
        if (journal && journal.grades && journal.grades[CURRENT_STUDENT.id]) {
            Object.entries(journal.grades[CURRENT_STUDENT.id]).forEach(([key, val]) => {
                if (currentPeriod) {
                    const dPart = key.split('_')[0];
                    if (dPart < currentPeriod.start || dPart > currentPeriod.end) return;
                }
                const d = firstDigit(parseCell(val).grade);
                if (d) { sum += d; count++; }
            });
        }
        const avg = count > 0 ? (sum / count).toFixed(2).replace('.', ',') : '—';

        const classCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
        if (journal && journal.grades && CURRENT_CLASS) {
            const classStudentIds = ALL_STUDENTS.filter(s => s.class_id === CURRENT_CLASS.id).map(s => s.id);
            classStudentIds.forEach(sid => {
                const sg = journal.grades[sid];
                if (!sg || !sg[lessonKey]) return;
                const digit = firstDigit(parseCell(sg[lessonKey]).grade);
                if (digit >= 1 && digit <= 5) classCounts[digit]++;
            });
        }

        let ringGradient = '';
        if (myDigit === 5) {
            ringGradient = `conic-gradient(#65A30D 0deg 360deg)`;
        } else if (myDigit === 4) {
            ringGradient = `conic-gradient(#DC2626 0deg 30deg, #65A30D 30deg 288deg, #e2e8f0 288deg 360deg)`;
        } else if (myDigit === 3) {
            ringGradient = `conic-gradient(#DC2626 0deg 45deg, #FB923C 45deg 120deg, #65A30D 120deg 216deg, #e2e8f0 216deg 360deg)`;
        } else if (myDigit === 2) {
            ringGradient = `conic-gradient(#DC2626 0deg 144deg, #e2e8f0 144deg 360deg)`;
        } else if (myDigit === 1) {
            ringGradient = `conic-gradient(#DC2626 0deg 280deg, #e2e8f0 280deg 360deg)`;
        } else {
            ringGradient = `conic-gradient(#e2e8f0 0deg 360deg)`;
        }

        const modalContent = document.getElementById('statModalContent');
        modalContent.innerHTML = `
            <button class="stat-modal-close" onclick="document.getElementById('gradeStatModal').classList.remove('show')">×</button>
            <div class="stat-modal-subject">${escapeHtml(subjectName)}</div>
            <div class="stat-modal-meta">${escapeHtml(typeFullName)}, ${formatDateHuman(parsed.date)}.</div>
            <div class="stat-modal-divider"></div>
            <div class="stat-modal-teacher"><span>Учитель:</span> <b>${escapeHtml(teacherName)}</b></div>
            
            <div class="stat-card">
                <div class="stat-left">
                    <div class="stat-title">Ваша оценка</div>
                    <div class="stat-circle" style="background: ${ringGradient};">
                        <div class="stat-circle-value">${myDigit || '—'}</div>
                    </div>
                    <div class="stat-avg">
                        ср. балл <div class="stat-avg-pill ${myDigit >= 3 ? 'up' : ''}">${avg}</div>
                    </div>
                </div>
                <div class="stat-right">
                    <div class="stat-right-title">Одноклассники</div>
                    ${[5, 4, 3, 2, 1].map(g => {
                        const cnt = classCounts[g];
                        const cls = g >= 4 ? 'g5' : (g === 3 ? 'g3' : 'g2');
                        const word = cnt % 10 === 1 && cnt % 100 !== 11 ? 'ученик' : (cnt % 10 >= 2 && cnt % 10 <= 4 && (cnt % 100 < 10 || cnt % 100 >= 20) ? 'ученика' : 'учеников');
                        return `<div class="stat-row"><div class="stat-row-badge ${cls}">${g}</div><div class="stat-row-text">${cnt} ${word}</div></div>`;
                    }).join('')}
                </div>
            </div>
        `;

        document.getElementById('gradeStatModal').classList.add('show');
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.getElementById('gradeStatModal').classList.remove('show');
    });

    function initChat() {
        console.log('Chat init');
    }
</script>
