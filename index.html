<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник.ру — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: #fff; border-radius: 24px;
            padding: 44px 40px; max-width: 420px; width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            animation: appear 0.4s ease;
        }
        @keyframes appear {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        .logo {
            width: 64px; height: 64px; margin: 0 auto 20px;
            background: linear-gradient(135deg, #2a5298, #3b7dd8);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo svg { width: 34px; height: 34px; fill: #fff; }

        .title    { font-size: 24px; font-weight: 700; color: #1a2b4a; text-align: center; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: #7a8aa3; text-align: center; margin-bottom: 28px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5a72; margin-bottom: 7px; }
        .form-group input {
            width: 100%; height: 50px; padding: 0 16px; font-size: 15px;
            color: #1a2b4a; background: #f7f9fc; border: 2px solid #e2e8f0;
            border-radius: 12px; outline: none; transition: all 0.25s ease;
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: #2a5298; background: #fff;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .btn {
            width: 100%; height: 52px; margin-top: 8px;
            background: linear-gradient(135deg, #2a5298, #3b7dd8); color: #fff;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(42, 82, 152, 0.35);
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(42, 82, 152, 0.45); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error {
            background: #fff0f0; color: #d32f2f; padding: 12px 14px;
            border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 16px; display: none; border: 1px solid #ffd6d6;
        }
        .error.show { display: block; }

        .hint {
            margin-top: 20px; padding: 14px; background: #f0f5ff;
            border-radius: 12px; font-size: 12px; color: #4a5a72;
            line-height: 1.5; text-align: center;
        }

        .status {
            margin-top: 16px; text-align: center;
            font-size: 13px; color: #2a5298; font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
        </div>
        <div class="title">Вход в школьный журнал</div>
        <div class="subtitle">Введите логин и пароль</div>

        <div class="error" id="errorBox"></div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="loginInput">Логин</label>
                <input type="text" id="loginInput" placeholder="Например: ivanov.ivan" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="passwordInput">Пароль</label>
                <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Войти</button>
        </form>

        <div class="status" id="statusBox"></div>

        <div class="hint">
            🔒 Безопасный вход. Сессия — 24 часа.<br>
            Роль определяется автоматически.
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
    // ============================================================
    // КОНФИГ FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyD1d1JQioGL8lHON8ydgtpHU1EXEwD00SY",
        authDomain: "school-journal-8f39a.firebaseapp.com",
        projectId: "school-journal-8f39a",
        storageBucket: "school-journal-8f39a.firebasestorage.app",
        messagingSenderId: "254973926699",
        appId: "1:254973926699:web:43a7d8109df5366163396e"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const AUTH_EMAIL_DOMAIN = '@school-journal-8f39a.firebaseapp.com';
    const SESSION_KEY = 'sj_session';
    const SESSION_DURATION_MS = 24 * 60 * 60 * 1000; // 24 часа

    const ROUTES = {
        admin:   'admin.html',
        teacher: 'teacher.html',
        student: 'journal-view.html'
    };

    // ============================================================
    // DOM
    // ============================================================
    const form        = document.getElementById('loginForm');
    const loginInput  = document.getElementById('loginInput');
    const passInput   = document.getElementById('passwordInput');
    const loginBtn    = document.getElementById('loginBtn');
    const errorBox    = document.getElementById('errorBox');
    const statusBox   = document.getElementById('statusBox');

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function showError(text) {
        errorBox.textContent = text;
        errorBox.classList.add('show');
        statusBox.textContent = '';
    }
    function clearError() {
        errorBox.classList.remove('show');
        errorBox.textContent = '';
    }
    function setStatus(text) {
        statusBox.textContent = text || '';
    }

    function saveSession(user, role) {
        try {
            localStorage.setItem(SESSION_KEY, JSON.stringify({
                uid: user.uid,
                email: user.email,
                role: role,
                loggedAt: Date.now(),
                expiresAt: Date.now() + SESSION_DURATION_MS
            }));
        } catch (e) {}
    }

    function getSession() {
        try {
            const raw = localStorage.getItem(SESSION_KEY);
            if (!raw) return null;
            const s = JSON.parse(raw);
            if (!s.expiresAt || Date.now() > s.expiresAt) {
                localStorage.removeItem(SESSION_KEY);
                return null;
            }
            return s;
        } catch (e) {
            return null;
        }
    }

    function clearSession() {
        try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    // ============================================================
    // ОПРЕДЕЛЕНИЕ РОЛИ
    // ============================================================
    async function determineRole(user) {
        if (!user || !user.email) return null;

        // 1. Админ: документ в коллекции admins с ID = uid
        try {
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            if (adminDoc.exists) {
                const data = adminDoc.data() || {};
                if (!data.role || data.role === 'admin') return 'admin';
            }
        } catch (e) {
            console.warn('Ошибка проверки admins:', e);
        }

        const login = user.email.split('@')[0];

        // 2. Учитель: teachers.where('login','==',login)
        try {
            const snap = await db.collection('teachers')
                .where('login', '==', login).limit(1).get();
            if (!snap.empty) return 'teacher';
        } catch (e) {
            console.warn('Ошибка проверки teachers:', e);
        }

        // 3. Ученик: students.where('login','==',login)
        try {
            const snap = await db.collection('students')
                .where('login', '==', login).limit(1).get();
            if (!snap.empty) return 'student';
        } catch (e) {
            console.warn('Ошибка проверки students:', e);
        }

        return null;
    }

    // ============================================================
    // РЕДИРЕКТ ПО РОЛИ
    // ============================================================
    function redirectByRole(role) {
        const url = ROUTES[role];
        if (!url) {
            showError('Неизвестная роль: ' + role);
            return false;
        }
        // replace — чтобы кнопка "назад" не возвращала на форму входа
        window.location.replace(url);
        return true;
    }

    // ============================================================
    // ВХОД
    // ============================================================
    async function loginFlow(rawLogin, password) {
        clearError();

        const login = String(rawLogin || '').trim();
        if (!login || !password) {
            showError('Введите логин и пароль');
            return;
        }

        const email = login.includes('@') ? login : login + AUTH_EMAIL_DOMAIN;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Проверка...';
        setStatus('Авторизация...');

        try {
            const cred = await auth.signInWithEmailAndPassword(email, password);
            const user = cred.user;

            setStatus('Определяем роль...');
            const role = await determineRole(user);

            if (!role) {
                setStatus('');
                showError('Доступ запрещён: роль не найдена. Обратитесь к администратору.');
                try { await auth.signOut(); } catch (e) {}
                clearSession();
                return;
            }

            saveSession(user, role);
            setStatus('Роль: ' + role + '. Переходим...');
            redirectByRole(role);

        } catch (err) {
            console.error('Ошибка входа:', err);
            let msg = 'Не удалось войти. Проверьте логин и пароль.';
            switch (err.code) {
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                case 'auth/invalid-login-credentials':
                    msg = 'Неверный логин или пароль.';
                    break;
                case 'auth/user-not-found':
                    msg = 'Пользователь не найден.';
                    break;
                case 'auth/too-many-requests':
                    msg = 'Слишком много попыток. Попробуйте позже.';
                    break;
                case 'auth/network-request-failed':
                    msg = 'Ошибка сети. Проверьте интернет.';
                    break;
                case 'auth/invalid-email':
                    msg = 'Некорректный логин.';
                    break;
            }
            showError(msg);
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        loginFlow(loginInput.value, passInput.value);
    });

    // ============================================================
    // АВТОВХОД ПРИ ЗАГРУЗКЕ
    // ============================================================
    window.addEventListener('load', async () => {
        // Ждём восстановления сессии Firebase
        const user = await new Promise((resolve) => {
            const unsub = auth.onAuthStateChanged((u) => {
                unsub();
                resolve(u);
            });
        });

        if (!user) {
            // Нет активной сессии Firebase — показываем форму
            clearSession();
            return;
        }

        // Есть Firebase-пользователь. Проверяем сохранённую сессию.
        const session = getSession();

        // Если сессия валидна и uid совпадает — сразу редиректим
        if (session && session.uid === user.uid && session.role && ROUTES[session.role]) {
            setStatus('Возвращаемся в кабинет...');
            redirectByRole(session.role);
            return;
        }

        // Иначе — определяем роль заново и редиректим
        setStatus('Определяем роль...');
        const role = await determineRole(user);

        if (!role) {
            setStatus('');
            showError('Доступ запрещён: роль не найдена.');
            try { await auth.signOut(); } catch (e) {}
            clearSession();
            return;
        }

        saveSession(user, role);
        setStatus('Роль: ' + role + '. Переходим...');
        redirectByRole(role);
    });
    </script>
</body>
</html>
