<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест цвета</title>
<style>
body { font-family: Arial, sans-serif; padding: 40px; background: #f0f4f9; }
h2 { color: #1a2b4a; margin-bottom: 20px; }
.box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 60px; height: 60px; border-radius: 12px;
    color: #fff; font-size: 26px; font-weight: 600;
    margin: 6px;
}
.test-row { margin-bottom: 10px; }
.test-row b { display: inline-block; width: 80px; color: #333; }
</style>
</head>
<body>
<h2>Тест: цвета оценок с плюсами и минусами</h2>
<div id="out"></div>

<script>
function bgColor(value) {
    var s = String(value == null ? '' : value);
    for (var i = 0; i < s.length; i++) {
        var c = s.charCodeAt(i);
        if (c >= 49 && c <= 53) { // символы '1'..'5'
            var d = c - 48;
            if (d === 5 || d === 4) return '#65A30D'; // зелёный
            if (d === 3)            return '#FB923C'; // оранжевый
            if (d === 2 || d === 1) return '#DC2626'; // красный
        }
    }
    return '#94A3B8'; // серый
}

// Тестируем разные значения
var testValues = ['5', '5+', '5-', '4', '4+', '4-', '3', '3+', '2', '2-', '1', '5/4', '2/3-', 'Н', '', 'Н5'];
var out = document.getElementById('out');

testValues.forEach(function (v) {
    var color = bgColor(v);
    var row = document.createElement('div');
    row.className = 'test-row';
    row.innerHTML = '<b>' + (v === '' ? '(пусто)' : v) + ':</b>' +
        '<span class="box" style="background:' + color + ';">' + (v === '' ? '?' : v) + '</span>' +
        ' <span style="color:#666;font-family:monospace;">' + color + '</span>';
    out.appendChild(row);
});

console.log('Тест завершён. Проверь цвета выше.');
</script>
</body>
</html>
