<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #fff; }
body { min-height: 100vh; color: #1a2b4a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; padding: 0; }

@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 15px; color: #5a6a85; font-weight: 500; }

.app-shell { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

.logo { font-size: 22px; color: #007baf; }

.d-user-profile-zone { display: flex; align-items: center; gap: 40px; }

.d-top-blue-bar { background: #166a94; }

<script>
const DAYS_KEYS = ['mon','tue','wed','thu','fri','sat'];
const DAYS_RU = { mon:'Пн', tue:'Вт', wed:'Ср', thu:'Чт', fri:'Пт', sat:'Сб' };
const DAYS_FULL = { mon:'Понедельник', tue:'Вторник', wed:'Среда', thu:'Четверг', fri:'Пятница', sat:'Суббота', sun:'Воскресенье' };
const JS_DAY_MAP = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri', 6:'sat' };
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DEFAULT_LESSON_TYPE = 'ОТВ';
const PERIOD_LABELS = {
    'Четверти':  ['I четверть','II четверть','III четверть','IV четверть'],
    'Полугодия': ['I полугодие','II полугодие'],
    'Триместры': ['I триместр','II триместр','III триместр'],
    'Семестры':  ['I семестр','II семестр']
};
const SUB_TABS = { education: [
    { id:'today',  label:'Сегодня' },
    { id:'diary',  label:'Дневник' },
    { id:'grades', label:'Оценки' }
]};

/* ============================================================
   ЦВЕТ. Возвращает hex СТРОКОЙ.
   Логика:
   - если в строке есть цифра 1–5, берём ПЕРВУЮ из них:
       5 или 4 → зелёный #65A30D
       3       → оранжевый #FB923C
       2 или 1 → красный #DC2626
   - иначе (буквы Н/Б/П/СП/О, пусто, мусор) → серый #94A3B8
   Знаки + и - ИГНОРИРУЮТСЯ, важна только цифра.
   ============================================================ */
function bgColor(value) {
    const raw = String(value == null ? '' : value).trim().toUpperCase();
    const m = raw.match(/[1-5]/);
    if (!m) return '#94A3B8';
    const d = parseInt(m[0], 10);
    if (d === 5 || d === 4) return '#65A30D';
    if (d === 3)            return '#FB923C';
    if (d === 2 || d === 1) return '#DC2626';
    return '#94A3B8';
}
/* Класс для мини-плитки — уже не используется, но оставлен для совместимости. */
function gradeClass(v) { return ''; }

/* Разбор значения ячейки журнала: "5", "5-", "5+", "Н", "Н5", "Н5-", "5/4". */
function parseCell(raw) {
    if (!raw) return { grade:'', presence:'' };
    const s = String(raw).toUpperCase().trim();
    const m = s.match(/^(Н|О|Б|СП|П)/);
    const presence = m ? m[0] : '';
    const grade = presence ? s.slice(presence.length).trim() : s;
    return { grade, presence };
}

function calcAverage(map) {
    let sum = 0, cnt = 0;
    Object.values(map || {}).forEach(v => {
        const m = String(v || '').match(/[1-5]/);
        if (!m) return;
        sum += parseInt(m[0], 10); cnt++;
    });
    return cnt === 0 ? null : (sum / cnt).toFixed(2).replace(/\.00$/, '');
}
function escapeHtml(t) {
    if (t == null) return '';
    const d = document.createElement('div');
    d.textContent = String(t);
    return d.innerHTML;
}
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatDateRu(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
function formatDateShort(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`; }
function formatDateHuman(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
function parseKey(key) {
    const p = String(key).split('_');
    const d = new Date(p[0] + 'T00:00:00');
    return { date: isNaN(d.getTime()) ? null : d, lesson: p[1] || '' };
}
function plural(n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
}
function getMondayOfCurrentWeek() {
    const t = new Date(); t.setHours(0,0,0,0);
    const dow = t.getDay();
    const diff = (dow === 0 ? -6 : 1 - dow);
    const m = new Date(t); m.setDate(t.getDate() + diff);
    return m;
}
function getStudentIdFromUrl() {
    const p = new URLSearchParams(window.location.search);
    return p.get('id');
}

let CURRENT_STUDENT = null;

let ALL_TEACHERS = [];
let ALL_JOURNALS = [];
let ALL_STUDENTS = [];
let CLASS_STUDENT_IDS = [];
let CURRENT_SCHEDULE = null;
let ALL_ROOMS = [];
let PERIODS = [];
let PERIOD_SYSTEM = '';

function switchSubTab(id) {

window.addEventListener('load', async () => {

async function loadAll() {
    const [classes, subjects, teachers, journals, students, schedules, rooms, periodDocs] = await Promise.all([
        DB.getAll('classes'), DB.getAll('subjects'), DB.getAll('teachers'),
        DB.getAll('journals'), DB.getAll('students'),
        DB.getAll('class_schedules'), DB.getAll('rooms'), DB.getAll('educational_periods')
    ]);
    ALL_STUDENTS = students;
    ALL_ROOMS = rooms;
    ALL_SUBJECTS = subjects;
    ALL_TEACHERS = teachers;
    ALL_JOURNALS = journals.filter(j => j.class_id === CURRENT_STUDENT.class_id);
    const withData = journals.filter(j => j.grades && j.grades[CURRENT_STUDENT.id] && Object.keys(j.grades[CURRENT_STUDENT.id]).length > 0);
    if (withData.length > 0) ALL_JOURNALS = withData;
    CLASS_STUDENT_IDS = ALL_STUDENTS.filter(s => s.class_id === CURRENT_STUDENT.class_id).map(s => s.id);
    const scheds = schedules.filter(s => s.class_id === CURRENT_STUDENT.class_id);
    const merged = {};
    scheds.forEach(s => {
        if (!s.grid) return;
        Object.entries(s.grid).forEach(([day, lessons]) => {
            if (!merged[day]) merged[day] = {};
            Object.entries(lessons || {}).forEach(([num, lesson]) => {
                if (lesson && lesson.subject && !merged[day][num]) merged[day][num] = lesson;
            });
        });
    });
    CURRENT_SCHEDULE = Object.keys(merged).length > 0 ? { grid: merged } : null;
    const pd = periodDocs[0] || null;
    PERIODS = pd ? (pd.periods || []) : [];
    PERIOD_SYSTEM = pd ? (pd.system || '') : '';
    ACTIVE_PERIOD_INDEX = findActivePeriodIndex();
}
function findActivePeriodIndex() {
    if (PERIODS.length === 0) return 0;
    const t = new Date(); t.setHours(0,0,0,0);
    for (let i = 0; i < PERIODS.length; i++) {
        const s = new Date(PERIODS[i].start + 'T00:00:00');
        const e = new Date(PERIODS[i].end + 'T23:59:59');
        if (t >= s && t <= e) return i;
    }
    return 0;
}
function getScheduleSubjects() {
    if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
    const set = new Set();
    Object.values(CURRENT_SCHEDULE.grid).forEach(g => Object.values(g || {}).forEach(l => { if (l && l.subject) set.add(l.subject); }));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
}

function renderPeriodTabs() {
    const c = document.getElementById('periodTabs');
    c.innerHTML = '';
    if (PERIODS.length === 0) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'tab-pill active'; b.textContent = 'Периоды не созданы'; b.disabled = true;
        c.appendChild(b); return;
    }
    const labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
    PERIODS.forEach((p, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab-pill' + (i === ACTIVE_PERIOD_INDEX ? ' active' : '');
        b.textContent = labels[i] || ('Период ' + (i + 1));
        b.title = p.start + ' – ' + p.end;
        b.addEventListener('click', () => { ACTIVE_PERIOD_INDEX = i; renderPeriodTabs(); renderGradesTable(); });
        c.appendChild(b);
    });
}

function collectAll() {
    const out = [];
    ALL_JOURNALS.forEach(j => {
        const sg = (j.grades && j.grades[CURRENT_STUDENT.id]) || {};
        const subj = ALL_SUBJECTS.find(s => s.id === j.subject_id);
        if (!subj) return;
        Object.entries(sg).forEach(([key, val]) => {
            if (val == null || val === '') return;
            if (key.endsWith('_pres')) return;
            const p = parseKey(key);
            const type = (j.lesson_types && j.lesson_types[key]) || DEFAULT_LESSON_TYPE;
            const cell = parseCell(val);
            if (cell.grade) out.push({ subject: subj.name, grade: cell.grade, raw: String(val), key, date: p.date, lesson: p.lesson, type, isPresence: false });
            if (cell.presence) out.push({ subject: subj.name, grade: cell.presence, raw: String(val), key, date: p.date, lesson: p.lesson, type, isPresence: true });
        });
    });
    return out;
}

function findLessonRecords(all, subject, key) {
    const g = all.find(x => x.subject === subject && x.key === key && !x.isPresence);
    const p = all.find(x => x.subject === subject && x.key === key &&  x.isPresence);
    return { grade: g ? g.grade : null, presence: p ? p.grade : null };
}

    const fails = all.filter(x => !x.isPresence && /^[12]/.test(x.grade.trim())).sort((a, b) => (b.date || 0) - (a.date || 0));
    const absences = all.filter(x => x.isPresence && x.grade.trim().toUpperCase() === 'Н').sort((a, b) => (b.date || 0) - (a.date || 0));
    if (fails.length > 0) {

        let title, list = '';

        box.innerHTML = `${icon}<div class="warn-body"><div class="warn-title">${title}</div>${list}<div class="warn-hint">Обычно оценку можно исправить. <b>Спроси учителя, что ты можешь для этого сделать.</b></div></div>`;

        box.className = 'warn-box absences';
        const icon = '<svg class="warn-icon" viewBox="0 0 24 24"><path d="M11 7h2v6h-2zm0 8h2v2h-2zm1-13C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>';
        let title, list = '';
        if (absences.length === 1) title = `Тебя не было на уроке «${escapeHtml(absences[0].subject)}» (${formatDateRu(absences[0].date)}).`;

        box.innerHTML = `${icon}<div class="warn-body"><div class="warn-title">${title}</div>${list}<div class="warn-hint">Если есть уважительная причина, <b>обсуди её с учителем.</b></div></div>`;

function getLessonsForDate(date) {
    if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
    const dow = date.getDay();
    const dowKey = JS_DAY_MAP[dow];
    if (!dowKey) return [];
    const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
    const nums = Object.keys(dayGrid).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
    if (nums.length === 0) return [];
    const maxN = Math.max(...nums);
    const all = collectAll();
    const out = [];
    for (let n = 1; n <= maxN; n++) {
        const lesson = dayGrid[n] || dayGrid[String(n)];
        if (!lesson || !lesson.subject) continue;
        let tName = lesson.teacherName || '';
        if (!tName && lesson.teacherId) { const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId); if (t) tName = t.full_name; }
        let rName = lesson.roomName || '';
        if (!rName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) rName = r.number + (r.name ? ' (' + r.name + ')' : ''); }
        const key = isoDate(date) + '_' + n;
        let topic = '', homework = '';
        const subj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
        if (subj) {
            const j = ALL_JOURNALS.find(x => x.subject_id === subj.id);
            if (j && j.lessons && j.lessons[key]) { topic = j.lessons[key].t || ''; homework = j.lessons[key].h || ''; }
        }
        const rec = findLessonRecords(all, lesson.subject, key);
        out.push({ num:n, subject:lesson.subject, teacherName:tName, roomName:rName, topic, homework, grade:rec.grade, presence:rec.presence });
    }
    return out;
}

function shiftDay(delta) {
    const d = new Date(TODAY_DATE);
    d.setDate(d.getDate() + delta);
    TODAY_DATE = d;
    renderToday();
}

            if (!rName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) rName = r.number + (r.name ? ' (' + r.name + ')' : ''); }

function getPeriodRange() {
    if (PERIODS.length === 0 || !PERIODS[ACTIVE_PERIOD_INDEX]) return null;
    const p = PERIODS[ACTIVE_PERIOD_INDEX];
    return { start: new Date(p.start + 'T00:00:00'), end: new Date(p.end + 'T23:59:59') };
}

function renderGradesTable() {
    const c = document.getElementById('gradesTableContainer');
    const subs = getScheduleSubjects();
    if (subs.length === 0) {
        c.innerHTML = `<div class="empty-state"><h3>Расписание ещё не составлено</h3><p>Обратитесь к администратору школы.</p></div>`;
        return;
    }
    const range = getPeriodRange();
    const all = collectAll();
    const periodLabel = PERIODS.length > 0 ? ((PERIOD_LABELS[PERIOD_SYSTEM] || [])[ACTIVE_PERIOD_INDEX] || 'Итог') : 'Итог';
    let html = '<div class="grades-table-wrapper"><table class="grades-table">';
    html += '<colgroup><col style="width:34%"><col style="width:46%"><col style="width:10%"><col style="width:10%"></colgroup>';
    html += '<thead><tr><th>Предмет</th><th>Оценки</th><th class="center">Ср. балл</th><th class="center">' + escapeHtml(periodLabel) + '</th></tr></thead><tbody>';

    subs.forEach(subjectName => {
        let arr = all.filter(x => x.subject === subjectName);
        if (range) arr = arr.filter(x => !x.date || (x.date >= range.start && x.date <= range.end));
        arr.sort((a, b) => a.key.localeCompare(b.key));
        const map = {};
        arr.forEach(x => { if (!x.isPresence) map[x.key] = x.grade; });
        const avg = calcAverage(map);
        const subj = ALL_SUBJECTS.find(s => s.name === subjectName);
        const j = subj ? ALL_JOURNALS.find(x => x.subject_id === subj.id) : null;
        const qtrs = j && j.qtr_grades ? (j.qtr_grades[CURRENT_STUDENT.id] || {}) : {};
        const periodQtr = qtrs[ACTIVE_PERIOD_INDEX] || qtrs[String(ACTIVE_PERIOD_INDEX)] || null;

        html += '<tr>';
        html += `<td class="subject-cell">${escapeHtml(subjectName)}</td>`;

        else {
            html += '<td><div class="grades-flex-inner">';
            arr.forEach(x => {
                const color = bgColor(x.grade);
                const isNum = !x.isPresence && /[1-5]/.test(x.grade);
                html += `<span class="mini-grade" style="background:${color};" ${isNum ? `data-subject="${escapeHtml(x.subject)}" data-key="${escapeHtml(x.key)}"` : ''}>${escapeHtml(x.grade)}</span>`;
            });
            html += '</div></td>';
        }
        html += avg !== null ? `<td class="avg-cell">${escapeHtml(String(avg))}</td>` : '<td class="avg-cell no-grade">-</td>';
        if (periodQtr) html += `<td class="qtr-cell"><span class="mini-grade" style="background:${bgColor(periodQtr)};min-width:30px;height:28px;font-size:15px;border-radius:6px;">${escapeHtml(String(periodQtr))}</span></td>`;
        else html += '<td class="qtr-cell"><span style="color:#94a3b8;">-</span></td>';
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    c.innerHTML = html;
    c.querySelectorAll('.mini-grade[data-subject]').forEach(b => b.addEventListener('click', () => openStats(b.dataset.subject, b.dataset.key)));
}

function openStats(subjectName, lessonKey) {
    const j = ALL_JOURNALS.find(x => {
        const s = ALL_SUBJECTS.find(y => y.id === x.subject_id);
        return s && s.name === subjectName;
    });
    const modal = document.getElementById('statsModal');
    const title = document.getElementById('statsTitle');
    const subtitle = document.getElementById('statsSubtitle');
    const list = document.getElementById('statsList');
    const total = document.getElementById('statsTotal');
    const p = parseKey(lessonKey);
    title.textContent = subjectName;
    subtitle.textContent = `${p.date ? formatDateRu(p.date) : ''} · ${p.lesson}-й урок`;
    if (!j) { list.innerHTML = '<div class="stats-empty">Статистика недоступна.</div>'; total.textContent = ''; modal.classList.add('show'); return; }
    const counters = { '5':0, '4':0, '3':0, '2':0, '1':0 };
    const valid = new Set(CLASS_STUDENT_IDS);
    Object.entries(j.grades || {}).forEach(([sid, sg]) => {
        if (!valid.has(sid)) return;
        const cell = parseCell(sg && sg[lessonKey]);
        if (!cell.grade) return;
        const m = cell.grade.match(/[1-5]/);
        if (m && counters[m[0]] !== undefined) counters[m[0]]++;
    });
    const totalCount = Object.values(counters).reduce((a, b) => a + b, 0);
    if (totalCount === 0) { list.innerHTML = '<div class="stats-empty">Пока нет оценок за этот урок.</div>'; total.textContent = ''; modal.classList.add('show'); return; }
    let html = '';
    ['5','4','3','2','1'].forEach(g => {
        const cnt = counters[g];
        const pct = Math.round((cnt / totalCount) * 100);
        const color = bgColor(g);
        html += `<div class="stat-row"><div class="stat-badge" style="background:${color};">${g}</div><div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.max(pct, 6)}%;background:${color};">${pct > 15 ? pct + '%' : ''}</div></div><div class="stat-count">${cnt} <small>${plural(cnt, ['человек','человека','человек'])}</small></div></div>`;
    });
    list.innerHTML = html;
    total.textContent = `Всего оценок за урок: ${totalCount}`;
    modal.classList.add('show');
}
function closeStats() { document.getElementById('statsModal').classList.remove('show'); }
document.getElementById('statsModal').addEventListener('click', (e) => { if (e.target.id === 'statsModal') closeStats(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStats(); });
</script>
</body>
</html>
