<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ученик — Дневник.ру</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #fff; }
body { min-height: 100vh; color: #1a2b4a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; padding: 0; }

.loading-screen { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; }
.loading-screen.hidden { display: none; }
.loading-box { background: #fff; border-radius: 24px; padding: 44px 40px; max-width: 420px; width: 100%; text-align: center; }
.loading-spinner { width: 56px; height: 56px; border: 5px solid rgba(42,82,152,0.15); border-top-color: #2a5298; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 15px; color: #5a6a85; font-weight: 500; }

.app-shell { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
.header { background: #fff; border-bottom: 1px solid #e0e0e0; }
.header-inner { padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
.logo { font-size: 22px; color: #007baf; }
.logo-bold { font-weight: 700; }
.logo-sub { color: #777; }
.d-user-profile-zone { display: flex; align-items: center; gap: 40px; }
.d-user-info { display: flex; flex-direction: column; line-height: 1.3; }
.d-user-name { font-size: 14px; font-weight: 700; color: #333; }
.d-user-role { font-size: 12px; color: #888; }
.d-action-link { font-size: 13px; color: #007baf; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
.d-action-link:hover { text-decoration: underline; }

.d-top-blue-bar { background: #166a94; }
.d-top-blue-inner { display: flex; }
.d-nav-item { padding: 12px 20px; color: #fff; cursor: pointer; font: 400 14px/1 inherit; border-bottom: 3px solid transparent; }
.d-nav-item.active { background: #0f4f70; border-bottom-color: #fff; }

.d-sub-menu-bar { background: #fff; border-bottom: 1px solid #e0e0e0; }
.d-sub-menu-inner { display: flex; flex-wrap: wrap; }
.d-sub-item { padding: 10px 15px; color: #555; font: 400 13px/1 inherit; border-bottom: 3px solid transparent; cursor: pointer; background: none; border: none; font-family: inherit; }
.d-sub-item:hover { color: #1d82b5; }
.d-sub-item.active { color: #1d82b5; border-bottom-color: #1d82b5; font-weight: 500; }

.school-bar { padding: 14px 0 0; }
.school-name { font-size: 13px; color: #7a8aa3; margin-bottom: 2px; }
.page-title { font-size: 28px; font-weight: 400; color: #1976d2; margin-bottom: 12px; }

.container { padding: 0 0 60px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.warn-box { border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 14px; }
.warn-icon { width: 26px; height: 26px; flex-shrink: 0; margin-top: 2px; }
.warn-body { flex: 1; }
.warn-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.warn-list { margin: 6px 0 10px 20px; font-size: 13.5px; line-height: 1.7; color: #2a3a52; }
.warn-hint { font-size: 13.5px; color: #2a3a52; line-height: 1.5; }
.warn-box.fails { background: #fff0f0; border: 1.5px solid #ffd6d6; }
.warn-box.fails .warn-icon { fill: #d32f2f; }
.warn-box.fails .warn-title { color: #d32f2f; }
.warn-box.absences { background: #fff8e6; border: 1.5px solid #ffe4a3; }
.warn-box.absences .warn-icon { fill: #b8720a; }
.warn-box.absences .warn-title { color: #b8720a; }

.day-card { background: #fff; border-radius: 12px; border: 1px solid #eef2f8; margin-bottom: 20px; overflow: hidden; }
.day-card-inner { padding: 20px 22px; }
.day-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid #eef2f8; }
.day-nav-btn { width: 36px; height: 36px; border-radius: 50%; background: #f0f4f9; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.day-nav-btn:hover { background: #e3f2fd; }
.day-nav-btn svg { width: 18px; height: 18px; fill: #1976d2; }
.day-nav-title { font-size: 15px; font-weight: 700; color: #1a2b4a; text-align: center; flex: 1; }
.day-section-label { font-size: 12px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }

.tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.tile { width: 90px; display: flex; flex-direction: column; align-items: flex-start; }
.tile.square { cursor: pointer; }
.tile-box {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 500; line-height: 1;
    margin-bottom: 6px;
}
.tile-subject { font-size: 12px; font-weight: 600; color: #1a2b4a; line-height: 1.2; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-type { font-size: 10.5px; color: #94a3b8; line-height: 1.2; margin-top: 2px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-raw { font-size: 9px; color: #cbd5e1; margin-top: 2px; font-family: monospace; }

.lesson-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: #f8fafc; border-radius: 10px; border-left: 4px solid #90caf9; margin-bottom: 10px; }
.lesson-row-num { width: 32px; height: 32px; background: #e3f2fd; color: #1976d2; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.lesson-row-info { min-width: 0; }
.lesson-row-subject { font-size: 14px; font-weight: 700; color: #1a2b4a; }
.lesson-row-meta { font-size: 12px; color: #7a8aa3; margin-top: 2px; }
.lesson-row-topic { font-size: 12px; color: #334155; margin-top: 4px; }
.lesson-row-topic b, .lesson-row-hw b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
.lesson-row-hw { font-size: 12px; color: #1e40af; margin-top: 4px; }
.lesson-row-grades { display: flex; gap: 4px; align-items: center; }
.badge { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px; color: #fff; }
.badge.empty { background: #e2e8f0; color: #94a3b8; }
.badge.small { min-width: 26px; height: 26px; padding: 0 7px; font-size: 14px; }

.day-empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
.day-empty-emoji { font-size: 40px; margin-bottom: 12px; }
.day-empty-title { font-size: 15px; font-weight: 700; color: #5a6a85; margin-bottom: 6px; }
.day-empty-text { font-size: 13px; max-width: 320px; margin: 0 auto; }

.week-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.week-title { font-size: 20px; font-weight: 700; color: #1a2b4a; }
.week-range { font-size: 13px; color: #7a8aa3; margin-top: 2px; }
.week-badge { background: #e3f2fd; color: #1976d2; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
.week-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.week-grid::-webkit-scrollbar { height: 10px; }
.week-grid::-webkit-scrollbar-track { background: #eef2f8; border-radius: 5px; }
.week-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
.day-column { flex: 0 0 250px; min-width: 250px; background: #fff; border-radius: 12px; border: 1px solid #eef2f8; overflow: hidden; display: flex; flex-direction: column; }
.day-column.today { border: 2px solid #1976d2; }
.day-header { background: linear-gradient(135deg, #1976d2, #2196f3); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.day-column.today .day-header { background: linear-gradient(135deg, #0d47a1, #1976d2); }
.day-name { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.day-date { font-size: 11px; color: rgba(255,255,255,0.85); }
.day-today-badge { background: #fff; color: #1976d2; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
.day-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }

.card-lesson { background: #f8fafc; border-radius: 10px; padding: 10px 12px; border-left: 3px solid #90caf9; position: relative; }
.card-lesson.empty { background: transparent; border-left: 3px dashed #e2e8f0; padding: 6px 12px; }
.card-lesson.empty .card-lesson-subject { color: #cbd5e1; font-weight: 400; font-style: italic; font-size: 12px; }
.card-lesson-head { display: flex; align-items: flex-start; gap: 8px; padding-right: 76px; }
.card-lesson-num { width: 20px; height: 20px; background: #e3f2fd; color: #1976d2; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
.card-lesson-subject { font-size: 13px; font-weight: 700; color: #1a2b4a; line-height: 1.3; }
.card-lesson-meta { font-size: 11px; color: #7a8aa3; margin-top: 3px; }
.card-lesson-section { margin-top: 6px; font-size: 11.5px; }
.card-lesson-label { font-weight: 700; color: #7a8aa3; text-transform: uppercase; font-size: 10px; margin-right: 4px; }
.card-lesson-value { color: #334155; }
.card-lesson-value.hw { color: #1e40af; }
.card-lesson-grades { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }

.period-tabs-wrapper { margin-bottom: 16px; }
.period-tabs-group { display: inline-flex; align-items: center; padding: 4px; background: #fff; border: 1px solid #CBD5E1; border-radius: 10px; flex-wrap: wrap; }
.tab-pill { padding: 8px 16px; background: transparent; color: #64748B; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid transparent; font-family: inherit; }
.tab-pill:hover { background: #F1F5F9; }
.tab-pill.active { background: linear-gradient(135deg, #1976d2, #2196f3); color: #fff; }

.grades-table-wrapper { background: #fff; border-radius: 12px; border: 1px solid #eef2f8; overflow: hidden; }
.grades-table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
.grades-table th { background: #f8fafc; color: #475569; font-weight: 700; font-size: 11px; padding: 14px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
.grades-table th.center { text-align: center; }
.grades-table td { padding: 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.grades-table tbody tr:last-child td { border-bottom: none; }
.grades-table td.subject-cell { font-weight: 700; color: #1e293b; font-size: 14px; }
.grades-table td.avg-cell { text-align: center; font-weight: 700; color: #65A30D; font-size: 15px; }
.grades-table td.avg-cell.no-grade { color: #94a3b8; font-weight: 400; }
.grades-table td.qtr-cell { text-align: center; }
.no-grades-text { color: #94a3b8; font-style: italic; font-size: 13px; }
.grades-flex-inner { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mini-grade { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 5px; font-weight: 500; font-size: 13px; color: #fff; padding: 0 5px; cursor: pointer; }
.mini-grade:not([data-subject]) { cursor: default; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26, 43, 74, 0.5); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #eef2f8; }
.modal-header-icon { width: 42px; height: 42px; border-radius: 12px; background: #e3f2fd; display: flex; align-items: center; justify-content: center; }
.modal-header-icon svg { width: 22px; height: 22px; fill: #1976d2; }
.modal-title { font-size: 17px; font-weight: 700; color: #1a2b4a; }
.modal-subtitle { font-size: 12px; color: #7a8aa3; margin-top: 2px; }
.stats-list { display: flex; flex-direction: column; gap: 10px; }
.stat-row { display: flex; align-items: center; gap: 12px; }
.stat-badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; color: #fff; flex-shrink: 0; }
.stat-bar-wrap { flex: 1; height: 26px; background: #f0f4f9; border-radius: 8px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; font-weight: 700; color: #fff; }
.stat-count { width: 60px; text-align: right; font-size: 13px; font-weight: 600; color: #2a3a52; }
.stat-count small { color: #7a8aa3; font-weight: 500; }
.stats-total { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eef2f8; font-size: 13px; color: #7a8aa3; text-align: center; }
.stats-empty { text-align: center; padding: 20px 10px; color: #8a9bb5; font-size: 14px; }
.modal-close { width: 100%; height: 44px; margin-top: 16px; background: #f0f2f5; color: #4a5a72; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-close:hover { background: #e2e8f0; }

.empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; border: 1px solid #eef2f8; }
.empty-state h3 { font-size: 18px; font-weight: 700; color: #5a6a85; margin-bottom: 8px; }
.empty-state p { font-size: 14px; color: #8a9bb5; max-width: 400px; margin: 0 auto; }
</style>
</head>
<body>

        <div class="loading-spinner"></div>

<script src="supabase-config.js"></script>
<script>
(function () {
    'use strict';

    // ======================= ЦВЕТ ОЦЕНКИ =======================
    // Берём ПЕРВУЮ цифру 1–5 из строки. Плюсы, минусы, слэши,
    // пробелы и прочие символы игнорируются.
    // "5", "5+", "5-", "4", "4-", "5/4", "2/3-", "Н5" → по первой цифре.
    function bgColor(value) {
        var s = String(value == null ? '' : value);
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c >= 49 && c <= 53) { // '1'..'5'
                var d = c - 48;
                if (d === 5 || d === 4) return '#65A30D';
                if (d === 3)            return '#FB923C';
                if (d === 2 || d === 1) return '#DC2626';
            }
        }
        return '#94A3B8';
    }
    function isNumericGrade(v) {
        var s = String(v == null ? '' : v);
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c >= 49 && c <= 53) return true;
        }
        return false;
    }
    window.bgColor = bgColor;
    window.isNumericGrade = isNumericGrade;

    // ======================= КОНСТАНТЫ =======================
    var DAYS_KEYS = ['mon','tue','wed','thu','fri','sat'];
    var DAYS_RU = { mon:'Пн', tue:'Вт', wed:'Ср', thu:'Чт', fri:'Пт', sat:'Сб' };
    var DAYS_FULL = { mon:'Понедельник', tue:'Вторник', wed:'Среда', thu:'Четверг', fri:'Пятница', sat:'Суббота', sun:'Воскресенье' };
    var JS_DAY_MAP = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri', 6:'sat' };
    var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var DEFAULT_LESSON_TYPE = 'ОТВ';
    var PERIOD_LABELS = {
        'Четверти':  ['I четверть','II четверть','III четверть','IV четверть'],
        'Полугодия': ['I полугодие','II полугодие'],
        'Триместры': ['I триместр','II триместр','III триместр'],
        'Семестры':  ['I семестр','II семестр']
    };
    var SUB_TABS = { education: [
        { id:'today',  label:'Сегодня' },
        { id:'diary',  label:'Дневник' },
        { id:'grades', label:'Оценки' }
    ]};

    // ======================= РАЗБОР ЯЧЕЙКИ =======================
    function parseCell(raw) {
        if (!raw) return { grade:'', presence:'' };
        var s = String(raw).toUpperCase().trim();
        var m = s.match(/^(Н|О|Б|СП|П)/);
        var presence = m ? m[0] : '';
        var grade = presence ? s.slice(presence.length).trim() : s;
        return { grade: grade, presence: presence };
    }

    function firstDigit(v) {
        var s = String(v == null ? '' : v);
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c >= 49 && c <= 53) return c - 48;
        }
        return null;
    }

    function calcAverage(map) {
        var sum = 0, cnt = 0;
        Object.keys(map || {}).forEach(function (k) {
            var d = firstDigit(map[k]);
            if (d == null) return;
            sum += d; cnt++;
        });
        return cnt === 0 ? null : (sum / cnt).toFixed(2).replace(/\.00$/, '');
    }
    function escapeHtml(t) {
        if (t == null) return '';
        var d = document.createElement('div');
        d.textContent = String(t);
        return d.innerHTML;
    }
    function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function formatDateRu(d) { return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear(); }
    function formatDateShort(d) { return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0'); }
    function formatDateHuman(d) { return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()]; }
    function parseKey(key) {
        var p = String(key).split('_');
        var d = new Date(p[0] + 'T00:00:00');
        return { date: isNaN(d.getTime()) ? null : d, lesson: p[1] || '' };
    }
    function plural(n, forms) {
        var a = Math.abs(n) % 100, b = a % 10;
        if (a > 10 && a < 20) return forms[2];
        if (b > 1 && b < 5) return forms[1];
        if (b === 1) return forms[0];
        return forms[2];
    }
    function getMondayOfCurrentWeek() {
        var t = new Date(); t.setHours(0,0,0,0);
        var dow = t.getDay();
        var diff = (dow === 0 ? -6 : 1 - dow);
        var m = new Date(t); m.setDate(t.getDate() + diff);
        return m;
    }
    function getStudentIdFromUrl() {
        var p = new URLSearchParams(window.location.search);
        return p.get('id');
    }

    var ALL_SUBJECTS = [];
    var ALL_TEACHERS = [];
    var ALL_JOURNALS = [];
    var ALL_STUDENTS = [];
    var CLASS_STUDENT_IDS = [];
    var CURRENT_SCHEDULE = null;
    var ALL_ROOMS = [];
    var PERIODS = [];
    var PERIOD_SYSTEM = '';
    var ACTIVE_PERIOD_INDEX = 0;

    function switchSubTab(id) {
        ACTIVE_SUB_TAB = id;
        document.querySelectorAll('.d-sub-item').forEach(function (b) {
            b.classList.toggle('active', b.dataset.subtab === id);
        });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        var panel = document.getElementById('panel-' + id);
        if (panel) panel.classList.add('active');
        var meta = SUB_TABS.education.find(function (i) { return i.id === id; });

    // ======================= СТАРТ =======================
    window.addEventListener('load', function () {
        var sid = getStudentIdFromUrl();
        if (!sid) { document.getElementById('loadingText').textContent = 'Не указан ID ученика.'; return; }

        DB.getAll('students').then(function (students) {
            var st = students.find(function (s) { return s.id === sid; });
            if (!st) { document.getElementById('loadingText').textContent = 'Ученик не найден.'; return; }
            CURRENT_STUDENT = st;
            return loadAll();
        }).then(function () {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').style.display = 'block';
            initSubTabs();
            switchSubTab('today');
        }).catch(function (e) {
            console.error(e);
            document.getElementById('loadingText').textContent = 'Ошибка загрузки. Проверьте консоль.';
        });
    });

    function loadAll() {
        return Promise.all([
            DB.getAll('classes'), DB.getAll('subjects'), DB.getAll('teachers'),
            DB.getAll('journals'), DB.getAll('students'),
            DB.getAll('class_schedules'), DB.getAll('rooms'), DB.getAll('educational_periods')
        ]).then(function (res) {
            var classes = res[0], subjects = res[1], teachers = res[2],
                journals = res[3], students = res[4], schedules = res[5],
                rooms = res[6], periodDocs = res[7];

            ALL_STUDENTS = students;
            ALL_ROOMS = rooms;
            ALL_SUBJECTS = subjects;
            ALL_TEACHERS = teachers;

            ALL_JOURNALS = journals.filter(function (j) { return j.class_id === CURRENT_STUDENT.class_id; });
            var withData = journals.filter(function (j) {
                return j.grades && j.grades[CURRENT_STUDENT.id] && Object.keys(j.grades[CURRENT_STUDENT.id]).length > 0;
            });
            if (withData.length > 0) ALL_JOURNALS = withData;

            CLASS_STUDENT_IDS = ALL_STUDENTS
                .filter(function (s) { return s.class_id === CURRENT_STUDENT.class_id; })
                .map(function (s) { return s.id; });

            var scheds = schedules.filter(function (s) { return s.class_id === CURRENT_STUDENT.class_id; });
            var merged = {};
            scheds.forEach(function (s) {
                if (!s.grid) return;
                Object.keys(s.grid).forEach(function (day) {
                    if (!merged[day]) merged[day] = {};
                    var lessons = s.grid[day] || {};
                    Object.keys(lessons).forEach(function (num) {
                        var lesson = lessons[num];
                        if (lesson && lesson.subject && !merged[day][num]) merged[day][num] = lesson;
                    });
                });
            });
            CURRENT_SCHEDULE = Object.keys(merged).length > 0 ? { grid: merged } : null;

            var pd = periodDocs[0] || null;
            PERIODS = pd ? (pd.periods || []) : [];
            PERIOD_SYSTEM = pd ? (pd.system || '') : '';
            ACTIVE_PERIOD_INDEX = findActivePeriodIndex();
        });
    }

    function findActivePeriodIndex() {
        if (PERIODS.length === 0) return 0;
        var t = new Date(); t.setHours(0,0,0,0);
        for (var i = 0; i < PERIODS.length; i++) {
            var s = new Date(PERIODS[i].start + 'T00:00:00');
            var e = new Date(PERIODS[i].end + 'T23:59:59');
            if (t >= s && t <= e) return i;
        }
        return 0;
    }

    function getScheduleSubjects() {
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
        var set = {};
        Object.keys(CURRENT_SCHEDULE.grid).forEach(function (d) {
            var g = CURRENT_SCHEDULE.grid[d] || {};
            Object.keys(g).forEach(function (n) {
                var l = g[n];
                if (l && l.subject) set[l.subject] = true;
            });
        });
        return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'ru'); });
    }

    // ======================= ПЕРИОДЫ =======================
    function renderPeriodTabs() {
        var c = document.getElementById('periodTabs');
        c.innerHTML = '';
        if (PERIODS.length === 0) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'tab-pill active';
            b.textContent = 'Периоды не созданы'; b.disabled = true;
            c.appendChild(b); return;
        }
        var labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
        PERIODS.forEach(function (p, i) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tab-pill' + (i === ACTIVE_PERIOD_INDEX ? ' active' : '');
            btn.textContent = labels[i] || ('Период ' + (i + 1));
            btn.title = p.start + ' – ' + p.end;
            btn.addEventListener('click', function () {
                ACTIVE_PERIOD_INDEX = i;
                renderPeriodTabs();
                renderGradesTable();
            });
            c.appendChild(btn);
        });
    }

    // ======================= СБОР ДАННЫХ =======================
    function collectAll() {
        var out = [];
        ALL_JOURNALS.forEach(function (j) {
            var sg = (j.grades && j.grades[CURRENT_STUDENT.id]) || {};
            var subj = ALL_SUBJECTS.find(function (s) { return s.id === j.subject_id; });
            if (!subj) return;
            Object.keys(sg).forEach(function (key) {
                var val = sg[key];
                if (val == null || val === '') return;
                if (key.endsWith('_pres')) return;
                var p = parseKey(key);
                var type = (j.lesson_types && j.lesson_types[key]) || DEFAULT_LESSON_TYPE;
                var cell = parseCell(val);
                if (cell.grade) out.push({
                    subject: subj.name, grade: cell.grade, raw: String(val),
                    key: key, date: p.date, lesson: p.lesson, type: type, isPresence: false
                });
                if (cell.presence) out.push({
                    subject: subj.name, grade: cell.presence, raw: String(val),
                    key: key, date: p.date, lesson: p.lesson, type: type, isPresence: true
                });
            });
        });
        return out;
    }

    function findLessonRecords(all, subject, key) {
        var g = all.find(function (x) { return x.subject === subject && x.key === key && !x.isPresence; });
        var p = all.find(function (x) { return x.subject === subject && x.key === key &&  x.isPresence; });
        return { grade: g ? g.grade : null, presence: p ? p.grade : null };
    }

    // ======================= ПРЕДУПРЕЖДЕНИЯ =======================
    function renderWarnings() {
        var c = document.getElementById('warningContainer');
        c.innerHTML = '';
        var all = collectAll();
        var fails = all.filter(function (x) {
            return !x.isPresence && firstDigit(x.grade) === 1 || firstDigit(x.grade) === 2;
        }).sort(function (a, b) { return (b.date || 0) - (a.date || 0); });
        var absences = all.filter(function (x) {
            return x.isPresence && String(x.grade).trim().toUpperCase() === 'Н';
        }).sort(function (a, b) { return (b.date || 0) - (a.date || 0); });

        if (fails.length > 0) {
            var box = document.createElement('div');
            box.className = 'warn-box fails';
            var icon = '<svg class="warn-icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
            var title, list = '';
            if (fails.length === 1) {
                title = 'Тебе поставили <b>2</b> по предмету «' + escapeHtml(fails[0].subject) + '» (' + formatDateRu(fails[0].date) + ').';
            } else {
                title = 'Тебе поставили двойки:';
                list = '<ul class="warn-list">' + fails.map(function (f) {
                    return '<li><b>' + escapeHtml(f.subject) + '</b> — ' + formatDateRu(f.date) + '</li>';
                }).join('') + '</ul>';
            }
            box.innerHTML = icon + '<div class="warn-body"><div class="warn-title">' + title + '</div>' + list +
                '<div class="warn-hint">Обычно оценку можно исправить. <b>Спроси учителя, что ты можешь для этого сделать.</b></div></div>';
            c.appendChild(box);
        }

        if (absences.length > 0) {
            var box2 = document.createElement('div');
            box2.className = 'warn-box absences';
            var icon2 = '<svg class="warn-icon" viewBox="0 0 24 24"><path d="M11 7h2v6h-2zm0 8h2v2h-2zm1-13C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>';
            var t2, l2 = '';
            if (absences.length === 1) {
                t2 = 'Тебя не было на уроке «' + escapeHtml(absences[0].subject) + '» (' + formatDateRu(absences[0].date) + ').';
            } else {
                t2 = 'Тебя не было на уроках:';
                l2 = '<ul class="warn-list">' + absences.map(function (a) {
                    return '<li><b>' + escapeHtml(a.subject) + '</b> — ' + formatDateRu(a.date) + '</li>';
                }).join('') + '</ul>';
            }
            box2.innerHTML = icon2 + '<div class="warn-body"><div class="warn-title">' + t2 + '</div>' + l2 +
                '<div class="warn-hint">Если есть уважительная причина, <b>обсуди её с учителем.</b></div></div>';
            c.appendChild(box2);
        }
    }

    // ======================= СЕГОДНЯ =======================
    function renderToday() {
        var c = document.getElementById('todayContent');
        var date = TODAY_DATE;
        var dow = date.getDay();
        var dowKey = JS_DAY_MAP[dow] || 'sun';
        var dayName = DAYS_FULL[dowKey] || 'Воскресенье';
        var all = collectAll();
        var dayRecs = all.filter(function (x) { return x.date && isoDate(x.date) === isoDate(date); });

        var tilesHtml = '';
        if (dayRecs.length > 0) {
            tilesHtml = '<div class="day-section-label">' + formatDateHuman(date).toUpperCase() + '</div><div class="tiles">' +
                dayRecs.map(function (x) {
                    var color = bgColor(x.grade);
                    var clickable = !x.isPresence && isNumericGrade(x.grade);
                    return '<div class="tile' + (clickable ? ' square' : '') + '"' +
                        (clickable ? ' data-subject="' + escapeHtml(x.subject) + '" data-key="' + escapeHtml(x.key) + '"' : '') + '>' +
                        '<div class="tile-box" style="background:' + color + ';">' + escapeHtml(x.grade) + '</div>' +
                        '<div class="tile-subject">' + escapeHtml(x.subject) + '</div>' +
                        '<div class="tile-type">' + (x.isPresence ? 'присутствие' : escapeHtml(x.type)) + '</div>' +
                        '<div class="tile-raw">' + escapeHtml(x.grade) + '</div>' +
                        '</div>';
                }).join('') + '</div>';
        } else {
            tilesHtml = '<div class="day-section-label">' + formatDateHuman(date).toUpperCase() +
                '</div><div style="color:#94a3b8;font-size:13px;padding:8px 0 16px;">Оценок за этот день нет</div>';
        }

        var lessons = getLessonsForDate(date);
        var lessonsHtml = '';
        if (lessons.length === 0) {
            var weekend = dow === 0;
            lessonsHtml = '<div class="day-empty"><div class="day-empty-emoji">' + (weekend ? '☕' : '📅') + '</div>' +
                '<div class="day-empty-title">' + (weekend ? 'Выходной день' : 'Нет занятий') + '</div>' +
                '<div class="day-empty-text">' + (weekend ? 'Отдыхай!' : 'На этот день уроков нет') + '</div></div>';
        } else {
            lessonsHtml = lessons.map(function (l) {
                var badges = '';
                if (l.presence) badges += '<div class="badge" style="background:' + bgColor(l.presence) + ';">' + escapeHtml(l.presence) + '</div>';
                if (l.grade)    badges += '<div class="badge" style="background:' + bgColor(l.grade)    + ';">' + escapeHtml(l.grade)    + '</div>';
                if (!l.grade && !l.presence) badges = '<div class="badge empty">—</div>';
                var meta = [];
                if (l.teacherName) meta.push(l.teacherName);
                if (l.roomName) meta.push('каб. ' + l.roomName);
                var metaHtml = meta.length ? '<div class="lesson-row-meta">' + escapeHtml(meta.join(' · ')) + '</div>' : '';
                var topicHtml = l.topic ? '<div class="lesson-row-topic"><b>Тема:</b>' + escapeHtml(l.topic) + '</div>' : '';
                var hwHtml = l.homework ? '<div class="lesson-row-hw"><b>ДЗ:</b>' + escapeHtml(l.homework) + '</div>' : '';
                return '<div class="lesson-row">' +
                    '<div class="lesson-row-num">' + l.num + '</div>' +
                    '<div class="lesson-row-info"><div class="lesson-row-subject">' + escapeHtml(l.subject) + '</div>' + metaHtml + topicHtml + hwHtml + '</div>' +
                    '<div class="lesson-row-grades">' + badges + '</div>' +
                    '</div>';
            }).join('');
        }

        var dateLabel = date.getDate() + ' ' + MONTHS_GEN[date.getMonth()] + ', ' + dayName.toLowerCase();
        var isToday = isoDate(date) === isoDate(new Date());

        c.innerHTML =
            '<div class="day-card">' +
                '<div class="day-card-inner">' + tilesHtml + '</div>' +
                '<div class="day-nav">' +
                    '<button class="day-nav-btn" onclick="shiftDay(-1)"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>' +
                    '<div style="flex:1;text-align:center;"><div class="day-nav-title">' + dateLabel + (isToday ? ' · Сегодня' : '') + '</div></div>' +
                    '<button class="day-nav-btn" onclick="shiftDay(1)"><svg viewBox="0 0 24 24"><path d="M4 13h12.17l-5.59 5.59L12 20l8-8-8-8-1.41 1.41L16.17 11H4v2z"/></svg></button>' +
                '</div>' +
                '<div class="day-card-inner" style="padding-top:0;">' + lessonsHtml + '</div>' +
            '</div>';

        c.querySelectorAll('.tile.square').forEach(function (t) {
            t.addEventListener('click', function () { openStats(t.dataset.subject, t.dataset.key); });
        });
    }

    function getLessonsForDate(date) {
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
        var dow = date.getDay();
        var dowKey = JS_DAY_MAP[dow];
        if (!dowKey) return [];
        var dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
        var nums = Object.keys(dayGrid).map(function (n) { return parseInt(n, 10); }).filter(function (n) { return !isNaN(n); });
        if (nums.length === 0) return [];
        var maxN = Math.max.apply(null, nums);
        var all = collectAll();
        var out = [];
        for (var n = 1; n <= maxN; n++) {
            var lesson = dayGrid[n] || dayGrid[String(n)];
            if (!lesson || !lesson.subject) continue;
            var tName = lesson.teacherName || '';
            if (!tName && lesson.teacherId) {
                var t = ALL_TEACHERS.find(function (x) { return x.id === lesson.teacherId; });
                if (t) tName = t.full_name;
            }
            var rName = lesson.roomName || '';
            if (!rName && lesson.roomId) {
                var r = ALL_ROOMS.find(function (x) { return x.id === lesson.roomId; });
                if (r) rName = r.number + (r.name ? ' (' + r.name + ')' : '');
            }
            var key = isoDate(date) + '_' + n;
            var topic = '', homework = '';
            var subj = ALL_SUBJECTS.find(function (s) { return s.name === lesson.subject; });
            if (subj) {
                var j = ALL_JOURNALS.find(function (x) { return x.subject_id === subj.id; });
                if (j && j.lessons && j.lessons[key]) { topic = j.lessons[key].t || ''; homework = j.lessons[key].h || ''; }
            }
            var rec = findLessonRecords(all, lesson.subject, key);
            out.push({ num:n, subject:lesson.subject, teacherName:tName, roomName:rName, topic:topic, homework:homework, grade:rec.grade, presence:rec.presence });
        }
        return out;
    }

    // ======================= ДНЕВНИК =======================
    function renderDiary() {
        var c = document.getElementById('diaryContent');
        var monday = getMondayOfCurrentWeek();
        var saturday = new Date(monday); saturday.setDate(monday.getDate() + 5);
        var rangeText = formatDateShort(monday) + ' – ' + formatDateRu(saturday);
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) {
            c.innerHTML = '<div class="empty-state"><h3>Расписание ещё не составлено</h3><p>Обратитесь к администратору школы.</p></div>';
            return;
        }
        var today = new Date(); today.setHours(0,0,0,0);
        var html = '<div class="week-title-bar"><div><div class="week-title">Текущая неделя</div>' +
            '<div class="week-range">' + rangeText + '</div></div><div class="week-badge">Расписание</div></div><div class="week-grid">';
        var grid = CURRENT_SCHEDULE.grid;
        var maxN = 7;
        DAYS_KEYS.forEach(function (d) {
            Object.keys(grid[d] || {}).forEach(function (k) {
                var n = parseInt(k, 10);
                if (!isNaN(n) && n > maxN) maxN = n;
            });
        });
        var all = collectAll();

        DAYS_KEYS.forEach(function (dayKey, idx) {
            var date = new Date(monday); date.setDate(monday.getDate() + idx);
            var isToday = date.getTime() === today.getTime();
            var dayGrid = grid[dayKey] || {};
            var lessonsHtml = '';
            for (var n = 1; n <= maxN; n++) {
                var lesson = dayGrid[n] || dayGrid[String(n)];
                if (!lesson || !lesson.subject) {
                    lessonsHtml += '<div class="card-lesson empty"><div class="card-lesson-subject">Урок ' + n + ' —</div></div>';
                    continue;
                }
                var tName = lesson.teacherName || '';
                if (!tName && lesson.teacherId) {
                    var t = ALL_TEACHERS.find(function (x) { return x.id === lesson.teacherId; });
                    if (t) tName = t.full_name;
                }
                var rName = lesson.roomName || '';
                if (!rName && lesson.roomId) {
                    var r = ALL_ROOMS.find(function (x) { return x.id === lesson.roomId; });
                    if (r) rName = r.number + (r.name ? ' (' + r.name + ')' : '');
                }
                var key = isoDate(date) + '_' + n;
                var topic = '', homework = '';
                var subj = ALL_SUBJECTS.find(function (s) { return s.name === lesson.subject; });
                if (subj) {
                    var j = ALL_JOURNALS.find(function (x) { return x.subject_id === subj.id; });
                    if (j && j.lessons && j.lessons[key]) { topic = j.lessons[key].t || ''; homework = j.lessons[key].h || ''; }
                }
                var rec = findLessonRecords(all, lesson.subject, key);
                var badges = '';
                if (rec.presence) badges += '<div class="badge small" style="background:' + bgColor(rec.presence) + ';">' + escapeHtml(rec.presence) + '</div>';
                if (rec.grade)    badges += '<div class="badge small" style="background:' + bgColor(rec.grade)    + ';">' + escapeHtml(rec.grade)    + '</div>';
                if (!rec.grade && !rec.presence) badges = '<div class="badge small empty">—</div>';
                var meta = [];
                if (tName) meta.push(tName);
                if (rName) meta.push('каб. ' + rName);
                var metaHtml = meta.length ? '<div class="card-lesson-meta">' + escapeHtml(meta.join(' · ')) + '</div>' : '';
                var topicHtml = topic ? '<div class="card-lesson-section"><span class="card-lesson-label">Тема:</span><span class="card-lesson-value">' + escapeHtml(topic) + '</span></div>' : '';
                var hwHtml = homework ? '<div class="card-lesson-section"><span class="card-lesson-label">ДЗ:</span><span class="card-lesson-value hw">' + escapeHtml(homework) + '</span></div>' : '';
                lessonsHtml += '<div class="card-lesson">' +
                    '<div class="card-lesson-grades">' + badges + '</div>' +
                    '<div class="card-lesson-head"><div class="card-lesson-num">' + n + '</div><div class="card-lesson-subject">' + escapeHtml(lesson.subject) + '</div></div>' +
                    metaHtml + topicHtml + hwHtml +
                    '</div>';
            }
            html += '<div class="day-column ' + (isToday ? 'today' : '') + '">' +
                '<div class="day-header"><div><div class="day-name">' + DAYS_RU[dayKey] + ', ' + formatDateShort(date) + '</div>' +
                '<div class="day-date">' + formatDateRu(date) + '</div></div>' +
                (isToday ? '<div class="day-today-badge">Сегодня</div>' : '') + '</div>' +
                '<div class="day-body">' + lessonsHtml + '</div>' +
                '</div>';
        });
        html += '</div>';
        c.innerHTML = html;
    }

    // ======================= ОЦЕНКИ =======================
    function getPeriodRange() {
        if (PERIODS.length === 0 || !PERIODS[ACTIVE_PERIOD_INDEX]) return null;
        var p = PERIODS[ACTIVE_PERIOD_INDEX];
        return { start: new Date(p.start + 'T00:00:00'), end: new Date(p.end + 'T23:59:59') };
    }

    function renderGradesTable() {
        var c = document.getElementById('gradesTableContainer');
        var subs = getScheduleSubjects();
        if (subs.length === 0) {
            c.innerHTML = '<div class="empty-state"><h3>Расписание ещё не составлено</h3><p>Обратитесь к администратору школы.</p></div>';
            return;
        }
        var range = getPeriodRange();
        var all = collectAll();
        var periodLabel = PERIODS.length > 0 ? ((PERIOD_LABELS[PERIOD_SYSTEM] || [])[ACTIVE_PERIOD_INDEX] || 'Итог') : 'Итог';
        var html = '<div class="grades-table-wrapper"><table class="grades-table">';
        html += '<colgroup><col style="width:34%"><col style="width:46%"><col style="width:10%"><col style="width:10%"></colgroup>';
        html += '<thead><tr><th>Предмет</th><th>Оценки</th><th class="center">Ср. балл</th><th class="center">' + escapeHtml(periodLabel) + '</th></tr></thead><tbody>';

        subs.forEach(function (subjectName) {
            var arr = all.filter(function (x) { return x.subject === subjectName; });
            if (range) arr = arr.filter(function (x) { return !x.date || (x.date >= range.start && x.date <= range.end); });
            arr.sort(function (a, b) { return a.key.localeCompare(b.key); });
            var map = {};
            arr.forEach(function (x) { if (!x.isPresence) map[x.key] = x.grade; });
            var avg = calcAverage(map);
            var subj = ALL_SUBJECTS.find(function (s) { return s.name === subjectName; });
            var j = subj ? ALL_JOURNALS.find(function (x) { return x.subject_id === subj.id; }) : null;
            var qtrs = j && j.qtr_grades ? (j.qtr_grades[CURRENT_STUDENT.id] || {}) : {};
            var periodQtr = qtrs[ACTIVE_PERIOD_INDEX] || qtrs[String(ACTIVE_PERIOD_INDEX)] || null;

            html += '<tr>';
            html += '<td class="subject-cell">' + escapeHtml(subjectName) + '</td>';
            if (arr.length === 0) {
                html += '<td><span class="no-grades-text">Нет выставленных оценок</span></td>';
            } else {
                html += '<td><div class="grades-flex-inner">';
                arr.forEach(function (x) {
                    var color = bgColor(x.grade);
                    var isNum = !x.isPresence && isNumericGrade(x.grade);
                    html += '<span class="mini-grade" style="background:' + color + ';"' +
                        (isNum ? ' data-subject="' + escapeHtml(x.subject) + '" data-key="' + escapeHtml(x.key) + '"' : '') + '>' +
                        escapeHtml(x.grade) + '</span>';
                });
                html += '</div></td>';
            }
            html += avg !== null
                ? '<td class="avg-cell">' + escapeHtml(String(avg)) + '</td>'
                : '<td class="avg-cell no-grade">-</td>';
            if (periodQtr) {
                html += '<td class="qtr-cell"><span class="mini-grade" style="background:' + bgColor(periodQtr) +
                    ';min-width:30px;height:28px;font-size:15px;border-radius:6px;">' + escapeHtml(String(periodQtr)) + '</span></td>';
            } else {
                html += '<td class="qtr-cell"><span style="color:#94a3b8;">-</span></td>';
            }
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        c.innerHTML = html;
        c.querySelectorAll('.mini-grade[data-subject]').forEach(function (b) {
            b.addEventListener('click', function () { openStats(b.dataset.subject, b.dataset.key); });
        });
    }

    // ======================= МОДАЛКА СТАТИСТИКИ =======================
    function openStats(subjectName, lessonKey) {
        var j = ALL_JOURNALS.find(function (x) {
            var s = ALL_SUBJECTS.find(function (y) { return y.id === x.subject_id; });
            return s && s.name === subjectName;
        });
        var modal = document.getElementById('statsModal');
        var title = document.getElementById('statsTitle');
        var subtitle = document.getElementById('statsSubtitle');
        var list = document.getElementById('statsList');
        var total = document.getElementById('statsTotal');
        var p = parseKey(lessonKey);
        title.textContent = subjectName;
        subtitle.textContent = (p.date ? formatDateRu(p.date) : '') + ' · ' + p.lesson + '-й урок';
        if (!j) {
            list.innerHTML = '<div class="stats-empty">Статистика недоступна.</div>';
            total.textContent = '';
            modal.classList.add('show');
            return;
        }
        var counters = { '5':0, '4':0, '3':0, '2':0, '1':0 };
        var valid = {};
        CLASS_STUDENT_IDS.forEach(function (id) { valid[id] = true; });
        Object.keys(j.grades || {}).forEach(function (sid) {
            if (!valid[sid]) return;
            var sg = j.grades[sid];
            var cell = parseCell(sg && sg[lessonKey]);
            if (!cell.grade) return;
            var d = firstDigit(cell.grade);
            if (d && counters[String(d)] !== undefined) counters[String(d)]++;
        });
        var totalCount = 0;
        Object.keys(counters).forEach(function (k) { totalCount += counters[k]; });
        if (totalCount === 0) {
            list.innerHTML = '<div class="stats-empty">Пока нет оценок за этот урок.</div>';
            total.textContent = '';
            modal.classList.add('show');
            return;
        }
        var html = '';
        ['5','4','3','2','1'].forEach(function (g) {
            var cnt = counters[g];
            var pct = Math.round((cnt / totalCount) * 100);
            var color = bgColor(g);
            html += '<div class="stat-row">' +
                '<div class="stat-badge" style="background:' + color + ';">' + g + '</div>' +
                '<div class="stat-bar-wrap"><div class="stat-bar" style="width:' + Math.max(pct, 6) + '%;background:' + color + ';">' + (pct > 15 ? pct + '%' : '') + '</div></div>' +
                '<div class="stat-count">' + cnt + ' <small>' + plural(cnt, ['человек','человека','человек']) + '</small></div>' +
                '</div>';
        });
        list.innerHTML = html;
        total.textContent = 'Всего оценок за урок: ' + totalCount;
        modal.classList.add('show');
    }
    window.openStats = openStats;

    document.getElementById('statsModal').addEventListener('click', function (e) {
        if (e.target.id === 'statsModal') closeStats();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeStats();
    });

    // Экспорт для отладки в консоли
    window.__diag = {
        bgColor: bgColor,
        initSubTabs: initSubTabs,
        switchSubTab: switchSubTab,
        collectAll: collectAll
    };
})();
</script>
