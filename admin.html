<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник.ру — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

/* ===== ЭКРАН ЗАГРУЗКИ ===== */
.loading-screen { position: fixed; inset: 0; z-index: 10001; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); }
.loading-screen.hidden { display: none; }
.loading-box { text-align: center; color: #fff; }
.spinner { width: 56px; height: 56px; border: 5px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 16px; font-weight: 500; letter-spacing: 0.3px; opacity: 0.95; }

/* ===== ЭКРАН ВХОДА ===== */
.login-screen { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; }
.login-screen.hidden { display: none; }
.login-box { background: #fff; border-radius: 24px; padding: 44px 40px; max-width: 440px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.35); animation: appear 0.4s ease; }
@keyframes appear { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

.login-logo { width: 72px; height: 72px; margin: 0 auto 22px; background: linear-gradient(135deg, #2a5298, #3b7dd8); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(42,82,152,0.35); }
.login-logo svg { width: 40px; height: 40px; fill: #fff; }
.login-title { font-size: 26px; font-weight: 800; color: #1a2b4a; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
.login-subtitle { font-size: 14px; color: #7a8aa3; text-align: center; margin-bottom: 30px; }

.login-form-group { margin-bottom: 18px; }
.login-form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5a72; margin-bottom: 8px; }
.login-form-group input { width: 100%; height: 52px; padding: 0 18px; font-size: 15px; color: #1a2b4a; background: #f7f9fc; border: 2px solid #e2e8f0; border-radius: 14px; outline: none; transition: all 0.25s ease; font-family: inherit; }
.login-form-group input:focus { border-color: #2a5298; background: #fff; box-shadow: 0 0 0 4px rgba(42,82,152,0.1); }
.login-form-group input::placeholder { color: #a8b5c9; }

.login-btn { width: 100%; height: 54px; margin-top: 10px; background: linear-gradient(135deg, #2a5298, #3b7dd8); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 6px 20px rgba(42,82,152,0.4); font-family: inherit; letter-spacing: 0.3px; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(42,82,152,0.5); }
.login-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

.login-error { background: #fff0f0; color: #d32f2f; padding: 14px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; margin-bottom: 18px; display: none; border: 1px solid #ffd6d6; line-height: 1.4; }
.login-error.show { display: block; }

.login-hint { margin-top: 24px; padding: 16px; background: #f0f5ff; border-radius: 14px; font-size: 12px; color: #4a5a72; line-height: 1.6; text-align: center; }
.login-hint strong { color: #2a5298; font-weight: 700; }

/* ===== ЭКРАН ОШИБКИ ===== */
.error-screen { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; }
.error-screen.show { display: flex; }
.error-box { background: #fff; border-radius: 24px; padding: 44px 40px; max-width: 440px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.35); text-align: center; animation: appear 0.4s ease; }
.error-icon { width: 72px; height: 72px; margin: 0 auto 22px; background: linear-gradient(135deg, #ff6b6b, #d32f2f); border-radius: 20px; display: flex; align-items: center; justify-content: center; }
.error-icon svg { width: 40px; height: 40px; fill: #fff; }
.error-title { font-size: 22px; font-weight: 800; color: #1a2b4a; margin-bottom: 12px; }
.error-text { font-size: 14px; color: #7a8aa3; line-height: 1.6; margin-bottom: 24px; }
.error-btn { width: 100%; height: 50px; background: linear-gradient(135deg, #2a5298, #3b7dd8); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 6px 18px rgba(42,82,152,0.35); font-family: inherit; }
.error-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(42,82,152,0.45); }

@media (max-width: 500px) {
    .login-box, .error-box { padding: 32px 24px; }
    .login-title { font-size: 22px; }
}
</style>
</head>
<body>

<!-- ==================== ЭКРАН ЗАГРУЗКИ ==================== -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>
</div>

<!-- ==================== ЭКРАН ВХОДА ==================== -->
<div class="login-screen hidden" id="loginScreen">
    <div class="login-box">
        <div class="login-logo">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
        </div>
        <div class="login-title">Дневник.ру</div>
        <div class="login-subtitle">Вход в систему</div>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm">
            <div class="login-form-group">
                <label for="loginInput">Логин</label>
                <input type="text" id="loginInput" placeholder="Например: ivanov.ivan" autocomplete="username" required>
            </div>
            <div class="login-form-group">
                <label for="passwordInput">Пароль</label>
                <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Войти</button>
        </form>

        <div class="login-hint">
            🔒 <strong>Безопасный вход.</strong> Система автоматически определяет вашу роль.<br>
            Сессия — 24 часа.
        </div>
    </div>
</div>

<!-- ==================== ЭКРАН ОШИБКИ ==================== -->
<div class="error-screen" id="errorScreen">
    <div class="error-box">
        <div class="error-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>
        <div class="error-title" id="errorTitle">Доступ запрещён</div>
        <div class="error-text" id="errorText">Ваш аккаунт не найден в системе. Обратитесь к администратору.</div>
        <button class="error-btn" onclick="handleLogoutAndReload()">Выйти и попробовать снова</button>
    </div>
</div>

<script src="supabase-config.js"></script>
<script>
// ============================================================
// КОНСТАНТЫ
// ============================================================
const AUTH_EMAIL_DOMAIN = '@school-journal-8f39a.firebaseapp.com';
const SESSION_KEY = 'dr_universal_session';
const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

// ============================================================
// СЕССИЯ
// ============================================================
function getSession() {
    try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s.loggedAt || !s.expiresAt) return null;
        if (Date.now() > s.expiresAt) { localStorage.removeItem(SESSION_KEY); return null; }
        return s;
    } catch (e) { return null; }
}
function saveSession(email, role, entityId) {
    const now = Date.now();
    localStorage.setItem(SESSION_KEY, JSON.stringify({
        email, role, entityId, loggedAt: now, expiresAt: now + SESSION_DURATION_MS
    }));
}
function clearSession() { localStorage.removeItem(SESSION_KEY); }

// ============================================================
// ЭКРАНЫ
// ============================================================
function showLoading() {
    document.getElementById('loadingScreen').classList.remove('hidden');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('errorScreen').classList.remove('show');
}
function showLogin() {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('errorScreen').classList.remove('show');
}
function showError(title, text) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('errorScreen').classList.add('show');
    if (title) document.getElementById('errorTitle').textContent = title;
    if (text) document.getElementById('errorText').textContent = text;
}

// ============================================================
// ОПРЕДЕЛЕНИЕ РОЛИ
// ============================================================
async function determineRole(user) {
    // user — объект из Firebase Auth
    if (!user || !user.uid) return { role: 'unknown' };

    const uid = user.uid;
    const email = user.email || '';
    const login = email.split('@')[0];

    // 1. Проверяем — админ ли это? (UID в коллекции admins)
    try {
        const admins = await DB.getAll('admins');
        const isAdmin = admins.some(a => a.id === uid);
        if (isAdmin) {
            return { role: 'admin', entityId: uid };
        }
    } catch (e) { console.error('Ошибка проверки админа:', e); }

    // 2. Проверяем — учитель ли это? (логин совпадает с полем login в teachers)
    try {
        const teachers = await DB.getAll('teachers');
        const teacher = teachers.find(t =>
            t.login && t.login.toLowerCase() === login.toLowerCase()
        );
        if (teacher) {
            return { role: 'teacher', entityId: teacher.id, teacher };
        }
    } catch (e) { console.error('Ошибка проверки учителя:', e); }

    // 3. Не нашли
    return { role: 'unknown' };
}

// ============================================================
// МАРШРУТИЗАЦИЯ
// ============================================================
function redirectTo(role) {
    if (role === 'admin') {
        window.location.href = 'admin.html';
    } else if (role === 'teacher') {
        window.location.href = 'teacher.html';
    } else {
        showError('Доступ запрещён', 'Ваш аккаунт не найден в системе. Обратитесь к администратору школы.');
    }
}

// ============================================================
// ВХОД
// ============================================================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const login = document.getElementById('loginInput').value.trim();
    const pwd = document.getElementById('passwordInput').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Проверка...';

    try {
        const fb = await window._fbReady;
        const fullEmail = login.includes('@') ? login : login + AUTH_EMAIL_DOMAIN;

        const cred = await fb.signInWithEmailAndPassword(fb.auth, fullEmail, pwd);
        const user = cred.user;

        showLoading();

        const result = await determineRole(user);

        if (result.role === 'unknown') {
            // Разлогиниваем
            try { await fb.signOut(fb.auth); } catch (e) {}
            clearSession();
            showError('Доступ запрещён', 'Ваш аккаунт не найден в системе. Обратитесь к администратору школы.');
            return;
        }

        saveSession(fullEmail, result.role, result.entityId);
        redirectTo(result.role);

    } catch (e) {
        console.error('Ошибка входа:', e);
        let msg = 'Не удалось войти. Проверьте логин и пароль.';
        if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'Неверный логин или пароль.';
        if (e.code === 'auth/user-not-found') msg = 'Пользователь не найден.';
        if (e.code === 'auth/too-many-requests') msg = 'Слишком много попыток. Попробуйте позже.';
        if (e.code === 'auth/invalid-email') msg = 'Неверный формат логина.';
        err.textContent = msg;
        err.classList.add('show');
        showLogin();
    } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
    }
});

// ============================================================
// АВТОВХОД ПРИ ЗАГРУЗКЕ
// ============================================================
window.addEventListener('load', async () => {
    showLoading();

    try {
        const fb = await window._fbReady;

        // Ждём восстановления сессии Firebase
        const user = await new Promise((resolve) => {
            const unsub = fb.onAuthStateChanged(fb.auth, (u) => {
                unsub();
                resolve(u);
            });
        });

        if (!user) {
            // Не вошёл — показываем экран входа
            showLogin();
            return;
        }

        // Вошёл — определяем роль
        const result = await determineRole(user);

        if (result.role === 'unknown') {
            try { await fb.signOut(fb.auth); } catch (e) {}
            clearSession();
            showError('Доступ запрещён', 'Ваш аккаунт не найден в системе. Обратитесь к администратору школы.');
            return;
        }

        saveSession(user.email, result.role, result.entityId);
        redirectTo(result.role);

    } catch (e) {
        console.error('Ошибка автовхода:', e);
        showLogin();
    }
});

// ============================================================
// ВЫХОД И ПЕРЕЗАГРУЗКА
// ============================================================
async function handleLogoutAndReload() {
    try {
        const fb = await window._fbReady;
        await fb.signOut(fb.auth);
    } catch (e) {}
    clearSession();
    location.reload();
}
</script>
</body>
</html>
