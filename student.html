<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник.ру — Кабинет ученика</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { min-height: 100vh; background: #eef2f8; color: #1a2b4a; }

        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; padding: 0 24px; height: 70px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 16px rgba(30,60,114,0.25); position: sticky; top: 0; z-index: 100; }
        .header-logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .header-logo-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .header-logo-icon svg { width: 22px; height: 22px; fill: #fff; }
        .header-user { display: flex; align-items: center; gap: 16px; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.12); padding: 8px 16px 8px 8px; border-radius: 30px; font-size: 14px; font-weight: 500; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #3b7dd8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .logout-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background 0.2s ease; font-family: inherit; }
        .logout-btn:hover { background: rgba(255,255,255,0.22); }
        .logout-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px 24px 60px; }

        .tabs { display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 16px; box-shadow: 0 4px 16px rgba(30,60,114,0.08); margin-bottom: 24px; }
        .tab-btn { flex: 1; padding: 12px 16px; border: none; background: transparent; color: #5a6a85; font-size: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
        .tab-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .tab-btn:hover { background: #f0f4f9; color: #2a5298; }
        .tab-btn.active { background: linear-gradient(135deg, #2a5298, #3b7dd8); color: #fff; box-shadow: 0 6px 16px rgba(42,82,152,0.3); }

        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .warn-box { border-radius: 14px; padding: 18px 22px; margin-bottom: 24px; display: flex; gap: 14px; align-items: flex-start; animation: warnAppear 0.4s ease; }
        @keyframes warnAppear { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .warn-icon { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; }
        .warn-body { flex: 1; }
        .warn-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .warn-list { margin: 6px 0 10px 20px; font-size: 14px; line-height: 1.7; color: #2a3a52; }
        .warn-hint { font-size: 14px; color: #2a3a52; line-height: 1.5; }
        .warn-hint b { color: #1a2b4a; }
        .warn-box.fails { background: #fff0f0; border: 2px solid #ffd6d6; }
        .warn-box.fails .warn-icon { fill: #d32f2f; }
        .warn-box.fails .warn-title { color: #d32f2f; }
        .warn-box.absences { background: #fff8e6; border: 2px solid #ffe4a3; }
        .warn-box.absences .warn-icon { fill: #b8720a; }
        .warn-box.absences .warn-title { color: #b8720a; }

        .info-banner { background: #fff; border-radius: 14px; padding: 16px 20px; box-shadow: 0 4px 16px rgba(30,60,114,0.07); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 24px; }
        .info-banner-item { display: flex; flex-direction: column; gap: 4px; }
        .info-banner-label { font-size: 11px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-banner-value { font-size: 15px; font-weight: 600; color: #1a2b4a; }

        /* ====== Сегодня ====== */
        .grades-strip-label {
            font-size: 12px;
            font-weight: 700;
            color: #7a8aa3;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
        }
        .grades-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .grade-tile {
            width: 76px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .grade-tile:hover { transform: translateY(-2px); }
        .grade-tile:not([data-subject]) { cursor: default; }
        .grade-tile:not([data-subject]):hover { transform: none; }

        .grade-tile-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 400;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            margin-bottom: 6px;
        }
        .grade-tile.g5 .grade-tile-box,
        .grade-tile.g4 .grade-tile-box { background: #65A30D; }
        .grade-tile.g3 .grade-tile-box { background: #FB923C; }
        .grade-tile.g2 .grade-tile-box,
        .grade-tile.g1 .grade-tile-box { background: #DC2626; }
        .grade-tile.gn .grade-tile-box { background: #94A3B8; }

        .grade-tile-subject {
            font-size: 12px;
            font-weight: 600;
            color: #1a2b4a;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76px;
            text-align: left;
        }
        .grade-tile-type {
            font-size: 10.5px;
            color: #94a3b8;
            line-height: 1.2;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76px;
            text-align: left;
        }

        .grades-hint {
            font-size: 12px;
            color: #b8720a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grades-hint::before { content: '👉'; }

        .today-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(30,60,114,0.07);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .today-card-inner { padding: 20px 22px; }

        .day-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            border-top: 1px solid #eef2f8;
        }
        .day-nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f4f9;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-family: inherit;
            flex-shrink: 0;
        }
        .day-nav-btn:hover { background: #dbeafe; }
        .day-nav-btn svg { width: 18px; height: 18px; fill: #2a5298; }
        .day-nav-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a2b4a;
            text-align: center;
            flex: 1;
        }

        .day-empty {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .day-empty-emoji { font-size: 40px; margin-bottom: 12px; }
        .day-empty-title { font-size: 15px; font-weight: 700; color: #5a6a85; margin-bottom: 6px; }
        .day-empty-text { font-size: 13px; line-height: 1.5; max-width: 320px; margin: 0 auto; }

        .today-lessons { display: flex; flex-direction: column; gap: 10px; }
        .today-lesson {
            display: grid;
            grid-template-columns: 40px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #93c5fd;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .today-lesson:hover { background: #eff6ff; }
        .today-lesson-num {
            width: 32px; height: 32px;
            background: #dbeafe; color: #2563eb;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px;
        }
        .today-lesson-info { min-width: 0; }
        .today-lesson-subject { font-size: 14px; font-weight: 700; color: #1a2b4a; }
        .today-lesson-meta { font-size: 12px; color: #7a8aa3; margin-top: 2px; }
        .today-lesson-topic { font-size: 12px; color: #334155; margin-top: 4px; line-height: 1.4; }
        .today-lesson-topic b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
        .today-lesson-hw { font-size: 12px; color: #1e40af; margin-top: 4px; line-height: 1.4; }
        .today-lesson-hw b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }

        .today-lesson-grade {
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 17px;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .today-lesson-grade.g5, .today-lesson-grade.g4 { background: #65A30D; }
        .today-lesson-grade.g3 { background: #FB923C; }
        .today-lesson-grade.g2, .today-lesson-grade.g1 { background: #DC2626; }
        .today-lesson-grade.gn { background: #94A3B8; }
        .today-lesson-grade.no-grade {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
        }

        /* ====== ДНЕВНИК (сетка) ====== */
        .week-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .week-title { font-size: 20px; font-weight: 700; color: #1a2b4a; }
        .week-range { font-size: 13px; color: #7a8aa3; margin-top: 2px; }
        .week-badge { background: #dbeafe; color: #2563eb; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }

        .week-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .week-grid::-webkit-scrollbar { height: 10px; }
        .week-grid::-webkit-scrollbar-track { background: #eef2f8; border-radius: 5px; }
        .week-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        .week-grid::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .day-column {
            flex: 0 0 250px;
            min-width: 250px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(30,60,114,0.07);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            scroll-snap-align: start;
        }
        .day-column.today { box-shadow: 0 4px 20px rgba(37,99,235,0.18); border: 2px solid #2563eb; }

        .day-header {
            background: linear-gradient(135deg, #4a7bc8, #5b8fd9);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .day-column.today .day-header { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .day-header-left { display: flex; flex-direction: column; gap: 2px; }
        .day-name { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .day-date { font-size: 11px; color: rgba(255,255,255,0.85); }
        .day-today-badge { background: #fff; color: #2563eb; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; letter-spacing: 0.3px; }

        .day-body { padding: 10px 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .lesson-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border-left: 3px solid #93c5fd;
            position: relative;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .lesson-card:hover { background: #eff6ff; }
        .lesson-card.empty { background: transparent; border-left: 3px dashed #e2e8f0; padding: 6px 12px; cursor: default; }
        .lesson-card.empty:hover { background: transparent; }
        .lesson-card.empty .lesson-subject { color: #cbd5e1; font-weight: 400; font-style: italic; font-size: 12px; }

        .lesson-row-head { display: flex; align-items: flex-start; gap: 8px; padding-right: 34px; }
        .lesson-num {
            width: 20px; height: 20px;
            background: #dbeafe; color: #2563eb;
            border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px;
            flex-shrink: 0;
        }
        .lesson-subject { font-size: 13px; font-weight: 700; color: #1a2b4a; line-height: 1.3; }
        .lesson-meta { font-size: 11px; color: #7a8aa3; margin-top: 3px; line-height: 1.4; }
        .lesson-section { margin-top: 6px; font-size: 11.5px; line-height: 1.45; }
        .lesson-label { font-weight: 700; color: #7a8aa3; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
        .lesson-value { color: #334155; }
        .lesson-value.hw { color: #1e40af; }

        .lesson-grade {
            position: absolute;
            top: 8px;
            right: 8px;
            min-width: 26px;
            height: 26px;
            padding: 0 7px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .lesson-grade.g5, .lesson-grade.g4 { background: #65A30D; }
        .lesson-grade.g3 { background: #FB923C; }
        .lesson-grade.g2, .lesson-grade.g1 { background: #DC2626; }
        .lesson-grade.gn { background: #94A3B8; }
        .lesson-grade.no-grade { background: #e2e8f0; color: #94a3b8; font-weight: 400; font-size: 12px; box-shadow: none; }

        /* ====== ОЦЕНКИ — ТАБЛИЦА (как скриншот 4) ====== */
        .period-tabs-wrapper { margin-bottom: 16px; }
        .period-tabs-group { display: inline-flex; align-items: center; gap: 0; padding: 4px; background: #fff; border: 1px solid #CBD5E1; border-radius: 12px; flex-wrap: wrap; }
        .tab-pill { padding: 8px 16px; background: transparent; color: #64748B; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; user-select: none; border: 1px solid transparent; font-family: inherit; white-space: nowrap; transition: all 0.15s ease; line-height: 1.2; }
        .tab-pill:hover { background: #F1F5F9; color: #334155; }
        .tab-pill.active { background: linear-gradient(135deg, #2a5298, #3b7dd8); color: #fff; box-shadow: 0 2px 8px rgba(42,82,152,0.3); }
        .tab-pill:disabled { cursor: default; opacity: 0.7; }

        .grades-table-wrapper {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(30,60,114,0.07);
            overflow: hidden;
        }
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        .grades-table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
            font-size: 11px;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .grades-table th.center { text-align: center; }
        .grades-table th.col-subject { width: 34%; padding-left: 22px; }
        .grades-table th.col-grades { width: 46%; }
        .grades-table th.col-avg { width: 10%; text-align: center; }
        .grades-table th.col-qtr { width: 10%; text-align: center; }

        .grades-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .grades-table tbody tr:hover { background: #fafcff; }
        .grades-table tbody tr:last-child td { border-bottom: none; }

        .grades-table td.subject-cell {
            padding-left: 22px;
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
        }
        .grades-table td.grades-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .grades-table td.avg-cell {
            text-align: center;
            font-weight: 700;
            color: #65A30D;
            font-size: 15px;
        }
        .grades-table td.avg-cell.no-grade {
            color: #94a3b8;
            font-weight: 400;
        }
        .grades-table td.qtr-cell {
            text-align: center;
        }
        .no-grades-text {
            color: #94a3b8;
            font-style: italic;
            font-size: 13px;
            font-weight: 400;
        }

        /* Маленькие квадратики с оценками (как на скрине 4) */
        .mini-grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 5px;
            font-weight: 500;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.12s ease;
            margin-right: 2px;
        }
        .mini-grade:hover { transform: scale(1.12); }
        .mini-grade.g5, .mini-grade.g4 { background: #65A30D; }
        .mini-grade.g3 { background: #FB923C; }
        .mini-grade.g2, .mini-grade.g1 { background: #DC2626; }
        .mini-grade.gn { background: #94A3B8; }
        .mini-grade:not([data-subject]) { cursor: default; }
        .mini-grade:not([data-subject]):hover { transform: none; }

        .qtr-grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 15px;
            color: #fff;
        }
        .qtr-grade.g5, .qtr-grade.g4 { background: #65A30D; }
        .qtr-grade.g3 { background: #FB923C; }
        .qtr-grade.g2, .qtr-grade.g1 { background: #DC2626; }
        .qtr-grade.gn { background: #94A3B8; }
        .qtr-grade.no-grade {
            background: transparent;
            color: #94a3b8;
            font-weight: 400;
        }

        /* ====== СТРАНИЦА УРОКА (как скриншот 3) ====== */
        .lesson-page {
            background: #fff;
            border-radius: 14px;
            padding: 32px 36px;
            box-shadow: 0 4px 16px rgba(30,60,114,0.07);
            max-width: 1100px;
            margin: 0 auto;
        }
        .lesson-page-title {
            font-size: 26px;
            font-weight: 700;
            color: #2a5298;
            margin-bottom: 24px;
        }
        .lesson-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #475569;
            margin-top: 24px;
            margin-bottom: 10px;
        }
        .lesson-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            align-items: start;
        }
        .lesson-details-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 24px;
        }
        .lesson-detail-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #eef2f8;
            font-size: 14px;
        }
        .lesson-detail-row:last-child { border-bottom: none; }
        .lesson-detail-label {
            color: #64748b;
        }
        .lesson-detail-value {
            color: #1e293b;
            font-weight: 600;
        }
        .lesson-detail-value.blue { color: #2563eb; }

        .lesson-empty-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .lesson-teacher-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .lesson-teacher-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 26px;
        }
        .lesson-teacher-name {
            color: #16a34a;
            font-weight: 600;
            font-size: 14px;
            line-height: 1.3;
        }

        /* Таблица оценок за работу на занятии */
        .lesson-grades-table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .lesson-grades-table th {
            padding: 10px 16px;
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
            text-align: right;
            background: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .lesson-grades-table td {
            padding: 12px 16px;
            font-size: 14px;
            color: #1e293b;
            border-top: 1px solid #e2e8f0;
            text-align: right;
        }
        .lesson-grades-table td:first-child {
            text-align: left;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 18px;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }
        .back-link:hover { text-decoration: underline; }
        .back-link svg { width: 14px; height: 14px; fill: currentColor; }

        /* ====== МОДАЛКА СТАТИСТИКИ ====== */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26, 43, 74, 0.5); backdrop-filter: blur(4px); z-index: 500; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.25s ease; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 20px; padding: 24px 24px 22px; max-width: 500px; width: 100%; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3); animation: modalAppear 0.3s ease; max-height: 90vh; overflow-y: auto; }
        @keyframes modalAppear { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #eef2f8; }
        .modal-header-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #e6efff, #d4e4ff); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .modal-header-icon svg { width: 22px; height: 22px; fill: #2a5298; }
        .modal-title { font-size: 17px; font-weight: 700; color: #1a2b4a; }
        .modal-subtitle { font-size: 12px; color: #7a8aa3; margin-top: 2px; }

        .stats-list { display: flex; flex-direction: column; gap: 10px; }
        .stat-row { display: flex; align-items: center; gap: 12px; }
        .stat-badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; color: #fff; flex-shrink: 0; }
        .stat-badge.g5, .stat-badge.g4 { background: #65A30D; }
        .stat-badge.g3 { background: #FB923C; }
        .stat-badge.g2, .stat-badge.g1 { background: #DC2626; }
        .stat-bar-wrap { flex: 1; height: 26px; background: #f0f4f9; border-radius: 8px; overflow: hidden; position: relative; }
        .stat-bar { height: 100%; border-radius: 8px; transition: width 0.4s ease; display: flex; align-items: center; padding-left: 10px; font-size: 12px; font-weight: 700; color: #fff; min-width: 24px; }
        .stat-count { width: 60px; text-align: right; font-size: 13px; font-weight: 600; color: #2a3a52; flex-shrink: 0; }
        .stat-count small { color: #7a8aa3; font-weight: 500; }
        .stats-total { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eef2f8; font-size: 13px; color: #7a8aa3; text-align: center; }
        .stats-empty { text-align: center; padding: 20px 10px; color: #8a9bb5; font-size: 14px; }

        .modal-close { width: 100%; height: 44px; margin-top: 16px; background: #f0f2f5; color: #4a5a72; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; font-family: inherit; }
        .modal-close:hover { background: #e2e8f0; }

        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 18px; box-shadow: 0 4px 20px rgba(30,60,114,0.07); }
        .empty-state svg { width: 64px; height: 64px; fill: #d4dce8; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; font-weight: 700; color: #5a6a85; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #8a9bb5; max-width: 400px; margin: 0 auto; line-height: 1.5; }

        .loading { text-align: center; padding: 60px 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(42,82,152,0.15); border-top-color: #2a5298; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: #5a6a85; }

        @media (max-width: 900px) {
            .lesson-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 700px) {
            .header { padding: 0 14px; height: 62px; }
            .header-logo { font-size: 15px; }
            .header-logo-icon { width: 34px; height: 34px; }
            .user-badge span { display: none; }
            .user-badge { padding: 4px; }
            .container { padding: 20px 14px 40px; }
            .week-title { font-size: 17px; }
            .day-column { flex: 0 0 260px; min-width: 260px; }
            .modal { padding: 22px 20px; }
            .stat-count { width: 50px; font-size: 12px; }
            .tabs { padding: 4px; }
            .tab-btn { padding: 10px 8px; font-size: 13px; }
            .grade-tile { width: 70px; }
            .grade-tile-box { width: 38px; height: 38px; font-size: 22px; }
            .grade-tile-subject { max-width: 70px; font-size: 11px; }
            .grade-tile-type { max-width: 70px; font-size: 10px; }
            .lesson-page { padding: 20px 16px; }
            .lesson-page-title { font-size: 20px; }
            .lesson-detail-row { grid-template-columns: 110px 1fr; font-size: 13px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-logo">
        <div class="header-logo-icon"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></div>
        <span>Дневник.ру · Ученик</span>
    </div>
    <div class="header-user">

            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>

<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Загружаем данные...</div>

    <!-- ГЛАВНАЯ СТРАНИЦА (с вкладками) -->
    <div id="content" style="display:none;">
        <div class="info-banner" id="infoBanner"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="today">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                Сегодня
            </button>
            <button class="tab-btn" data-tab="diary">
                <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
                Дневник
            </button>
            <button class="tab-btn" data-tab="grades">
                <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
                Оценки

        <div class="tab-panel active" id="panel-today">
            <div id="todayContent"></div>
        </div>

        <div class="tab-panel" id="panel-diary">
            <div id="diaryContent"></div>
        </div>

        <div class="tab-panel" id="panel-grades">
            <div id="warningContainer"></div>
            <div class="period-tabs-wrapper">
                <div class="period-tabs-group" id="periodTabs"></div>
            </div>
            <div id="gradesTableContainer"></div>
        </div>
    </div>

    <!-- СТРАНИЦА УРОКА (открывается вместо главной) -->
    <div id="lessonPage" style="display:none;">
        <div class="lesson-page" id="lessonPageContent"></div>
    </div>
</div>

<!-- Модалка статистики (клик по оценке) -->
<div class="modal-overlay" id="statsModal">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <div class="modal-header-icon">
                <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
            </div>
            <div>
                <div class="modal-title" id="statsTitle">Статистика</div>
                <div class="modal-subtitle" id="statsSubtitle"></div>
            </div>
        </div>

        <div class="stats-total" id="statsTotal"></div>
        <button class="modal-close" onclick="closeStats()">Закрыть</button>
    </div>
</div>

<script src="supabase-config.js"></script>
<script>
    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const DAYS_KEYS   = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const DAYS_RU     = { mon: 'Пн', tue: 'Вт', wed: 'Ср', thu: 'Чт', fri: 'Пт', sat: 'Сб' };
    const DAYS_FULL   = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье' };
    const JS_DAY_MAP  = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat' };
    const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    const DEFAULT_LESSON_TYPE = 'ОТВ';

    const PERIOD_LABELS = {
        'Четверти':  ['I четверть', 'II четверть', 'III четверть', 'IV четверть'],
        'Полугодия': ['I полугодие', 'II полугодие'],
        'Триместры': ['I триместр', 'II триместр', 'III триместр'],
        'Семестры':  ['I семестр', 'II семестр']
    };

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let CURRENT_STUDENT = null;
    let CURRENT_CLASS = null;
    let ALL_SUBJECTS = [];
    let ALL_TEACHERS = [];
    let ALL_WORKLOADS = [];
    let ALL_JOURNALS = [];
    let ALL_STUDENTS = [];
    let CLASS_STUDENT_IDS = [];
    let CURRENT_SCHEDULE = null;
    let ALL_ROOMS = [];

    let PERIODS = [];
    let PERIOD_SYSTEM = '';
    let ACTIVE_PERIOD_INDEX = 0;

    let TODAY_DATE = new Date();
    TODAY_DATE.setHours(0, 0, 0, 0);

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }
    function formatDateRu(d) {
        return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
    }
    function formatDateLong(d) {
        return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
    }
    function formatDateShort(d) {
        return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    }
    function formatDateHuman(d) {
        return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
    }
    function isoDate(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function parseKey(key) {
        const parts = String(key).split('_');
        const datePart = parts[0];
        const lessonPart = parts[1] || '';
        const d = new Date(datePart + 'T00:00:00');
        return {
            date: isNaN(d.getTime()) ? null : d,
            dateRu: isNaN(d.getTime()) ? datePart : formatDateRu(d),
            lesson: lessonPart
        };
    }
    function gradeClass(grade) {
        const g = String(grade).trim().replace(/[НОБП]|СП/gi, '').trim();
        if (g === '5' || g === '4') return 'g5';
        if (g === '3') return 'g3';
        if (g === '2' || g === '1') return 'g2';
        return 'gn';
    }
    function calcAverage(gradesMap) {
        let sum = 0, cnt = 0;
        Object.values(gradesMap || {}).forEach(raw => {
            const val = String(raw || '').toUpperCase().trim();
            if (!val) return;
            const cleaned = val.replace(/[НОБП]|СП/g, '').trim();
            if (!cleaned) return;
            if (cleaned.includes('/')) {
                cleaned.split('/').forEach(p => {
                    const n = parseInt(p);
                    if (!isNaN(n)) { sum += n; cnt++; }
                });
            } else {
                const n = parseInt(cleaned);
                if (!isNaN(n)) { sum += n; cnt++; }
            }
        });
        return cnt === 0 ? null : (sum / cnt).toFixed(2).replace(/\.00$/, '');
    }
    function plural(n, forms) {
        const a = Math.abs(n) % 100;
        const b = a % 10;
        if (a > 10 && a < 20) return forms[2];
        if (b > 1 && b < 5) return forms[1];
        if (b === 1) return forms[0];
        return forms[2];
    }
    function getMondayOfCurrentWeek() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dow = today.getDay();
        const diff = (dow === 0 ? -6 : 1 - dow);
        const monday = new Date(today);
        monday.setDate(today.getDate() + diff);
        return monday;
    }

    // ============================================================
    // ПЕРИОДЫ
    // ============================================================
    function findActivePeriodIndex() {
        if (PERIODS.length === 0) return 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        for (let i = 0; i < PERIODS.length; i++) {
            const per = PERIODS[i];
            const start = new Date(per.start + 'T00:00:00');
            const end = new Date(per.end + 'T23:59:59');
            if (today >= start && today <= end) return i;
        }
        return 0;
    }

    function renderPeriodTabs() {
        const container = document.getElementById('periodTabs');
        container.innerHTML = '';
        if (PERIODS.length === 0) {
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'tab-pill active';
            tab.textContent = 'Периоды не созданы';
            tab.disabled = true;
            tab.style.cursor = 'default';
            container.appendChild(tab);
            return;
        }
        const labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
        PERIODS.forEach((p, idx) => {
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'tab-pill' + (idx === ACTIVE_PERIOD_INDEX ? ' active' : '');
            tab.textContent = labels[idx] || ('Период ' + (idx + 1));
            tab.title = `${p.start} – ${p.end}`;
            tab.addEventListener('click', () => {
                ACTIVE_PERIOD_INDEX = idx;
                renderPeriodTabs();
                renderGradesTable();
            });
            container.appendChild(tab);
        });
    }

    // ============================================================
    // ПРЕДУПРЕЖДЕНИЯ
    // ============================================================
    function findProblems() {
        const fails = [];
        const absences = [];
        ALL_JOURNALS.forEach(journal => {
            const studentGrades = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            const subjObj = ALL_SUBJECTS.find(s => s.id === journal.subject_id);
            if (!subjObj) return;
            Object.entries(studentGrades).forEach(([key, val]) => {
                const clean = String(val || '').trim().toUpperCase();
                if (clean !== '2' && clean !== 'Н') return;
                const parsed = parseKey(key);
                if (!parsed.date) return;
                const entry = { subject: subjObj.name, date: parsed.date, dateRu: parsed.dateRu };
                if (clean === '2') fails.push(entry);
                else if (clean === 'Н') absences.push(entry);
            });
        });
        fails.sort((a, b) => b.date - a.date);
        absences.sort((a, b) => b.date - a.date);
        return { fails, absences };
    }

    function renderWarnings() {
        const container = document.getElementById('warningContainer');
        container.innerHTML = '';
        const { fails, absences } = findProblems();
        if (fails.length > 0) {
            const box = document.createElement('div');
            box.className = 'warn-box fails';
            const iconSvg = '<svg class="warn-icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
            let titleHtml, listHtml = '';
            if (fails.length === 1) {
                titleHtml = `Тебе поставили <b>2</b> по предмету «${escapeHtml(fails[0].subject)}» (${fails[0].dateRu}).`;
            } else {
                titleHtml = `Тебе поставили двойки:`;
                listHtml = `<ul class="warn-list">${fails.map(f => `<li><b>${escapeHtml(f.subject)}</b> — ${f.dateRu}</li>`).join('')}</ul>`;
            }
            box.innerHTML = `${iconSvg}<div class="warn-body"><div class="warn-title">${titleHtml}</div>${listHtml}<div class="warn-hint">Обычно оценку можно исправить. <b>Спроси учителя, что ты можешь для этого сделать.</b></div></div>`;
            container.appendChild(box);
        }
        if (absences.length > 0) {
            const box = document.createElement('div');
            box.className = 'warn-box absences';
            const iconSvg = '<svg class="warn-icon" viewBox="0 0 24 24"><path d="M11 7h2v6h-2zm0 8h2v2h-2zm1-13C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>';
            let titleHtml, listHtml = '';
            if (absences.length === 1) {
                titleHtml = `Тебя не было на уроке «${escapeHtml(absences[0].subject)}» (${absences[0].dateRu}).`;
            } else {
                titleHtml = `Тебя не было на уроках:`;
                listHtml = `<ul class="warn-list">${absences.map(a => `<li><b>${escapeHtml(a.subject)}</b> — ${a.dateRu}</li>`).join('')}</ul>`;
            }
            box.innerHTML = `${iconSvg}<div class="warn-body"><div class="warn-title">${titleHtml}</div>${listHtml}<div class="warn-hint">Если есть уважительная причина, <b>обсуди её с учителем.</b></div></div>`;
            container.appendChild(box);
        }
    }

    // ============================================================
    // ВКЛАДКА "СЕГОДНЯ"
    // ============================================================
    function renderToday() {
        const container = document.getElementById('todayContent');
        const date = TODAY_DATE;
        const dow = date.getDay();
        const dowKey = JS_DAY_MAP[dow] || 'sun';
        const dayName = DAYS_FULL[dowKey] || 'Воскресенье';

        const grades = getGradesForDate(date);
        let gradesHtml = '';
        if (grades.length > 0) {
            gradesHtml = `
                <div class="grades-strip-label">${formatDateHuman(date).toUpperCase()}</div>
                <div class="grades-strip">
                    ${grades.map(g => {
                        const cls = gradeClass(g.grade);
                        const tip = g.type || DEFAULT_LESSON_TYPE;
                        const isNumeric = /^[1-5]$/.test(g.grade.trim());
                        return `<div class="grade-tile ${cls}" ${isNumeric ? `data-subject="${escapeHtml(g.subject)}" data-key="${escapeHtml(g.key)}"` : ''}>
                            <div class="grade-tile-box">${escapeHtml(g.grade)}</div>
                            <div class="grade-tile-subject">${escapeHtml(g.subject)}</div>
                            <div class="grade-tile-type">${escapeHtml(tip)}</div>
                        </div>`;
                    }).join('')}
                </div>
                <div class="grades-hint">Нажми на оценку, чтобы увидеть статистику класса</div>
            `;
        } else {
            gradesHtml = `
                <div class="grades-strip-label">${formatDateHuman(date).toUpperCase()}</div>
                <div style="color:#94a3b8;font-size:13px;padding:8px 0 16px;">Оценок за этот день нет</div>
            `;
        }

        const dayLessons = getLessonsForDate(date);
        let lessonsHtml = '';
        if (dayLessons.length === 0) {
            const isWeekend = dow === 0;
            lessonsHtml = `<div class="day-empty"><div class="day-empty-emoji">${isWeekend ? '☕' : '📅'}</div><div class="day-empty-title">${isWeekend ? 'Выходной день' : 'Нет занятий'}</div><div class="day-empty-text">${isWeekend ? 'Отдыхай и набирайся сил!' : 'На этот день уроков нет'}</div></div>`;
        } else {
            lessonsHtml = `<div class="today-lessons">
                ${dayLessons.map(l => {
                    const gradeVal = l.grade;
                    let gradeHtml = '';
                    if (gradeVal) {
                        const cls = gradeClass(gradeVal);
                        gradeHtml = `<div class="today-lesson-grade ${cls}">${escapeHtml(gradeVal)}</div>`;
                    } else {
                        gradeHtml = `<div class="today-lesson-grade no-grade">—</div>`;
                    }
                    const metaParts = [];
                    if (l.teacherName) metaParts.push(l.teacherName);
                    if (l.roomName) metaParts.push('каб. ' + l.roomName);
                    const metaHtml = metaParts.length > 0 ? `<div class="today-lesson-meta">${escapeHtml(metaParts.join(' · '))}</div>` : '';
                    const topicHtml = l.topic ? `<div class="today-lesson-topic"><b>Тема:</b>${escapeHtml(l.topic)}</div>` : '';
                    const hwHtml = l.homework ? `<div class="today-lesson-hw"><b>ДЗ:</b>${escapeHtml(l.homework)}</div>` : '';
                    return `<div class="today-lesson" data-subject="${escapeHtml(l.subject)}" data-date="${isoDate(date)}" data-num="${l.num}">
                        <div class="today-lesson-num">${l.num}</div>
                        <div class="today-lesson-info">

                </div>
                <div class="today-card-inner" style="padding-top:0;">${lessonsHtml}</div>
            </div>
        `;

            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                openStats(tile.dataset.subject, tile.dataset.key);

        container.querySelectorAll('.today-lesson[data-subject]').forEach(row => {
            row.addEventListener('click', () => {

    function getLessonsForDate(date) {
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
        const dow = date.getDay();
        const dowKey = JS_DAY_MAP[dow];
        if (!dowKey) return [];
        const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
        const nums = Object.keys(dayGrid).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
        if (nums.length === 0) return [];
        const maxNum = Math.max(...nums);
        const result = [];
        for (let n = 1; n <= maxNum; n++) {
            const lesson = dayGrid[n] || dayGrid[String(n)];
            if (!lesson || !lesson.subject) continue;
            let teacherName = lesson.teacherName || '';
            if (!teacherName && lesson.teacherId) {
                const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId);
                if (t) teacherName = t.full_name;
            }
            let roomName = lesson.roomName || '';
            if (!roomName && lesson.roomId) {
                const r = ALL_ROOMS.find(x => x.id === lesson.roomId);
                if (r) roomName = r.number + (r.name ? ' (' + r.name + ')' : '');
            }
            let topic = '', homework = '', gradeVal = null;
            const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
            if (subjObj) {
                const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                if (journal) {
                    const key = isoDate(date) + '_' + n;
                    if (journal.lessons && journal.lessons[key]) {
                        topic = journal.lessons[key].t || '';
                        homework = journal.lessons[key].h || '';
                    }
                    if (journal.grades && journal.grades[CURRENT_STUDENT.id]) {
                        const v = journal.grades[CURRENT_STUDENT.id][key];
                        if (v) gradeVal = String(v).trim();
                    }
                }
            }
            result.push({ num: n, subject: lesson.subject, teacherName, roomName, topic, homework, grade: gradeVal });
        }
        return result;
    }

    function shiftDay(delta) {
        const next = new Date(TODAY_DATE);
        next.setDate(next.getDate() + delta);
        TODAY_DATE = next;
        renderToday();
    }

    // ============================================================
    // ДНЕВНИК (сетка) — клик по уроку = страница урока
    // ============================================================
    function renderDiary() {
        const container = document.getElementById('diaryContent');
        const monday = getMondayOfCurrentWeek();
        const saturday = new Date(monday);
        saturday.setDate(monday.getDate() + 5);
        const rangeText = `${formatDateShort(monday)} – ${formatDateRu(saturday)}`;

        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) {
            container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg><h3>Расписание ещё не составлено</h3><p>Обратитесь к администратору школы.</p></div>`;
            return;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let html = `<div class="week-title-bar"><div><div class="week-title">Текущая неделя</div><div class="week-range">${rangeText}</div></div><div class="week-badge">Расписание</div></div><div class="week-grid">`;

        const grid = CURRENT_SCHEDULE.grid;
        let maxLesson = 7;
        DAYS_KEYS.forEach(day => {
            const dayGrid = grid[day] || {};
            Object.keys(dayGrid).forEach(num => {
                const n = parseInt(num, 10);
                if (!isNaN(n) && n > maxLesson) maxLesson = n;
            });
        });

        DAYS_KEYS.forEach((dayKey, idx) => {
            const date = new Date(monday);
            date.setDate(monday.getDate() + idx);
            const isToday = date.getTime() === today.getTime();
            const dayGrid = grid[dayKey] || {};

            let lessonsHtml = '';
            for (let n = 1; n <= maxLesson; n++) {
                const lesson = dayGrid[n] || dayGrid[String(n)];
                if (!lesson || !lesson.subject) {
                    lessonsHtml += `<div class="lesson-card empty"><div class="lesson-subject">Урок ${n} —</div></div>`;
                    continue;
                }
                let teacherName = lesson.teacherName || '';
                if (!teacherName && lesson.teacherId) {
                    const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId);
                    if (t) teacherName = t.full_name;
                }
                let roomName = lesson.roomName || '';
                if (!roomName && lesson.roomId) {
                    const r = ALL_ROOMS.find(x => x.id === lesson.roomId);
                    if (r) roomName = r.number + (r.name ? ' (' + r.name + ')' : '');
                }
                let topic = '', homework = '';
                const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
                if (subjObj) {
                    const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                    if (journal && journal.lessons) {
                        const key = isoDate(date) + '_' + n;
                        const lessonData = journal.lessons[key];
                        if (lessonData) {
                            topic = lessonData.t || '';
                            homework = lessonData.h || '';
                        }
                    }
                }
                const gradeVal = getLessonGrade(date, n, lesson.subject);
                let gradeHtml = '';
                if (gradeVal) {
                    const cls = gradeClass(gradeVal);
                    gradeHtml = `<div class="lesson-grade ${cls}">${escapeHtml(gradeVal)}</div>`;
                } else {
                    gradeHtml = `<div class="lesson-grade no-grade">—</div>`;
                }
                const metaParts = [];
                if (teacherName) metaParts.push(teacherName);
                if (roomName) metaParts.push('каб. ' + roomName);
                const metaHtml = metaParts.length > 0 ? `<div class="lesson-meta">${escapeHtml(metaParts.join(' · '))}</div>` : '';
                const topicHtml = topic ? `<div class="lesson-section"><span class="lesson-label">Тема:</span><span class="lesson-value">${escapeHtml(topic)}</span></div>` : '';
                const hwHtml = homework ? `<div class="lesson-section"><span class="lesson-label">ДЗ:</span><span class="lesson-value hw">${escapeHtml(homework)}</span></div>` : '';

                lessonsHtml += `<div class="lesson-card" data-subject="${escapeHtml(lesson.subject)}" data-date="${isoDate(date)}" data-num="${n}">
                    ${gradeHtml}
                    <div class="lesson-row-head">
                        <div class="lesson-num">${n}</div>
                        <div class="lesson-subject">${escapeHtml(lesson.subject)}</div>
                    </div>
                    ${metaHtml}${topicHtml}${hwHtml}

            html += `<div class="day-column ${isToday ? 'today' : ''}">
                <div class="day-header">
                    <div class="day-header-left">

                        <div class="day-date">${formatDateRu(date)}</div>
                    </div>
                    ${isToday ? '<div class="day-today-badge">Сегодня</div>' : ''}

        html += '</div>';

            });
        });

    // ============================================================
    // ОЦЕНКИ — ТАБЛИЦА (как на скрине 4)
    // ============================================================
    function getPeriodRange() {
        if (PERIODS.length === 0 || !PERIODS[ACTIVE_PERIOD_INDEX]) return null;
        const p = PERIODS[ACTIVE_PERIOD_INDEX];
        return {
            start: new Date(p.start + 'T00:00:00'),
            end: new Date(p.end + 'T23:59:59')
        };
    }

    function renderGradesTable() {
        const container = document.getElementById('gradesTableContainer');
        if (ALL_WORKLOADS.length === 0) {
            container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg><h3>У класса нет предметов</h3><p>Обратитесь к администратору.</p></div>`;
            return;
        }

        const range = getPeriodRange();

        // Уникальные предметы
        const seen = new Set();
        const subjects = [];
        ALL_WORKLOADS.forEach(w => {
            if (seen.has(w.subject)) return;
            seen.add(w.subject);
            subjects.push(w.subject);
        });
        subjects.sort((a, b) => a.localeCompare(b, 'ru'));

        const periodLabel = PERIODS.length > 0
            ? ((PERIOD_LABELS[PERIOD_SYSTEM] || [])[ACTIVE_PERIOD_INDEX] || 'Итог')
            : 'Итог';

        let html = '<div class="grades-table-wrapper"><table class="grades-table">';
        html += '<thead><tr>';
        html += '<th class="col-subject">Предмет</th>';
        html += '<th class="col-grades">Оценки</th>';
        html += '<th class="col-avg center">Ср. балл</th>';
        html += `<th class="col-qtr center">${escapeHtml(periodLabel)}</th>`;
        html += '</tr></thead><tbody>';

        subjects.forEach(subjectName => {
            const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
            const journal = subjObj ? ALL_JOURNALS.find(j => j.subject_id === subjObj.id) : null;

            // Собираем оценки ученика по этому предмету за период
            const gradesArr = [];
            if (journal && journal.grades && journal.grades[CURRENT_STUDENT.id]) {
                Object.entries(journal.grades[CURRENT_STUDENT.id]).forEach(([key, val]) => {
                    if (val === '' || val === null || val === undefined) return;
                    if (range) {
                        const parsed = parseKey(key);
                        if (parsed.date && (parsed.date < range.start || parsed.date > range.end)) return;
                    }
                    gradesArr.push({ key, grade: String(val) });
                });
            }
            gradesArr.sort((a, b) => a.key.localeCompare(b.key));

            // Средний балл
            const gradesMap = {};
            gradesArr.forEach(g => { gradesMap[g.key] = g.grade; });
            const avg = calcAverage(gradesMap);

            // Итог за период
            const qtrGrades = journal && journal.qtr_grades ? (journal.qtr_grades[CURRENT_STUDENT.id] || {}) : {};
            const periodQtr = qtrGrades[ACTIVE_PERIOD_INDEX] || qtrGrades[String(ACTIVE_PERIOD_INDEX)] || null;

            html += '<tr>';
            html += `<td class="subject-cell">${escapeHtml(subjectName)}</td>`;

            // Столбец с оценками
            if (gradesArr.length === 0) {
                html += '<td class="grades-cell"><span class="no-grades-text">Нет выставленных оценок</span></td>';
            } else {
                html += '<td class="grades-cell">';
                gradesArr.forEach(g => {
                    const cls = gradeClass(g.grade);
                    const isNumeric = /^[1-5]$/.test(g.grade.trim());
                    html += `<span class="mini-grade ${cls}" ${isNumeric ? `data-subject="${escapeHtml(subjectName)}" data-key="${escapeHtml(g.key)}"` : ''}>${escapeHtml(g.grade)}</span>`;
                });
                html += '</td>';
            }

            // Ср. балл
            if (avg !== null) {
                html += `<td class="avg-cell">${escapeHtml(String(avg))}</td>`;
            } else {
                html += '<td class="avg-cell no-grade">-</td>';
            }

            // Итог за период
            if (periodQtr) {
                const cls = gradeClass(periodQtr);
                html += `<td class="qtr-cell"><span class="qtr-grade ${cls}">${escapeHtml(String(periodQtr))}</span></td>`;
            } else {
                html += '<td class="qtr-cell"><span class="qtr-grade no-grade">-</span></td>';
            }

            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;

        // Клик по оценке = статистика
        container.querySelectorAll('.mini-grade[data-subject]').forEach(box => {
            box.addEventListener('click', () => {
                openStats(box.dataset.subject, box.dataset.key);
            });
        });
    }

    // ============================================================
    // СТРАНИЦА УРОКА (как на скрине 3)

    function openLessonPage(subjectName, lessonKey) {
        const mainContent = document.getElementById('content');
        const lessonPage = document.getElementById('lessonPage');
        const lessonContent = document.getElementById('lessonPageContent');

        const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
        const journal = subjObj ? ALL_JOURNALS.find(j => j.subject_id === subjObj.id) : null;

        const parsed = parseKey(lessonKey);
        const lessonData = (journal && journal.lessons && journal.lessons[lessonKey]) || null;
        const gradeVal = (journal && journal.grades && journal.grades[CURRENT_STUDENT.id] && journal.grades[CURRENT_STUDENT.id][lessonKey]) || null;
        const lessonType = (journal && journal.lesson_types && journal.lesson_types[lessonKey]) || DEFAULT_LESSON_TYPE;

        // Учитель
        const workload = ALL_WORKLOADS.find(w => w.subject === subjectName);
        let teacherName = '—';
        if (workload) {
            const t = ALL_TEACHERS.find(x => x.id === workload.teacher_id);
            if (t) teacherName = t.full_name;
        }

        // Аудитория
        let roomName = '';
        if (CURRENT_SCHEDULE && CURRENT_SCHEDULE.grid && parsed.date) {
            const dow = parsed.date.getDay();
            const dowKey = JS_DAY_MAP[dow];
            if (dowKey) {
                const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
                const lessonInGrid = dayGrid[parsed.lesson] || dayGrid[String(parsed.lesson)];
                if (lessonInGrid && lessonInGrid.roomName) {
                    roomName = lessonInGrid.roomName;
                }
            }
        }
        if (!roomName && workload) {
            const r = ALL_ROOMS.find(x => x.id === workload.room_id);
            if (r) roomName = r.number + ' каб.';
        }

        // Формируем страницу
        const topic = lessonData ? (lessonData.t || '') : '';
        const homework = lessonData ? (lessonData.h || '') : '';

        // Детали занятия
        let detailRows = '';
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Предмет:</div><div class="lesson-detail-value blue">${escapeHtml(subjectName)}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Дата:</div><div class="lesson-detail-value">${escapeHtml(formatDateLong(parsed.date))}, ${parsed.lesson} занятие</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Кто приходит:</div><div class="lesson-detail-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Аудитория:</div><div class="lesson-detail-value">${escapeHtml(roomName || '—')}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Тема занятия:</div><div class="lesson-detail-value">${topic ? escapeHtml(topic) : '-'}</div></div>`;

        // Оценки за работу на занятии (таблица как на скрине 3)
        const gradeDisplay = gradeVal ? escapeHtml(String(gradeVal)) : 'нет';
        const gradeTypeFull = getLessonTypeFullName(lessonType);

        const gradesTable = `
            <table class="lesson-grades-table">
                <thead><tr><th>Оценка</th></tr></thead>
                <tbody>
                    <tr><td>${escapeHtml(gradeTypeFull)}</td><td>${gradeDisplay}</td></tr>
                </tbody>
            </table>
        `;

        lessonContent.innerHTML = `
            <button class="back-link" onclick="closeLessonPage()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Назад
            </button>
            <div class="lesson-page-title">Страница занятия</div>

            <div class="lesson-grid">
                <div>
                    <div class="lesson-section-title" style="margin-top:0;">Детали занятия</div>
                    <div class="lesson-details-block">
                        ${detailRows}
                    </div>

                    <div class="lesson-section-title">Присутствие на уроке и комментарий преподавателя</div>
                    <div class="lesson-empty-block">Данные не введены преподавателем.</div>

                    <div class="lesson-section-title">Домашние задания</div>
                    <div class="lesson-empty-block">
                        ${homework ? escapeHtml(homework) : 'На это занятие не задано ни одного домашнего задания.'}
                    </div>

                    <div class="lesson-section-title">Оценки за работу на занятии</div>
                    ${gradesTable}
                </div>

                <div>
                    <div class="lesson-section-title" style="margin-top:0;">Преподаватель</div>
                    <div class="lesson-teacher-card">
                        <div class="lesson-teacher-avatar">👤</div>
                        <div class="lesson-teacher-name">${escapeHtml(teacherName)}</div>

    // ============================================================
    // МОДАЛКА СТАТИСТИКИ
    // ============================================================
    function openStats(subjectName, lessonKey) {
        const journal = ALL_JOURNALS.find(j => {
            const subjObj = ALL_SUBJECTS.find(s => s.id === j.subject_id);
            return subjObj && subjObj.name === subjectName;
        });
        const modal = document.getElementById('statsModal');
        const title = document.getElementById('statsTitle');
        const subtitle = document.getElementById('statsSubtitle');
        const list = document.getElementById('statsList');
        const total = document.getElementById('statsTotal');

        const parsed = parseKey(lessonKey);
        title.textContent = subjectName;
        subtitle.textContent = `${parsed.dateRu} · ${parsed.lesson}-й урок`;

        if (!journal) {
            list.innerHTML = '<div class="stats-empty">Статистика недоступна.</div>';
            total.textContent = '';
            modal.classList.add('show');
            return;
        }

        const gradesAll = journal.grades || {};
        const counters = { '5': 0, '4': 0, '3': 0, '2': 0, '1': 0 };
        const validIds = new Set(CLASS_STUDENT_IDS);

        Object.entries(gradesAll).forEach(([studentId, studentGrades]) => {
            if (!validIds.has(studentId)) return;
            const val = studentGrades && studentGrades[lessonKey];
            if (val === undefined || val === null) return;
            const clean = String(val).trim().toUpperCase();
            if (counters[clean] !== undefined) counters[clean]++;
        });

        const totalCount = Object.values(counters).reduce((a, b) => a + b, 0);
        if (totalCount === 0) {
            list.innerHTML = '<div class="stats-empty">Пока нет оценок за этот урок.</div>';
            total.textContent = '';
            modal.classList.add('show');
            return;
        }

        let html = '';
        ['5', '4', '3', '2', '1'].forEach(g => {
            const count = counters[g];
            const percent = totalCount > 0 ? Math.round((count / totalCount) * 100) : 0;
            const barWidth = percent > 0 ? Math.max(percent, 6) : 0;
            const cls = gradeClass(g);
            const word = plural(count, ['человек', 'человека', 'человек']);
            const barColor = (cls === 'g5') ? '#65A30D' : (cls === 'g3') ? '#FB923C' : (cls === 'g2') ? '#DC2626' : '#94A3B8';
            html += `<div class="stat-row"><div class="stat-badge ${cls}">${g}</div><div class="stat-bar-wrap"><div class="stat-bar" style="width:${barWidth}%;background:${barColor}">${percent > 15 ? percent + '%' : ''}</div></div><div class="stat-count">${count} <small>${word}</small></div></div>`;
        });

        list.innerHTML = html;
        total.textContent = `Всего оценок за урок: ${totalCount}`;
        modal.classList.add('show');
    }

    function closeStats() {
        document.getElementById('statsModal').classList.remove('show');
    }

        });
    });

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    window.addEventListener('load', async () => {
        try {
            const fb = await window._fbReady;
            const user = await new Promise((resolve) => {
                const unsub = fb.onAuthStateChanged(fb.auth, (u) => { unsub(); resolve(u); });
            });

            if (!user) { window.location.replace('index.html'); return; }

            const login = user.email.split('@')[0];
            const students = await DB.getAll('students');
            const student = students.find(s => s.login === login);

            if (!student) {
                const admins = await DB.getAll('admins');
                if (admins.some(a => a.id === user.uid)) { window.location.replace('admin.html'); return; }
                const teachers = await DB.getAll('teachers');
                if (teachers.some(t => t.login === login)) { window.location.replace('teacher.html'); return; }
                window.location.replace('index.html');
                return;
            }

            CURRENT_STUDENT = student;
            const shortName = student.full_name.split(' ').slice(0, 2).join(' ');
            document.getElementById('userName').textContent = shortName;
            const initials = student.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;

            await loadAll();
            render();
        } catch (err) {
            console.error('Ошибка инициализации:', err);
            document.getElementById('loading').innerHTML = '<div class="loading-text" style="color:#d32f2f;">Ошибка загрузки. Обновите страницу.</div>';
        }
    });

    async function loadAll() {
        const [classes, subjects, teachers, workloads, journals, students, schedules, rooms, periodDocs] = await Promise.all([
            DB.getAll('classes'),
            DB.getAll('subjects'),
            DB.getAll('teachers'),
            DB.getAll('workloads'),
            DB.getAll('journals'),
            DB.getAll('students'),
            DB.getAll('class_schedules'),
            DB.getAll('rooms'),
            DB.getAll('educational_periods')
        ]);

        ALL_STUDENTS = students;
        ALL_ROOMS = rooms;
        CURRENT_CLASS = classes.find(c => c.id === CURRENT_STUDENT.class_id) || null;
        ALL_SUBJECTS = subjects;
        ALL_TEACHERS = teachers;
        ALL_WORKLOADS = workloads.filter(w => w.class_id === CURRENT_STUDENT.class_id);
        ALL_JOURNALS = journals.filter(j => j.class_id === CURRENT_STUDENT.class_id);
        CLASS_STUDENT_IDS = ALL_STUDENTS.filter(s => s.class_id === CURRENT_STUDENT.class_id).map(s => s.id);

        const classSchedules = schedules.filter(s => s.class_id === CURRENT_STUDENT.class_id);
        const mergedGrid = {};
        classSchedules.forEach(s => {
            if (!s.grid) return;
            Object.entries(s.grid).forEach(([day, lessons]) => {
                if (!mergedGrid[day]) mergedGrid[day] = {};
                Object.entries(lessons || {}).forEach(([num, lesson]) => {
                    if (lesson && lesson.subject && !mergedGrid[day][num]) {
                        mergedGrid[day][num] = lesson;
                    }
                });
            });
        });
        CURRENT_SCHEDULE = Object.keys(mergedGrid).length > 0 ? { grid: mergedGrid } : null;

        const periodDoc = periodDocs[0] || null;
        PERIODS = periodDoc ? (periodDoc.periods || []) : [];
        PERIOD_SYSTEM = periodDoc ? (periodDoc.system || '') : '';
        ACTIVE_PERIOD_INDEX = findActivePeriodIndex();
    }

    function render() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('infoBanner').innerHTML = `
            <div class="info-banner-item"><div class="info-banner-label">ФИО</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.full_name)}</div></div>
            <div class="info-banner-item"><div class="info-banner-label">Класс</div><div class="info-banner-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div></div>
            <div class="info-banner-item"><div class="info-banner-label">Логин</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.login)}</div></div>
        `;

        renderToday();
        renderDiary();
        renderWarnings();
        renderPeriodTabs();
        renderGradesTable();
    }

    async function logout() {
        if (!confirm('Выйти из кабинета?')) return;
        try { const fb = await window._fbReady; await fb.signOut(fb.auth); } catch (e) {}
        try { localStorage.removeItem('sj_session'); } catch (e) {}
        window.location.replace('index.html');
    }
</script>
</body>
</html>
