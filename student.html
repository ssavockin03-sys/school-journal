<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник.ру — Кабинет ученика</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { min-height: 100vh; background: #f0f4f9; color: #1a2b4a; }

        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; padding: 0 24px; height: 70px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 16px rgba(30,60,114,0.25); position: sticky; top: 0; z-index: 100; }
        .header-logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .header-logo-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .header-logo-icon svg { width: 22px; height: 22px; fill: #fff; }
        .header-user { display: flex; align-items: center; gap: 16px; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.12); padding: 8px 16px 8px 8px; border-radius: 30px; font-size: 14px; font-weight: 500; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #3b7dd8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .logout-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background 0.2s ease; font-family: inherit; }
        .logout-btn:hover { background: rgba(255,255,255,0.22); }
        .logout-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
        .page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: #7a8aa3; margin-bottom: 24px; }

        /* ---- Предупреждение о двойках ---- */
        .fails-warning {
            background: #fff0f0;
            border: 2px solid #ffd6d6;
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 24px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            animation: warnAppear 0.4s ease;
        }
        @keyframes warnAppear {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fails-warning-icon { width: 28px; height: 28px; fill: #d32f2f; flex-shrink: 0; margin-top: 2px; }
        .fails-warning-body { flex: 1; }
        .fails-warning-title { font-size: 15px; color: #d32f2f; font-weight: 700; margin-bottom: 6px; }
        .fails-warning-list { margin: 6px 0 10px 20px; color: #2a3a52; font-size: 14px; line-height: 1.7; }
        .fails-warning-hint { font-size: 14px; color: #2a3a52; line-height: 1.5; }
        .fails-warning-hint b { color: #1a2b4a; }

        .info-banner { background: #fff; border-radius: 14px; padding: 16px 20px; box-shadow: 0 4px 16px rgba(30,60,114,0.07); margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; }
        .info-banner-item { display: flex; flex-direction: column; gap: 4px; }
        .info-banner-label { font-size: 11px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-banner-value { font-size: 15px; font-weight: 600; color: #1a2b4a; }

        .subject-card { background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 4px 16px rgba(30,60,114,0.07); margin-bottom: 16px; border-left: 4px solid #2a5298; }
        .subject-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .subject-name { font-size: 18px; font-weight: 700; color: #1a2b4a; }
        .subject-teacher { font-size: 13px; color: #7a8aa3; margin-top: 4px; }

        .grades-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .grade-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 10px; border-radius: 10px; font-weight: 700; font-size: 14px; }
        .g5 { background: #65A30D; color: #fff; }
        .g4 { background: #84CC16; color: #fff; }
        .g3 { background: #FB923C; color: #fff; }
        .g2 { background: #DC2626; color: #fff; }
        .gn { background: #94A3B8; color: #fff; }

        .subject-footer { display: flex; gap: 24px; padding-top: 14px; border-top: 1px solid #eef2f8; flex-wrap: wrap; }
        .stat { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { font-size: 11px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 18px; font-weight: 700; color: #2a5298; }
        .stat-value.green { color: #22874a; }

        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 18px; box-shadow: 0 4px 20px rgba(30,60,114,0.07); }
        .empty-state svg { width: 64px; height: 64px; fill: #d4dce8; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; font-weight: 700; color: #5a6a85; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #8a9bb5; max-width: 400px; margin: 0 auto; line-height: 1.5; }

        .loading { text-align: center; padding: 60px 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(42,82,152,0.15); border-top-color: #2a5298; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: #5a6a85; }

        @media (max-width: 700px) {
            .header { padding: 0 14px; height: 62px; }
            .header-logo { font-size: 15px; }
            .header-logo-icon { width: 34px; height: 34px; }
            .user-badge span { display: none; }
            .user-badge { padding: 4px; }
            .container { padding: 20px 14px 40px; }
            .page-title { font-size: 21px; }
            .subject-card { padding: 18px 16px; }
            .fails-warning { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-logo">
        <div class="header-logo-icon"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></div>
        <span>Дневник.ру · Ученик</span>
    </div>
    <div class="header-user">
        <div class="user-badge">
            <div class="user-avatar" id="userAvatar">УЧ</div>
            <span id="userName">Ученик</span>
        </div>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            Выход
        </button>
    </div>
</header>

<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Загружаем ваши оценки...</div>
    </div>
    <div id="content" style="display:none;">
        <h1 class="page-title">Мои оценки</h1>
        <p class="page-subtitle">Здесь отображаются только ваши оценки. Редактирование недоступно.</p>
        <div id="warningContainer"></div>
        <div class="info-banner" id="infoBanner"></div>
        <div id="subjectsContainer"></div>
    </div>
</div>

<script src="supabase-config.js"></script>
<script>
    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const RECENT_DAYS = 7; // сколько дней назад считается «свежая» двойка

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let CURRENT_STUDENT = null;
    let CURRENT_CLASS = null;
    let ALL_SUBJECTS = [];
    let ALL_TEACHERS = [];
    let ALL_WORKLOADS = [];
    let ALL_JOURNALS = [];

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function gradeClass(grade) {
        const g = String(grade).trim().replace(/[НОБП]|СП/gi, '').trim();
        if (g === '5') return 'g5';
        if (g === '4') return 'g4';
        if (g === '3') return 'g3';
        if (g === '2' || g === '1') return 'g2';
        return 'gn';
    }

    function calcAverage(gradesMap) {
        let sum = 0, cnt = 0;
        Object.values(gradesMap || {}).forEach(raw => {
            const val = String(raw || '').toUpperCase().trim();
            if (!val) return;
            const cleaned = val.replace(/[НОБП]|СП/g, '').trim();
            if (!cleaned) return;
            if (cleaned.includes('/')) {
                cleaned.split('/').forEach(p => {
                    const n = parseInt(p);
                    if (!isNaN(n)) { sum += n; cnt++; }
                });
            } else {
                const n = parseInt(cleaned);
                if (!isNaN(n)) { sum += n; cnt++; }
            }
        });
        return cnt === 0 ? null : (sum / cnt).toFixed(2);
    }

    function formatDateRu(d) {
        return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
    }

    // ============================================================
    // ПОИСК СВЕЖИХ ДВОЕК
    // ============================================================
    function findRecentFails() {
        const cutoff = Date.now() - RECENT_DAYS * 24 * 60 * 60 * 1000;
        const result = [];

        ALL_JOURNALS.forEach(journal => {
            const studentGrades = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            const subjObj = ALL_SUBJECTS.find(s => s.id === journal.subject_id);
            if (!subjObj) return;

            Object.entries(studentGrades).forEach(([key, val]) => {
                if (String(val).trim() !== '2') return;

                const datePart = key.split('_')[0];
                const d = new Date(datePart + 'T00:00:00');
                if (isNaN(d.getTime())) return;

                if (d.getTime() < cutoff) return;

                result.push({
                    subject: subjObj.name,
                    date: d,
                    dateRu: formatDateRu(d)
                });
            });
        });

        result.sort((a, b) => b.date - a.date);
        return result;
    }

    function renderWarning() {
        const container = document.getElementById('warningContainer');
        container.innerHTML = '';

        const fails = findRecentFails();
        if (fails.length === 0) return;

        const warnDiv = document.createElement('div');
        warnDiv.className = 'fails-warning';

        const iconSvg = '<svg class="fails-warning-icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';

        let titleHtml = '';
        let listHtml = '';

        if (fails.length === 1) {
            titleHtml = `Тебе поставили <b>2</b> по предмету «${escapeHtml(fails[0].subject)}» (${fails[0].dateRu}).`;
        } else {
            titleHtml = `Тебе поставили двойки:`;
            listHtml = `<ul class="fails-warning-list">${
                fails.map(f => `<li><b>${escapeHtml(f.subject)}</b> — ${f.dateRu}</li>`).join('')
            }</ul>`;
        }

        warnDiv.innerHTML = `
            ${iconSvg}
            <div class="fails-warning-body">
                <div class="fails-warning-title">${titleHtml}</div>
                ${listHtml}
                <div class="fails-warning-hint">
                    Обычно оценку можно исправить. <b>Спроси учителя, что ты можешь для этого сделать.</b>
                </div>
            </div>
        `;

        container.appendChild(warnDiv);
    }

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    window.addEventListener('load', async () => {
        try {
            const fb = await window._fbReady;
            const user = await new Promise((resolve) => {
                const unsub = fb.onAuthStateChanged(fb.auth, (u) => { unsub(); resolve(u); });
            });

            if (!user) { window.location.replace('index.html'); return; }

            const login = user.email.split('@')[0];

            const students = await DB.getAll('students');
            const student = students.find(s => s.login === login);

            if (!student) {
                const admins = await DB.getAll('admins');
                if (admins.some(a => a.id === user.uid)) {
                    window.location.replace('admin.html');
                    return;
                }
                const teachers = await DB.getAll('teachers');
                if (teachers.some(t => t.login === login)) {
                    window.location.replace('teacher.html');
                    return;
                }
                window.location.replace('index.html');
                return;
            }

            CURRENT_STUDENT = student;

            const shortName = student.full_name.split(' ').slice(0, 2).join(' ');
            document.getElementById('userName').textContent = shortName;
            const initials = student.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;

            await loadAll();
            render();
        } catch (err) {
            console.error('Ошибка инициализации:', err);
            document.getElementById('loading').innerHTML =
                '<div class="loading-text" style="color:#d32f2f;">Ошибка загрузки. Обновите страницу.</div>';
        }
    });

    async function loadAll() {
        const [classes, subjects, teachers, workloads, journals] = await Promise.all([
            DB.getAll('classes'),
            DB.getAll('subjects'),
            DB.getAll('teachers'),
            DB.getAll('workloads'),
            DB.getAll('journals')
        ]);

        CURRENT_CLASS = classes.find(c => c.id === CURRENT_STUDENT.class_id) || null;
        ALL_SUBJECTS = subjects;
        ALL_TEACHERS = teachers;
        ALL_WORKLOADS = workloads.filter(w => w.class_id === CURRENT_STUDENT.class_id);
        ALL_JOURNALS = journals.filter(j => j.class_id === CURRENT_STUDENT.class_id);
    }

    function render() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Предупреждение о свежих двойках
        renderWarning();

        // Информация о ученике
        document.getElementById('infoBanner').innerHTML = `
            <div class="info-banner-item">
                <div class="info-banner-label">ФИО</div>
                <div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.full_name)}</div>
            </div>
            <div class="info-banner-item">
                <div class="info-banner-label">Класс</div>
                <div class="info-banner-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div>
            </div>
            <div class="info-banner-item">
                <div class="info-banner-label">Логин</div>
                <div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.login)}</div>
            </div>
        `;

        const container = document.getElementById('subjectsContainer');

        if (ALL_WORKLOADS.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    <h3>У класса нет предметов</h3>
                    <p>Обратитесь к администратору — для вашего класса не создана нагрузка.</p>
                </div>`;
            return;
        }

        const seen = new Set();
        const subjects = [];
        ALL_WORKLOADS.forEach(w => {
            if (seen.has(w.subject)) return;
            seen.add(w.subject);
            const subjObj = ALL_SUBJECTS.find(s => s.name === w.subject);
            subjects.push({ name: w.subject, id: subjObj ? subjObj.id : null });
        });
        subjects.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

        let html = '';
        let anyGrades = false;

        subjects.forEach(subject => {
            const journal = subject.id
                ? ALL_JOURNALS.find(j => j.subject_id === subject.id)
                : null;

            const workload = ALL_WORKLOADS.find(w => w.subject === subject.name);
            const teacher = workload ? ALL_TEACHERS.find(t => t.id === workload.teacher_id) : null;
            const teacherName = teacher ? teacher.full_name : '—';

            const studentGrades = journal && journal.grades
                ? (journal.grades[CURRENT_STUDENT.id] || {})
                : {};

            const gradesList = Object.entries(studentGrades)
                .filter(([k, v]) => v !== '' && v !== null && v !== undefined)
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([k, v]) => v);

            const qtrGrades = journal && journal.qtr_grades
                ? (journal.qtr_grades[CURRENT_STUDENT.id] || {})
                : {};
            const firstQtr = qtrGrades[0] || qtrGrades['0'] || null;

            const avg = calcAverage(studentGrades);
            if (gradesList.length > 0) anyGrades = true;

            const chipsHtml = gradesList.length === 0
                ? '<span style="color:#a8b5c9;font-size:13px;font-style:italic;">Оценок пока нет</span>'
                : gradesList.map(g => `<span class="grade-chip ${gradeClass(g)}">${escapeHtml(g)}</span>`).join('');

            html += `
                <div class="subject-card">
                    <div class="subject-header">
                        <div>
                            <div class="subject-name">${escapeHtml(subject.name)}</div>
                            <div class="subject-teacher">Учитель: ${escapeHtml(teacherName)}</div>
                        </div>
                    </div>
                    <div class="grades-row">${chipsHtml}</div>
                    <div class="subject-footer">
                        <div class="stat">
                            <div class="stat-label">Средний балл</div>
                            <div class="stat-value">${avg !== null ? avg : '—'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Итог за I четверть</div>
                            <div class="stat-value green">${firstQtr !== null ? escapeHtml(String(firstQtr)) : '—'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Всего оценок</div>
                            <div class="stat-value">${gradesList.length}</div>
                        </div>
                    </div>
                </div>`;
        });

        container.innerHTML = html;

        if (!anyGrades) {
            container.insertAdjacentHTML('beforeend', `
                <div style="text-align:center;padding:20px;color:#8a9bb5;font-size:14px;">
                    Учителя ещё не выставили ни одной оценки. Загляните позже.
                </div>
            `);
        }
    }

    async function logout() {
        if (!confirm('Выйти из кабинета?')) return;
        try {
            const fb = await window._fbReady;
            await fb.signOut(fb.auth);
        } catch (e) {}
        try { localStorage.removeItem('sj_session'); } catch (e) {}
        window.location.replace('index.html');
    }
</script>
</body>
</html>
