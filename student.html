<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник.ру — Кабинет ученика</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { min-height: 100vh; background: #fff; color: #1a2b4a; }

        /* ===== ЭКРАН ЗАГРУЗКИ ===== */
        .loading-screen { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; }
        .loading-screen.hidden { display: none; }
        .loading-box { background: #fff; border-radius: 24px; padding: 44px 40px; max-width: 420px; width: 100%; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); text-align: center; }
        .loading-spinner { width: 56px; height: 56px; border: 5px solid rgba(42,82,152,0.15); border-top-color: #2a5298; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: #5a6a85; font-weight: 500; }

        /* ===== ГЛАВНАЯ ОБЁРТКА ===== */
        .page-wrapper { max-width: 1400px; margin: 0 auto; background: #fff; min-height: 100vh; }

        /* ===== ВЕРХНЯЯ ТЁМНО-СИНЯЯ ПОЛОСА ===== */
        .top-header { background: linear-gradient(135deg, #1565c0, #1976d2); color: #fff; position: sticky; top: 0; z-index: 100; }
        .top-header-inner { padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 20px; }
        .top-header-nav { display: flex; gap: 0; align-items: center; flex: 1; }
        .top-tab { padding: 18px 22px; border: none; background: transparent; color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s ease; position: relative; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
        .top-tab:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .top-tab.active { color: #fff; background: rgba(255,255,255,0.15); }
        .top-tab.active::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 0; height: 3px; background: #fff; border-radius: 3px 3px 0 0; }

        .top-header-user { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .top-user-info { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 20px; background: rgba(255,255,255,0.12); }
        .top-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0d47a1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
        .top-user-name { font-size: 13px; font-weight: 500; color: #fff; }
        .top-logout-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(255,255,255,0.15); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s ease; }
        .top-logout-btn:hover { background: rgba(255,255,255,0.25); }
        .top-logout-btn svg { width: 14px; height: 14px; fill: currentColor; }

        /* ===== СВЕТЛАЯ ПОЛОСА С ПОДРАЗДЕЛАМИ ===== */
        .sub-header { background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 56px; z-index: 99; }
        .sub-header-inner { padding: 0 32px; display: flex; align-items: center; gap: 0; overflow-x: auto; }
        .sub-header-inner::-webkit-scrollbar { height: 0; display: none; }
        .sub-tab { padding: 14px 18px; border: none; background: transparent; color: #4a5a72; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.2s ease; position: relative; white-space: nowrap; }
        .sub-tab:hover { color: #1976d2; }
        .sub-tab.active { color: #1976d2; font-weight: 700; }
        .sub-tab.active::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 0; height: 2px; background: #1976d2; }
        .sub-tab svg { width: 14px; height: 14px; fill: currentColor; vertical-align: middle; margin-right: 5px; }

        /* ===== ШКОЛА ===== */
        .school-bar { background: #fff; padding: 14px 32px 0; }
        .school-name { font-size: 13px; color: #7a8aa3; margin-bottom: 2px; }
        .page-title { font-size: 28px; font-weight: 400; color: #1976d2; margin-bottom: 12px; }

        /* ===== КОНТЕЙНЕР ===== */
        .container { padding: 0 32px 60px; }

        .info-banner { background: #fff; border-radius: 12px; padding: 14px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; margin: 16px 0 20px; display: flex; flex-wrap: wrap; gap: 24px; }
        .info-banner-item { display: flex; flex-direction: column; gap: 3px; }
        .info-banner-label { font-size: 11px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-banner-value { font-size: 14px; font-weight: 600; color: #1a2b4a; }

        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== ПРЕДУПРЕЖДЕНИЯ ===== */
        .warn-box { border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 14px; align-items: flex-start; }
        .warn-icon { width: 26px; height: 26px; flex-shrink: 0; margin-top: 2px; }
        .warn-body { flex: 1; }
        .warn-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
        .warn-list { margin: 6px 0 10px 20px; font-size: 13.5px; line-height: 1.7; color: #2a3a52; }
        .warn-hint { font-size: 13.5px; color: #2a3a52; line-height: 1.5; }
        .warn-hint b { color: #1a2b4a; }
        .warn-box.fails { background: #fff0f0; border: 1.5px solid #ffd6d6; }
        .warn-box.fails .warn-icon { fill: #d32f2f; }
        .warn-box.fails .warn-title { color: #d32f2f; }
        .warn-box.absences { background: #fff8e6; border: 1.5px solid #ffe4a3; }
        .warn-box.absences .warn-icon { fill: #b8720a; }
        .warn-box.absences .warn-title { color: #b8720a; }

        /* ===== КАРТОЧКИ ОЦЕНОК ===== */
        .grades-strip-label { font-size: 12px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
        .grades-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .grade-tile { width: 76px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; transition: transform 0.15s ease; }
        .grade-tile:hover { transform: translateY(-2px); }
        .grade-tile:not([data-subject]) { cursor: default; }
        .grade-tile:not([data-subject]):hover { transform: none; }
        .grade-tile-box { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 400; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,0.12); margin-bottom: 6px; }
        .grade-tile.g5 .grade-tile-box, .grade-tile.g4 .grade-tile-box { background: #65A30D; }
        .grade-tile.g3 .grade-tile-box { background: #FB923C; }
        .grade-tile.g2 .grade-tile-box, .grade-tile.g1 .grade-tile-box { background: #DC2626; }
        .grade-tile.gn .grade-tile-box { background: #94A3B8; }
        .grade-tile-subject { font-size: 12px; font-weight: 600; color: #1a2b4a; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; text-align: left; }
        .grade-tile-type { font-size: 10.5px; color: #94a3b8; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; text-align: left; }
        .grades-hint { font-size: 12px; color: #b8720a; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .grades-hint::before { content: '👉'; }

        /* ===== КАРТОЧКА СЕГОДНЯ ===== */
        .today-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; margin-bottom: 20px; overflow: hidden; }
        .today-card-inner { padding: 20px 22px; }
        .day-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid #eef2f8; }
        .day-nav-btn { width: 36px; height: 36px; border-radius: 50%; background: #f0f4f9; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
        .day-nav-btn:hover { background: #e3f2fd; }
        .day-nav-btn svg { width: 18px; height: 18px; fill: #1976d2; }
        .day-nav-title { font-size: 15px; font-weight: 700; color: #1a2b4a; text-align: center; flex: 1; }

        .day-empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .day-empty-emoji { font-size: 40px; margin-bottom: 12px; }
        .day-empty-title { font-size: 15px; font-weight: 700; color: #5a6a85; margin-bottom: 6px; }
        .day-empty-text { font-size: 13px; line-height: 1.5; max-width: 320px; margin: 0 auto; }

        .today-lessons { display: flex; flex-direction: column; gap: 10px; }
        .today-lesson { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: #f8fafc; border-radius: 10px; border-left: 4px solid #90caf9; cursor: pointer; transition: background 0.15s ease; }
        .today-lesson:hover { background: #e3f2fd; }
        .today-lesson-num { width: 32px; height: 32px; background: #e3f2fd; color: #1976d2; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .today-lesson-info { min-width: 0; }
        .today-lesson-subject { font-size: 14px; font-weight: 700; color: #1a2b4a; }
        .today-lesson-meta { font-size: 12px; color: #7a8aa3; margin-top: 2px; }
        .today-lesson-topic { font-size: 12px; color: #334155; margin-top: 4px; line-height: 1.4; }
        .today-lesson-topic b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
        .today-lesson-hw { font-size: 12px; color: #1e40af; margin-top: 4px; line-height: 1.4; }
        .today-lesson-hw b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }

        .today-lesson-grade { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 400; font-size: 17px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        .today-lesson-grade.g5, .today-lesson-grade.g4 { background: #65A30D; }
        .today-lesson-grade.g3 { background: #FB923C; }
        .today-lesson-grade.g2, .today-lesson-grade.g1 { background: #DC2626; }
        .today-lesson-grade.gn { background: #94A3B8; }
        .today-lesson-grade.no-grade { background: #e2e8f0; color: #94a3b8; box-shadow: none; }

        /* ===== ДНЕВНИК ===== */
        .week-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .week-title { font-size: 20px; font-weight: 700; color: #1a2b4a; }
        .week-range { font-size: 13px; color: #7a8aa3; margin-top: 2px; }
        .week-badge { background: #e3f2fd; color: #1976d2; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }

        .week-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .week-grid::-webkit-scrollbar { height: 10px; }
        .week-grid::-webkit-scrollbar-track { background: #eef2f8; border-radius: 5px; }
        .week-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }

        .day-column { flex: 0 0 250px; min-width: 250px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; overflow: hidden; display: flex; flex-direction: column; scroll-snap-align: start; }
        .day-column.today { border: 2px solid #1976d2; box-shadow: 0 4px 16px rgba(25,118,210,0.18); }

        .day-header { background: linear-gradient(135deg, #1976d2, #2196f3); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .day-column.today .day-header { background: linear-gradient(135deg, #0d47a1, #1976d2); }
        .day-header-left { display: flex; flex-direction: column; gap: 2px; }
        .day-name { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .day-date { font-size: 11px; color: rgba(255,255,255,0.85); }
        .day-today-badge { background: #fff; color: #1976d2; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; letter-spacing: 0.3px; }

        .day-body { padding: 10px 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .lesson-card { background: #f8fafc; border-radius: 10px; padding: 10px 12px; border-left: 3px solid #90caf9; position: relative; cursor: pointer; transition: background 0.15s ease; }
        .lesson-card:hover { background: #e3f2fd; }
        .lesson-card.empty { background: transparent; border-left: 3px dashed #e2e8f0; padding: 6px 12px; cursor: default; }
        .lesson-card.empty:hover { background: transparent; }
        .lesson-card.empty .lesson-subject { color: #cbd5e1; font-weight: 400; font-style: italic; font-size: 12px; }

        .lesson-row-head { display: flex; align-items: flex-start; gap: 8px; padding-right: 34px; }
        .lesson-num { width: 20px; height: 20px; background: #e3f2fd; color: #1976d2; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
        .lesson-subject { font-size: 13px; font-weight: 700; color: #1a2b4a; line-height: 1.3; }
        .lesson-meta { font-size: 11px; color: #7a8aa3; margin-top: 3px; line-height: 1.4; }
        .lesson-section { margin-top: 6px; font-size: 11.5px; line-height: 1.45; }
        .lesson-label { font-weight: 700; color: #7a8aa3; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
        .lesson-value { color: #334155; }
        .lesson-value.hw { color: #1e40af; }

        .lesson-grade { position: absolute; top: 8px; right: 8px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 400; font-size: 14px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.12); line-height: 1; }
        .lesson-grade.g5, .lesson-grade.g4 { background: #65A30D; }
        .lesson-grade.g3 { background: #FB923C; }
        .lesson-grade.g2, .lesson-grade.g1 { background: #DC2626; }
        .lesson-grade.gn { background: #94A3B8; }
        .lesson-grade.no-grade { background: #e2e8f0; color: #94a3b8; font-weight: 400; font-size: 12px; box-shadow: none; }

        /* ===== ОЦЕНКИ — ТАБЛИЦА ===== */
        .period-tabs-wrapper { margin-bottom: 16px; }
        .period-tabs-group { display: inline-flex; align-items: center; gap: 0; padding: 4px; background: #fff; border: 1px solid #CBD5E1; border-radius: 10px; flex-wrap: wrap; }
        .tab-pill { padding: 8px 16px; background: transparent; color: #64748B; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; user-select: none; border: 1px solid transparent; font-family: inherit; white-space: nowrap; transition: all 0.15s ease; line-height: 1.2; }
        .tab-pill:hover { background: #F1F5F9; color: #334155; }
        .tab-pill.active { background: linear-gradient(135deg, #1976d2, #2196f3); color: #fff; box-shadow: 0 2px 8px rgba(25,118,210,0.3); }
        .tab-pill:disabled { cursor: default; opacity: 0.7; }

        .grades-table-wrapper { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; overflow: hidden; }
        .grades-table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
        .grades-table th { background: #f8fafc; color: #475569; font-weight: 700; font-size: 11px; padding: 14px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.3px; }
        .grades-table th.center { text-align: center; }
        .grades-table td { padding: 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; font-size: 13.5px; }
        .grades-table tbody tr:last-child td { border-bottom: none; }
        .grades-table tbody tr:hover { background: #fafcff; }
        .grades-table td.subject-cell { font-weight: 700; color: #1e293b; font-size: 14px; }
        .grades-flex-inner { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-start; }
        .grades-table td.avg-cell { text-align: center; font-weight: 700; color: #65A30D; font-size: 15px; }
        .grades-table td.avg-cell.no-grade { color: #94a3b8; font-weight: 400; }
        .grades-table td.qtr-cell { text-align: center; }
        .no-grades-text { color: #94a3b8; font-style: italic; font-size: 13px; font-weight: 400; }

        .mini-grade { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 5px; font-weight: 500; font-size: 13px; color: #fff; cursor: pointer; transition: transform 0.12s ease; line-height: 1; padding: 0; text-align: center; font-family: inherit; }
        .mini-grade:hover { transform: scale(1.12); }
        .mini-grade.g5, .mini-grade.g4 { background: #65A30D; }
        .mini-grade.g3 { background: #FB923C; }
        .mini-grade.g2, .mini-grade.g1 { background: #DC2626; }
        .mini-grade.gn { background: #94A3B8; }
        .mini-grade:not([data-subject]) { cursor: default; }
        .mini-grade:not([data-subject]):hover { transform: none; }

        .qtr-grade { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 500; font-size: 15px; color: #fff; line-height: 1; }
        .qtr-grade.g5, .qtr-grade.g4 { background: #65A30D; }
        .qtr-grade.g3 { background: #FB923C; }
        .qtr-grade.g2, .qtr-grade.g1 { background: #DC2626; }
        .qtr-grade.gn { background: #94A3B8; }
        .qtr-grade.no-grade { background: transparent; color: #94a3b8; font-weight: 400; }

        /* ===== СТРАНИЦА УРОКА ===== */
        .lesson-page { background: #fff; border-radius: 14px; padding: 32px 36px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; max-width: 1100px; margin: 0 auto; }
        .lesson-page-title { font-size: 26px; font-weight: 400; color: #1976d2; margin-bottom: 24px; }
        .lesson-section-title { font-size: 15px; font-weight: 700; color: #475569; margin-top: 24px; margin-bottom: 10px; }
        .lesson-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
        .lesson-details-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px 24px; }
        .lesson-detail-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eef2f8; font-size: 14px; }
        .lesson-detail-row:last-child { border-bottom: none; }
        .lesson-detail-label { color: #64748b; }
        .lesson-detail-value { color: #1e293b; font-weight: 600; }
        .lesson-detail-value.blue { color: #1976d2; }
        .lesson-empty-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; text-align: center; color: #94a3b8; font-size: 14px; }
        .lesson-teacher-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 14px; }
        .lesson-teacher-avatar { width: 52px; height: 52px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 26px; }
        .lesson-teacher-name { color: #16a34a; font-weight: 600; font-size: 14px; line-height: 1.3; }
        .lesson-grades-table { width: 100%; border-collapse: collapse; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .lesson-grades-table th { padding: 10px 16px; font-size: 12px; color: #64748b; font-weight: 700; text-align: right; background: #f8fafc; text-transform: uppercase; }
        .lesson-grades-table td { padding: 12px 16px; font-size: 14px; color: #1e293b; border-top: 1px solid #e2e8f0; text-align: right; }
        .lesson-grades-table td:first-child { text-align: left; }

        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #1976d2; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 18px; background: none; border: none; font-family: inherit; padding: 0; }
        .back-link:hover { text-decoration: underline; }
        .back-link svg { width: 14px; height: 14px; fill: currentColor; }

        /* ===== МОДАЛКА СТАТИСТИКИ ===== */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26, 43, 74, 0.5); backdrop-filter: blur(4px); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }

        @media (max-width: 900px) {

        @media (max-width: 700px) {

<script src="supabase-config.js"></script>
<script>
    const DAYS_KEYS   = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const DAYS_RU     = { mon: 'Пн', tue: 'Вт', wed: 'Ср', thu: 'Чт', fri: 'Пт', sat: 'Сб' };
    const DAYS_FULL   = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье' };

    const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    const PERIOD_LABELS = {

        'Полугодия': ['I полугодие', 'II полугодие'],
        'Триместры': ['I триместр', 'II триместр', 'III триместр'],
        'Семестры':  ['I семестр', 'II семестр']
    };

    const SUB_TABS = {
        education: [
            { id: 'today',  label: 'Сегодня',   icon: '<path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>' },
            { id: 'diary',  label: 'Дневник',   icon: '<path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>' },
            { id: 'grades', label: 'Оценки',    icon: '<path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/>' }
        ],
        communication: [
            { id: 'chats',   label: 'Чаты',      icon: '<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>' },
            { id: 'news',    label: 'Новости',   icon: '<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>' },
            { id: 'support', label: 'Поддержка', icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>' }
        ],
        apps: [
            { id: 'library',  label: 'Библиотека', icon: '<path d="M4 6h2v14H4zM6 6h2v14H6zM8 6h2v14H8zM12 4l8 16h-2L11 6z"/>' },
            { id: 'olymp',    label: 'Олимпиады',  icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>' },
            { id: 'courses',  label: 'Курсы',      icon: '<path d="M4 6h16v2H4zM4 10h16v2H4zM4 14h10v2H4z"/>' },
            { id: 'settings', label: 'Настройки',  icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>' }
        ]
    };

    let CURRENT_STUDENT = null;
    let CURRENT_CLASS = null;
    let ALL_SUBJECTS = [];
    let ALL_TEACHERS = [];
    let ALL_WORKLOADS = [];
    let ALL_JOURNALS = [];
    let ALL_STUDENTS = [];
    let CLASS_STUDENT_IDS = [];
    let CURRENT_SCHEDULE = null;
    let ALL_ROOMS = [];
    let PERIODS = [];
    let PERIOD_SYSTEM = '';
    let ACTIVE_PERIOD_INDEX = 0;
    let TODAY_DATE = new Date(); TODAY_DATE.setHours(0, 0, 0, 0);
    let ACTIVE_TOP_TAB = 'education';
    let ACTIVE_SUB_TAB = 'today';

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }
    function formatDateRu(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
    function formatDateLong(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
    function formatDateShort(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`; }
    function formatDateHuman(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
    function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function parseKey(key) {
        const parts = String(key).split('_');
        const datePart = parts[0];
        const lessonPart = parts[1] || '';
        const d = new Date(datePart + 'T00:00:00');
        return { date: isNaN(d.getTime()) ? null : d, dateRu: isNaN(d.getTime()) ? datePart : formatDateRu(d), lesson: lessonPart };
    }
    function gradeClass(grade) {
        const g = String(grade).trim().replace(/[НОБП]|СП/gi, '').trim();
        if (g === '5' || g === '4') return 'g5';
        if (g === '3') return 'g3';
        if (g === '2' || g === '1') return 'g2';
        return 'gn';
    }
    function calcAverage(gradesMap) {
        let sum = 0, cnt = 0;
        Object.values(gradesMap || {}).forEach(raw => {
            const val = String(raw || '').toUpperCase().trim();
            if (!val) return;
            const cleaned = val.replace(/[НОБП]|СП/g, '').trim();
            if (!cleaned) return;
            if (cleaned.includes('/')) {
                cleaned.split('/').forEach(p => { const n = parseInt(p); if (!isNaN(n)) { sum += n; cnt++; } });
            } else {
                const n = parseInt(cleaned); if (!isNaN(n)) { sum += n; cnt++; }
            }
        });
        return cnt === 0 ? null : (sum / cnt).toFixed(2).replace(/\.00$/, '');
    }
    function plural(n, forms) {
        const a = Math.abs(n) % 100;
        const b = a % 10;
        if (a > 10 && a < 20) return forms[2];
        if (b > 1 && b < 5) return forms[1];
        if (b === 1) return forms[0];
        return forms[2];
    }
    function getMondayOfCurrentWeek() {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const dow = today.getDay();
        const diff = (dow === 0 ? -6 : 1 - dow);
        const monday = new Date(today);
        monday.setDate(today.getDate() + diff);
        return monday;
    }
    function showToast(message) { console.log('[toast]', message); }

    function initTopTabs() {
        document.querySelectorAll('.top-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                const topId = btn.dataset.toptab;
                document.querySelectorAll('.top-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                ACTIVE_TOP_TAB = topId;
                renderSubTabs();
            });
        });
        renderSubTabs();
    }
    function renderSubTabs() {
        const container = document.getElementById('subHeaderInner');
        container.innerHTML = '';
        const items = SUB_TABS[ACTIVE_TOP_TAB] || [];
        items.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'sub-tab' + (item.id === ACTIVE_SUB_TAB ? ' active' : '');
            btn.innerHTML = `<svg viewBox="0 0 24 24">${item.icon}</svg>${escapeHtml(item.label)}`;
            btn.dataset.subtab = item.id;
            btn.addEventListener('click', () => switchSubTab(item.id));
            container.appendChild(btn);
        });
        if (items.length > 0 && !items.some(i => i.id === ACTIVE_SUB_TAB)) switchSubTab(items[0].id);
        else switchSubTab(ACTIVE_SUB_TAB);
    }
    function switchSubTab(subTabId) {
        ACTIVE_SUB_TAB = subTabId;
        document.querySelectorAll('.sub-tab').forEach(b => b.classList.toggle('active', b.dataset.subtab === subTabId));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById('panel-' + subTabId);
        if (panel) panel.classList.add('active');
        const meta = (SUB_TABS[ACTIVE_TOP_TAB] || []).find(i => i.id === subTabId);
        document.getElementById('pageTitle').textContent = meta ? meta.label : 'Кабинет';
        document.getElementById('lessonPage').style.display = 'none';
        document.getElementById('infoBanner').style.display = '';
        if (subTabId === 'today') renderToday();
        if (subTabId === 'diary') renderDiary();
        if (subTabId === 'grades') { renderWarnings(); renderPeriodTabs(); renderGradesTable(); }
    }

    async function logout() {
        if (!confirm('Выйти из кабинета?')) return;
        try { const fb = await window._fbReady; await fb.signOut(fb.auth); } catch (e) {}
        try { localStorage.removeItem('sj_session'); } catch (e) {}
        window.location.replace('index.html');
    }

    window.addEventListener('load', async () => {
        try {
            const fb = await window._fbReady;
            const user = await new Promise((resolve) => {
                const unsub = fb.onAuthStateChanged(fb.auth, (u) => { unsub(); resolve(u); });
            });
            if (!user) { window.location.replace('index.html'); return; }
            const login = user.email.split('@')[0];
            const students = await DB.getAll('students');
            const student = students.find(s => s.login === login);
            if (!student) {
                const admins = await DB.getAll('admins');
                if (admins.some(a => a.id === user.uid)) { window.location.replace('admin.html'); return; }
                const teachers = await DB.getAll('teachers');
                if (teachers.some(t => t.login === login)) { window.location.replace('teacher.html'); return; }
                window.location.replace('index.html'); return;
            }
            CURRENT_STUDENT = student;
            const shortName = student.full_name.split(' ').slice(0, 2).join(' ');
            document.getElementById('userName').textContent = shortName;
            const initials = student.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
            await loadAll();
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('infoBanner').innerHTML = `
                <div class="info-banner-item"><div class="info-banner-label">ФИО</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.full_name)}</div></div>
                <div class="info-banner-item"><div class="info-banner-label">Класс</div><div class="info-banner-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div></div>
                <div class="info-banner-item"><div class="info-banner-label">Логин</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.login)}</div></div>
            `;
            initTopTabs();
        } catch (err) {
            console.error('Ошибка инициализации:', err);
            document.getElementById('loadingText').textContent = 'Ошибка загрузки. Проверьте консоль.';
        }
    });

    async function loadAll() {
        const [classes, subjects, teachers, workloads, journals, students, schedules, rooms, periodDocs] = await Promise.all([
            DB.getAll('classes'), DB.getAll('subjects'), DB.getAll('teachers'),
            DB.getAll('workloads'), DB.getAll('journals'), DB.getAll('students'),
            DB.getAll('class_schedules'), DB.getAll('rooms'), DB.getAll('educational_periods')
        ]);
        ALL_STUDENTS = students;
        ALL_ROOMS = rooms;
        CURRENT_CLASS = classes.find(c => c.id === CURRENT_STUDENT.class_id) || null;
        ALL_SUBJECTS = subjects;
        ALL_TEACHERS = teachers;
        ALL_WORKLOADS = workloads.filter(w => w.class_id === CURRENT_STUDENT.class_id);
        ALL_JOURNALS = journals.filter(j => j.class_id === CURRENT_STUDENT.class_id);
        const journalsWithOurStudent = journals.filter(j =>
            j.grades && j.grades[CURRENT_STUDENT.id] && Object.keys(j.grades[CURRENT_STUDENT.id]).length > 0
        );
        if (journalsWithOurStudent.length > 0) ALL_JOURNALS = journalsWithOurStudent;
        CLASS_STUDENT_IDS = ALL_STUDENTS.filter(s => s.class_id === CURRENT_STUDENT.class_id).map(s => s.id);
        const classSchedules = schedules.filter(s => s.class_id === CURRENT_STUDENT.class_id);
        const mergedGrid = {};
        classSchedules.forEach(s => {
            if (!s.grid) return;
            Object.entries(s.grid).forEach(([day, lessons]) => {
                if (!mergedGrid[day]) mergedGrid[day] = {};
                Object.entries(lessons || {}).forEach(([num, lesson]) => {
                    if (lesson && lesson.subject && !mergedGrid[day][num]) mergedGrid[day][num] = lesson;
                });
            });
        });
        CURRENT_SCHEDULE = Object.keys(mergedGrid).length > 0 ? { grid: mergedGrid } : null;
        const periodDoc = periodDocs[0] || null;
        PERIODS = periodDoc ? (periodDoc.periods || []) : [];
        PERIOD_SYSTEM = periodDoc ? (periodDoc.system || '') : '';
        ACTIVE_PERIOD_INDEX = findActivePeriodIndex();
    }
    function findActivePeriodIndex() {
        if (PERIODS.length === 0) return 0;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        for (let i = 0; i < PERIODS.length; i++) {
            const per = PERIODS[i];
            const start = new Date(per.start + 'T00:00:00');
            const end = new Date(per.end + 'T23:59:59');
            if (today >= start && today <= end) return i;
        }
        return 0;
    }

    function renderPeriodTabs() {
        const container = document.getElementById('periodTabs');

            const tab = document.createElement('button');
            tab.type = 'button'; tab.className = 'tab-pill active';

            tab.style.cursor = 'default'; container.appendChild(tab); return;

        const labels = PERIOD_LABELS[PERIOD_SYSTEM] || [];
        PERIODS.forEach((p, idx) => {

            tab.type = 'button';

            tab.textContent = labels[idx] || ('Период ' + (idx + 1));

            tab.addEventListener('click', () => { ACTIVE_PERIOD_INDEX = idx; renderPeriodTabs(); renderGradesTable(); });

    function collectAllStudentGrades() {
        const result = [];
        ALL_JOURNALS.forEach(journal => {
            const sg = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            const subjObj = ALL_SUBJECTS.find(s => s.id === journal.subject_id);
            if (!subjObj) return;
            Object.entries(sg).forEach(([key, val]) => {
                if (val === '' || val === null || val === undefined) return;
                const parsed = parseKey(key);
                const type = (journal.lesson_types && journal.lesson_types[key]) || DEFAULT_LESSON_TYPE;
                result.push({ subject: subjObj.name, subjectId: subjObj.id, grade: String(val), key, date: parsed.date, dateRu: parsed.dateRu, lesson: parsed.lesson, type, journalId: journal.id });
            });
        });
        return result;
    }

    function getLessonsForDate(date) {
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
        const dow = date.getDay();
        const dowKey = JS_DAY_MAP[dow];
        if (!dowKey) return [];
        const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
        const nums = Object.keys(dayGrid).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
        if (nums.length === 0) return [];
        const maxNum = Math.max(...nums);
        const all = collectAllStudentGrades();
        const result = [];
        for (let n = 1; n <= maxNum; n++) {
            const lesson = dayGrid[n] || dayGrid[String(n)];
            if (!lesson || !lesson.subject) continue;
            let teacherName = lesson.teacherName || '';
            if (!teacherName && lesson.teacherId) { const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId); if (t) teacherName = t.full_name; }
            let roomName = lesson.roomName || '';
            if (!roomName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) roomName = r.number + (r.name ? ' (' + r.name + ')' : ''); }
            const key = isoDate(date) + '_' + n;
            let topic = '', homework = '';
            const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
            if (subjObj) {
                const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                if (journal && journal.lessons && journal.lessons[key]) { topic = journal.lessons[key].t || ''; homework = journal.lessons[key].h || ''; }
            }
            const gradeRec = all.find(g => g.subject === lesson.subject && g.key === key);
            result.push({ num: n, subject: lesson.subject, teacherName, roomName, topic, homework, grade: gradeRec ? gradeRec.grade : null });
        }
        return result;
    }

    function shiftDay(delta) {
        const next = new Date(TODAY_DATE);
        next.setDate(next.getDate() + delta);
        TODAY_DATE = next;
        renderToday();
    }

                let roomName = lesson.roomName || '';
                if (!roomName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) roomName = r.number + (r.name ? ' (' + r.name + ')' : ''); }
                const key = isoDate(date) + '_' + n;
                let topic = '', homework = '';
                const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
                if (subjObj) {
                    const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                    if (journal && journal.lessons && journal.lessons[key]) { topic = journal.lessons[key].t || ''; homework = journal.lessons[key].h || ''; }
                }
                const gradeRec = all.find(g => g.subject === lesson.subject && g.key === key);
                const gradeVal = gradeRec ? gradeRec.grade : null;
                let gradeHtml = gradeVal ? `<div class="lesson-grade ${gradeClass(gradeVal)}">${escapeHtml(gradeVal)}</div>` : `<div class="lesson-grade no-grade">—</div>`;
                const metaParts = [];

                const topicHtml = topic ? `<div class="lesson-section"><span class="lesson-label">Тема:</span><span class="lesson-value">${escapeHtml(topic)}</span></div>` : '';
                const hwHtml = homework ? `<div class="lesson-section"><span class="lesson-label">ДЗ:</span><span class="lesson-value hw">${escapeHtml(homework)}</span></div>` : '';
                lessonsHtml += `<div class="lesson-card" data-subject="${escapeHtml(lesson.subject)}" data-date="${isoDate(date)}" data-num="${n}">

    function getPeriodRange() {
        if (PERIODS.length === 0 || !PERIODS[ACTIVE_PERIOD_INDEX]) return null;
        const p = PERIODS[ACTIVE_PERIOD_INDEX];
        return { start: new Date(p.start + 'T00:00:00'), end: new Date(p.end + 'T23:59:59') };
    }
    function renderGradesTable() {
        const container = document.getElementById('gradesTableContainer');
        if (ALL_WORKLOADS.length === 0) { container.innerHTML = `<div class="empty-state"><h3>У класса нет предметов</h3><p>Обратитесь к администратору.</p></div>`; return; }
        const range = getPeriodRange();
        const all = collectAllStudentGrades();
        const seen = new Set();
        const subjects = [];
        ALL_WORKLOADS.forEach(w => { if (seen.has(w.subject)) return; seen.add(w.subject); subjects.push(w.subject); });
        subjects.sort((a, b) => a.localeCompare(b, 'ru'));
        const periodLabel = PERIODS.length > 0 ? ((PERIOD_LABELS[PERIOD_SYSTEM] || [])[ACTIVE_PERIOD_INDEX] || 'Итог') : 'Итог';
        let html = '<div class="grades-table-wrapper"><table class="grades-table">';
        html += '<colgroup><col style="width:34%"><col style="width:46%"><col style="width:10%"><col style="width:10%"></colgroup>';
        html += '<thead><tr><th>Предмет</th><th>Оценки</th><th class="center">Ср. балл</th><th class="center">' + escapeHtml(periodLabel) + '</th></tr></thead><tbody>';
        subjects.forEach(subjectName => {
            let gradesArr = all.filter(g => g.subject === subjectName);
            if (range) gradesArr = gradesArr.filter(g => !g.date || (g.date >= range.start && g.date <= range.end));
            gradesArr.sort((a, b) => a.key.localeCompare(b.key));
            const gradesMap = {};
            gradesArr.forEach(g => { gradesMap[g.key] = g.grade; });
            const avg = calcAverage(gradesMap);
            const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
            const journal = subjObj ? ALL_JOURNALS.find(j => j.subject_id === subjObj.id) : null;
            const qtrGrades = journal && journal.qtr_grades ? (journal.qtr_grades[CURRENT_STUDENT.id] || {}) : {};
            const periodQtr = qtrGrades[ACTIVE_PERIOD_INDEX] || qtrGrades[String(ACTIVE_PERIOD_INDEX)] || null;
            html += '<tr>';
            html += `<td class="subject-cell">${escapeHtml(subjectName)}</td>`;
            if (gradesArr.length === 0) html += '<td><span class="no-grades-text">Нет выставленных оценок</span></td>';
            else {
                html += '<td><div class="grades-flex-inner">';
                gradesArr.forEach(g => {
                    const cls = gradeClass(g.grade);
                    const isNumeric = /^[1-5]$/.test(g.grade.trim());
                    html += `<span class="mini-grade ${cls}" ${isNumeric ? `data-subject="${escapeHtml(g.subject)}" data-key="${escapeHtml(g.key)}"` : ''}>${escapeHtml(g.grade)}</span>`;
                });
                html += '</div></td>';
            }
            html += avg !== null ? `<td class="avg-cell">${escapeHtml(String(avg))}</td>` : '<td class="avg-cell no-grade">-</td>';
            if (periodQtr) html += `<td class="qtr-cell"><span class="qtr-grade ${gradeClass(periodQtr)}">${escapeHtml(String(periodQtr))}</span></td>`;
            else html += '<td class="qtr-cell"><span class="qtr-grade no-grade">-</span></td>';
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
        container.querySelectorAll('.mini-grade[data-subject]').forEach(box => {
            box.addEventListener('click', () => { openStats(box.dataset.subject, box.dataset.key); });
        });
    }

        const lessonData = (journal && journal.lessons && journal.lessons[lessonKey]) || null;
        const gradeVal = (journal && journal.grades && journal.grades[CURRENT_STUDENT.id] && journal.grades[CURRENT_STUDENT.id][lessonKey]) || null;
        const lessonType = (journal && journal.lesson_types && journal.lesson_types[lessonKey]) || DEFAULT_LESSON_TYPE;

                    <div class="lesson-section-title">Оценки за работу на занятии</div>
                    <table class="lesson-grades-table"><thead><tr><th>Оценка</th></tr></thead><tbody><tr><td>${escapeHtml(gradeTypeFull)}</td><td>${gradeDisplay}</td></tr></tbody></table>

                </div>
            </div>`;
    }
    function getLessonTypeFullName(abbr) {
        const map = { 'ОТВ': 'Ответ на уроке', 'К/Р': 'Контрольная работа', 'С/Р': 'Самостоятельная работа', 'Д': 'Диктант', 'СОЧ': 'Сочинение', 'И': 'Изложение', 'Тест': 'Тест', 'ПР': 'Проверочная работа', 'Л/Р': 'Лабораторная работа', 'Пр-т': 'Проект', 'РЕФ': 'Реферат', 'Зчт': 'Зачет', 'ДОК': 'Доклад', 'Р/У': 'Работа на уроке', 'РНО': 'Работа над ошибками', 'О': 'Опрос', 'Д/Р': 'Домашняя работа', 'УС': 'Устный счет', 'Наиз': 'Наизусть', 'ЧИТ': 'Чтение' };
        return map[abbr] || abbr;
    }
    function closeLessonPage() {
        document.getElementById('lessonPage').style.display = 'none';
        document.getElementById('infoBanner').style.display = '';
        switchSubTab(ACTIVE_SUB_TAB);
    }

    function openStats(subjectName, lessonKey) {
        const journal = ALL_JOURNALS.find(j => {
            const subjObj = ALL_SUBJECTS.find(s => s.id === j.subject_id);
            return subjObj && subjObj.name === subjectName;
        });
        const modal = document.getElementById('statsModal');
        const title = document.getElementById('statsTitle');
        const subtitle = document.getElementById('statsSubtitle');
        const list = document.getElementById('statsList');
        const total = document.getElementById('statsTotal');
        const parsed = parseKey(lessonKey);
        title.textContent = subjectName;
        subtitle.textContent = `${parsed.dateRu} · ${parsed.lesson}-й урок`;
        if (!journal) { list.innerHTML = '<div class="stats-empty">Статистика недоступна.</div>'; total.textContent = ''; modal.classList.add('show'); return; }
        const gradesAll = journal.grades || {};
        const counters = { '5': 0, '4': 0, '3': 0, '2': 0, '1': 0 };
        const validIds = new Set(CLASS_STUDENT_IDS);
        Object.entries(gradesAll).forEach(([studentId, studentGrades]) => {
            if (!validIds.has(studentId)) return;
            const val = studentGrades && studentGrades[lessonKey];
            if (val === undefined || val === null) return;
            const clean = String(val).trim().toUpperCase();
            if (counters[clean] !== undefined) counters[clean]++;
        });
        const totalCount = Object.values(counters).reduce((a, b) => a + b, 0);
        if (totalCount === 0) { list.innerHTML = '<div class="stats-empty">Пока нет оценок за этот урок.</div>'; total.textContent = ''; modal.classList.add('show'); return; }
        let html = '';
        ['5', '4', '3', '2', '1'].forEach(g => {
            const count = counters[g];
            const percent = totalCount > 0 ? Math.round((count / totalCount) * 100) : 0;
            const barWidth = percent > 0 ? Math.max(percent, 6) : 0;
            const cls = gradeClass(g);
            const word = plural(count, ['человек', 'человека', 'человек']);
            const barColor = (cls === 'g5') ? '#65A30D' : (cls === 'g3') ? '#FB923C' : (cls === 'g2') ? '#DC2626' : '#94A3B8';
            html += `<div class="stat-row"><div class="stat-badge ${cls}">${g}</div><div class="stat-bar-wrap"><div class="stat-bar" style="width:${barWidth}%;background:${barColor}">${percent > 15 ? percent + '%' : ''}</div></div><div class="stat-count">${count} <small>${word}</small></div></div>`;
        });
        list.innerHTML = html;
        total.textContent = `Всего оценок за урок: ${totalCount}`;
        modal.classList.add('show');
    }
    function closeStats() { document.getElementById('statsModal').classList.remove('show'); }
    document.getElementById('statsModal').addEventListener('click', (e) => { if (e.target.id === 'statsModal') closeStats(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeStats(); closeLessonPage(); } });
</script>
