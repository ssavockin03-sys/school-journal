<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сегодня — Дневник.ру</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #fff; }
        body { min-height: 100vh; color: #1a2b4a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; font-weight: 400; padding: 0; }

        .loading-screen { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; }
        .loading-screen.hidden { display: none; }
        .loading-box { background: #fff; border-radius: 24px; padding: 44px 40px; max-width: 420px; width: 100%; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); text-align: center; }
        .loading-spinner { width: 56px; height: 56px; border: 5px solid rgba(42,82,152,0.15); border-top-color: #2a5298; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: #5a6a85; font-weight: 500; }

        .app-shell { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

        .header { background: #fff; border-bottom: 1px solid #e0e0e0; }
        .header-inner { padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
        .logo { font-size: 22px; color: #007baf; }
        .logo-bold { font-weight: 700; }
        .logo-sub { color: #777; font-weight: 400; }
        .d-user-profile-zone { display: flex; align-items: center; gap: 40px; }
        .d-user-info { display: flex; flex-direction: column; align-items: flex-start; text-align: left; line-height: 1.3; }
        .d-user-name { font-size: 14px; font-weight: 700; color: #333; }
        .d-user-role { font-size: 12px; font-weight: 400; color: #888; }
        .d-user-actions { display: flex; flex-direction: column; align-items: flex-start; text-align: left; line-height: 1.3; }
        .d-action-link { font-size: 13px; color: #007baf; text-decoration: none; cursor: pointer; font-weight: 400; background: none; border: none; font-family: inherit; padding: 0; }
        .d-action-link:hover { text-decoration: underline; }
        .d-action-link.logout { color: #d9534f; }

        .d-top-blue-bar { background: #166a94; }
        .d-top-blue-inner { padding: 0; display: flex; }
        .d-nav-item { display: inline-block; padding: 12px 20px; color: #ffffff; text-decoration: none; cursor: pointer; font: 400 14px/1 inherit; border-bottom: 3px solid transparent; }
        .d-nav-item:hover { background: rgba(255,255,255,0.12); }
        .d-nav-item.active { background: #0f4f70; border-bottom-color: #ffffff; }

        .d-sub-menu-bar { background: #fff; border-bottom: 1px solid #e0e0e0; }
        .d-sub-menu-inner { padding: 0; display: flex; flex-wrap: wrap; }
        .d-sub-item { display: inline-block; padding: 10px 15px; color: #555; font: 400 13px/1 inherit; border-bottom: 3px solid transparent; cursor: pointer; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; text-decoration: none; }
        .d-sub-item:hover { color: #1d82b5; }
        .d-sub-item.active { color: #1d82b5; border-bottom-color: #1d82b5; font-weight: 500; }

        .school-bar { padding: 14px 0 0; }
        .school-name { font-size: 13px; color: #7a8aa3; margin-bottom: 2px; }
        .page-title { font-size: 28px; font-weight: 400; color: #1976d2; margin-bottom: 12px; }

        .container { padding: 0 0 60px; }

        .info-banner { background: #fff; border-radius: 12px; padding: 14px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; margin: 16px 0 20px; display: flex; flex-wrap: wrap; gap: 24px; }
        .info-banner-item { display: flex; flex-direction: column; gap: 3px; }
        .info-banner-label { font-size: 11px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-banner-value { font-size: 14px; font-weight: 600; color: #1a2b4a; }

        .grades-strip-label { font-size: 12px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
        .grades-strip { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
        .grade-tile { width: 78px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; transition: transform 0.15s ease; }
        .grade-tile:hover { transform: translateY(-2px); }
        .grade-tile:not([data-subject]) { cursor: default; }
        .grade-tile:not([data-subject]):hover { transform: none; }
        .grade-tile-box {
            position: relative;
            width: 58px; height: 48px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 28px; font-weight: 400; line-height: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            margin-bottom: 5px;
            overflow: hidden;
        }
        .grade-tile.g5 .grade-tile-box, .grade-tile.g4 .grade-tile-box { background: #65A30D; }
        .grade-tile.g3 .grade-tile-box { background: #FB923C; }
        .grade-tile.g2 .grade-tile-box, .grade-tile.g1 .grade-tile-box { background: #DC2626; }
        .grade-tile.gn .grade-tile-box { background: #94A3B8; }
        .grade-tile-subject { font-size: 11.5px; font-weight: 600; color: #1a2b4a; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78px; text-align: left; }
        .grade-tile-type { font-size: 10px; color: #94a3b8; line-height: 1.2; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78px; text-align: left; }
        .grades-hint { font-size: 12px; color: #b8720a; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .grades-hint::before { content: '👉'; }

        .grade-tile-icon {
            position: absolute;
            right: -8px; bottom: -8px;
            display: block; pointer-events: none;
            color: #fff; opacity: 0.6; line-height: 0;
        }
        .grade-tile-icon svg { width: 44px; height: 44px; display: block; }
        .grade-tile-value { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }

        .today-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; margin-bottom: 20px; overflow: hidden; }
        .today-card-inner { padding: 20px 22px; }
        .day-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid #eef2f8; }
        .day-nav-btn { width: 36px; height: 36px; border-radius: 50%; background: #f0f4f9; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
        .day-nav-btn:hover { background: #e3f2fd; }
        .day-nav-btn svg { width: 18px; height: 18px; fill: #1976d2; }
        .day-nav-title { font-size: 15px; font-weight: 700; color: #1a2b4a; text-align: center; flex: 1; }

        .day-empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .day-empty-emoji { font-size: 40px; margin-bottom: 12px; }
        .day-empty-title { font-size: 15px; font-weight: 700; color: #5a6a85; margin-bottom: 6px; }
        .day-empty-text { font-size: 13px; line-height: 1.5; max-width: 320px; margin: 0 auto; }

        .today-lessons { display: flex; flex-direction: column; gap: 10px; }
        .today-lesson { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: #f8fafc; border-radius: 10px; border-left: 4px solid #90caf9; cursor: pointer; transition: background 0.15s ease; }
        .today-lesson:hover { background: #e3f2fd; }
        .today-lesson-num { width: 32px; height: 32px; background: #e3f2fd; color: #1976d2; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .today-lesson-info { min-width: 0; }
        .today-lesson-subject { font-size: 14px; font-weight: 700; color: #1a2b4a; }
        .today-lesson-meta { font-size: 12px; color: #7a8aa3; margin-top: 2px; }
        .today-lesson-topic { font-size: 12px; color: #334155; margin-top: 4px; line-height: 1.4; }
        .today-lesson-topic b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }
        .today-lesson-hw { font-size: 12px; color: #1e40af; margin-top: 4px; line-height: 1.4; }
        .today-lesson-hw b { color: #7a8aa3; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3px; margin-right: 4px; }

        .today-lesson-grades { display: flex; gap: 5px; align-items: center; }
        .today-lesson-grade {
            position: relative;
            min-width: 50px; height: 40px;
            padding: 0 6px;
            border-radius: 9px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 400; font-size: 22px; color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .today-lesson-grade.g5, .today-lesson-grade.g4 { background: #65A30D; }
        .today-lesson-grade.g3 { background: #FB923C; }
        .today-lesson-grade.g2, .today-lesson-grade.g1 { background: #DC2626; }
        .today-lesson-grade.gn { background: #94A3B8; }
        .today-lesson-grade.no-grade { background: #e2e8f0; color: #94a3b8; box-shadow: none; font-size: 18px; }
        .today-lesson-grade .grade-tile-icon { right: -7px; bottom: -7px; }
        .today-lesson-grade .grade-tile-icon svg { width: 34px; height: 34px; }
        .today-lesson-grade .grade-tile-value { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }

        /* страница занятия */
        .lesson-page { background: #fff; border-radius: 14px; padding: 32px 36px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef2f8; max-width: 1100px; margin: 0 auto; }
        .lesson-page-title { font-size: 26px; font-weight: 400; color: #1976d2; margin-bottom: 24px; }
        .lesson-section-title { font-size: 15px; font-weight: 700; color: #475569; margin-top: 24px; margin-bottom: 10px; }
        .lesson-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
        .lesson-details-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px 24px; }
        .lesson-detail-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eef2f8; font-size: 14px; }
        .lesson-detail-row:last-child { border-bottom: none; }
        .lesson-detail-label { color: #64748b; }
        .lesson-detail-value { color: #1e293b; font-weight: 600; }
        .lesson-detail-value.blue { color: #1976d2; }
        .lesson-empty-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; text-align: center; color: #94a3b8; font-size: 14px; }
        .lesson-teacher-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 14px; }
        .lesson-teacher-avatar { width: 52px; height: 52px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 26px; }
        .lesson-teacher-name { color: #16a34a; font-weight: 600; font-size: 14px; line-height: 1.3; }
        .lesson-grades-table { width: 100%; border-collapse: collapse; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .lesson-grades-table th { padding: 10px 16px; font-size: 12px; color: #64748b; font-weight: 700; text-align: right; background: #f8fafc; text-transform: uppercase; }
        .lesson-grades-table td { padding: 12px 16px; font-size: 14px; color: #1e293b; border-top: 1px solid #e2e8f0; text-align: right; }
        .lesson-grades-table td:first-child { text-align: left; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #1976d2; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 18px; background: none; border: none; font-family: inherit; padding: 0; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .back-link svg { width: 14px; height: 14px; fill: currentColor; }

        @media (max-width: 900px) { .lesson-grid { grid-template-columns: 1fr; } }
        @media (max-width: 700px) { .app-shell { padding: 0 14px; } .header-inner { column-gap: 16px; } .page-title { font-size: 22px; } }
    </style>
</head>
<body>

<div class="loading-screen" id="loginScreen">
    <div class="loading-box">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Загружаем данные...</div>
    </div>
</div>

<div id="appContainer" style="display:none;">
    <div class="app-shell">
        <header class="header">
            <div class="header-inner">
                <div class="logo"><span class="logo-bold">Журнальчик</span><span class="logo-sub">.ру</span></div>
                <div class="d-user-profile-zone">
                    <div class="d-user-info">
                        <span class="d-user-name" id="userName">Ученик</span>
                        <span class="d-user-role" id="userRole">Ученик</span>
                    </div>
                    <div class="d-user-actions">
                        <button class="d-action-link" onclick="return false">Помощь</button>
                        <button class="d-action-link logout" onclick="logout()">Выход</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="d-top-blue-bar">
            <div class="d-top-blue-inner">
                <a href="#" class="d-nav-item active" onclick="return false">ОБРАЗОВАНИЕ</a>
                <a href="#" class="d-nav-item" onclick="return false">ОБЩЕНИЕ</a>
                <a href="#" class="d-nav-item" onclick="return false">ПРИЛОЖЕНИЯ</a>
            </div>
        </div>

        <div class="d-sub-menu-bar">
            <div class="d-sub-menu-inner">
                <a href="student.html"        class="d-sub-item active">Сегодня</a>
                <a href="student-diary.html"  class="d-sub-item">Дневник</a>
                <a href="student-grades.html" class="d-sub-item">Оценки</a>
            </div>
        </div>

        <div class="school-bar">
            <div class="school-name">ГОУ ЛНР «АСШ № 6»</div>
            <h1 class="page-title">Сегодня</h1>
        </div>

        <div class="container">
            <div class="info-banner" id="infoBanner"></div>
            <div id="todayContent"></div>
            <div id="lessonPage" style="display:none;"><div class="lesson-page" id="lessonPageContent"></div></div>
        </div>
    </div>
</div>

<script src="supabase-config.js"></script>
<script>
    const DAYS_FULL   = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье' };
    const JS_DAY_MAP  = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat' };
    const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const DEFAULT_LESSON_TYPE = 'ОТВ';

    const PROFILE_ICONS = {
        'Точные науки':
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="1.8"/><rect x="7" y="4" width="10" height="4.4" rx="0.6"/><rect x="7" y="10" width="4" height="2.6" rx="0.5"/><rect x="13" y="10" width="4" height="2.6" rx="0.5"/><rect x="7" y="13.4" width="4" height="2.6" rx="0.5"/><rect x="13" y="13.4" width="4" height="2.6" rx="0.5"/><rect x="7" y="16.8" width="4" height="2.6" rx="0.5"/><rect x="13" y="16.8" width="4" height="2.6" rx="0.5"/><rect x="7" y="20.2" width="4" height="1.4" rx="0.4"/><rect x="13" y="20.2" width="4" height="1.4" rx="0.4"/><path d="M14.4 11.3h1.2M15 10.7v1.2"/><path d="M14.4 14.7h1.2"/><path d="M14.4 17.6l1.2 1.2M15.6 17.6l-1.2 1.2"/></svg>',
        'Гуманитарные науки':
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5z"/><path d="M5 3v18"/><path d="M9 3v7l2-1.5L13 10V3"/><path d="M15 7h2M15 10h2M15 13h2"/></svg>',
        'Естественные науки':
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.4"/></svg>',
        'Спорт и искусство': ''
    };
    function profileIconHtml(subjectObj) {
        if (!subjectObj) return '';
        const dir = String(subjectObj.direction || subjectObj.profile || subjectObj.category || '').trim();
        const svg = PROFILE_ICONS[dir];
        if (!svg) return '';
        return '<span class="grade-tile-icon">' + svg + '</span>';
    }

    let CURRENT_STUDENT = null;
    let CURRENT_CLASS = null;
    let ALL_SUBJECTS = [];
    let ALL_TEACHERS = [];
    let ALL_JOURNALS = [];
    let ALL_STUDENTS = [];
    let CURRENT_SCHEDULE = null;
    let ALL_ROOMS = [];
    let TODAY_DATE = new Date(); TODAY_DATE.setHours(0, 0, 0, 0);

    function escapeHtml(text) { if (text === null || text === undefined) return ''; const div = document.createElement('div'); div.textContent = String(text); return div.innerHTML; }
    function formatDateRu(d) { return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
    function formatDateLong(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
    function formatDateHuman(d) { return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
    function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function parseKey(key) { const p = String(key).split('_'); const d = new Date(p[0] + 'T00:00:00'); return { date: isNaN(d.getTime()) ? null : d, dateRu: isNaN(d.getTime()) ? p[0] : formatDateRu(d), lesson: p[1] || '' }; }
    function parseCell(raw) { if (raw === null || raw === undefined || raw === '') return { grade: '', presence: '' }; const s = String(raw).toUpperCase().trim(); const m = s.match(/^(СП|Н|О|Б|П)/); let presence = ''; let grade = s; if (m) { presence = m[0]; grade = s.slice(presence.length).trim(); } return { grade, presence }; }
    function gradeClass(grade) { const s = String(grade == null ? '' : grade); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); if (c >= 49 && c <= 53) { const d = c - 48; if (d === 5 || d === 4) return 'g5'; if (d === 3) return 'g3'; if (d === 2 || d === 1) return 'g2'; } } return 'gn'; }
    function firstDigit(v) { const s = String(v == null ? '' : v); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); if (c >= 49 && c <= 53) return c - 48; } return null; }
    function isNumericGrade(v) { return firstDigit(v) !== null; }
    function getLessonTypeFullName(abbr) { const map = { 'ОТВ': 'Ответ на уроке', 'К/Р': 'Контрольная работа', 'С/Р': 'Самостоятельная работа', 'Д': 'Диктант', 'СОЧ': 'Сочинение', 'И': 'Изложение', 'Тест': 'Тест', 'ПР': 'Проверочная работа', 'Л/Р': 'Лабораторная работа', 'Пр-т': 'Проект', 'РЕФ': 'Реферат', 'Зчт': 'Зачет', 'ДОК': 'Доклад', 'Р/У': 'Работа на уроке', 'РНО': 'Работа над ошибками', 'О': 'Опрос', 'Д/Р': 'Домашняя работа', 'УС': 'Устный счет', 'Наиз': 'Наизусть', 'ЧИТ': 'Чтение' }; return map[abbr] || abbr; }

    async function logout() {
        if (!confirm('Выйти из кабинета?')) return;
        try { const fb = await window._fbReady; await fb.signOut(fb.auth); } catch (e) {}
        try { localStorage.removeItem('sj_session'); } catch (e) {}
        window.location.replace('index.html');
    }

    window.addEventListener('load', async () => {
        try {
            const fb = await window._fbReady;
            const user = await new Promise((resolve) => {
                const unsub = fb.onAuthStateChanged(fb.auth, (u) => { unsub(); resolve(u); });
            });
            if (!user) { window.location.replace('index.html'); return; }
            const login = user.email.split('@')[0];
            const students = await DB.getAll('students');
            const student = students.find(s => s.login === login);
            if (!student) { window.location.replace('index.html'); return; }
            CURRENT_STUDENT = student;
            document.getElementById('userName').textContent = student.full_name.split(' ').slice(0, 2).join(' ');
            await loadAll();
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('infoBanner').innerHTML = `
                <div class="info-banner-item"><div class="info-banner-label">ФИО</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.full_name)}</div></div>
                <div class="info-banner-item"><div class="info-banner-label">Класс</div><div class="info-banner-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div></div>
                <div class="info-banner-item"><div class="info-banner-label">Логин</div><div class="info-banner-value">${escapeHtml(CURRENT_STUDENT.login)}</div></div>`;
            renderToday();
        } catch (err) {
            console.error(err);
            document.getElementById('loadingText').textContent = 'Ошибка загрузки. Проверьте консоль.';
        }
    });

    async function loadAll() {
        const [classes, subjects, teachers, journals, students, schedules, rooms] = await Promise.all([
            DB.getAll('classes'), DB.getAll('subjects'), DB.getAll('teachers'),
            DB.getAll('journals'), DB.getAll('students'),
            DB.getAll('class_schedules'), DB.getAll('rooms')
        ]);
        ALL_STUDENTS = students;
        ALL_ROOMS = rooms;
        CURRENT_CLASS = classes.find(c => c.id === CURRENT_STUDENT.class_id) || null;
        ALL_SUBJECTS = subjects;
        ALL_TEACHERS = teachers;
        ALL_JOURNALS = journals.filter(j => j.class_id === CURRENT_STUDENT.class_id);
        const withData = journals.filter(j => j.grades && j.grades[CURRENT_STUDENT.id] && Object.keys(j.grades[CURRENT_STUDENT.id]).length > 0);
        if (withData.length > 0) ALL_JOURNALS = withData;
        const classSchedules = schedules.filter(s => s.class_id === CURRENT_STUDENT.class_id);
        const mergedGrid = {};
        classSchedules.forEach(s => {
            if (!s.grid) return;
            Object.entries(s.grid).forEach(([day, lessons]) => {
                if (!mergedGrid[day]) mergedGrid[day] = {};
                Object.entries(lessons || {}).forEach(([num, lesson]) => {
                    if (lesson && lesson.subject && !mergedGrid[day][num]) mergedGrid[day][num] = lesson;
                });
            });
        });
        CURRENT_SCHEDULE = Object.keys(mergedGrid).length > 0 ? { grid: mergedGrid } : null;
    }

    function collectAllStudentGrades() {
        const result = [];
        ALL_JOURNALS.forEach(journal => {
            const sg = (journal.grades && journal.grades[CURRENT_STUDENT.id]) || {};
            const subjObj = ALL_SUBJECTS.find(s => s.id === journal.subject_id);
            if (!subjObj) return;
            Object.entries(sg).forEach(([key, val]) => {
                if (val === '' || val === null || val === undefined) return;
                const parsed = parseKey(key);
                const type = (journal.lesson_types && journal.lesson_types[key]) || DEFAULT_LESSON_TYPE;
                const cell = parseCell(val);
                const base = { subject: subjObj.name, subjectObj: subjObj, key, date: parsed.date, dateRu: parsed.dateRu, lesson: parsed.lesson, type };
                if (cell.grade) result.push({ ...base, kind: 'grade', grade: cell.grade, presence: '' });
                if (cell.presence) result.push({ ...base, kind: 'presence', grade: '', presence: cell.presence });
            });
        });
        return result;
    }

    function renderToday() {
        const container = document.getElementById('todayContent');
        const date = TODAY_DATE;
        const dow = date.getDay();
        const dowKey = JS_DAY_MAP[dow] || 'sun';
        const dayName = DAYS_FULL[dowKey] || 'Воскресенье';
        const all = collectAllStudentGrades();
        const dayRecords = all.filter(g => g.date && isoDate(g.date) === isoDate(date));

        let gradesHtml = '';
        if (dayRecords.length > 0) {
            gradesHtml = `
                <div class="grades-strip-label">${formatDateHuman(date).toUpperCase()}</div>
                <div class="grades-strip">
                    ${dayRecords.map(g => {
                        const isGrade = g.kind === 'grade';
                        const cls = gradeClass(isGrade ? g.grade : g.presence);
                        const value = isGrade ? g.grade : g.presence;
                        const isNum = isGrade && isNumericGrade(g.grade);
                        const typeLabel = isGrade ? g.type : 'присутствие';
                        const icon = isGrade ? profileIconHtml(g.subjectObj) : '';
                        return `<div class="grade-tile ${cls}" ${isNum ? `data-subject="${escapeHtml(g.subject)}" data-key="${escapeHtml(g.key)}"` : ''}>
                            <div class="grade-tile-box">${icon}<span class="grade-tile-value">${escapeHtml(value)}</span></div>
                            <div class="grade-tile-subject">${escapeHtml(g.subject)}</div>
                            <div class="grade-tile-type">${escapeHtml(typeLabel)}</div>
                        </div>`;
                    }).join('')}
                </div>`;
        } else {
            gradesHtml = `<div class="grades-strip-label">${formatDateHuman(date).toUpperCase()}</div><div style="color:#94a3b8;font-size:13px;padding:8px 0 16px;">Оценок за этот день нет</div>`;
        }

        const dayLessons = getLessonsForDate(date);
        let lessonsHtml = '';
        if (dayLessons.length === 0) {
            const isWeekend = dow === 0;
            lessonsHtml = `<div class="day-empty"><div class="day-empty-emoji">${isWeekend ? '☕' : '📅'}</div><div class="day-empty-title">${isWeekend ? 'Выходной день' : 'Нет занятий'}</div><div class="day-empty-text">${isWeekend ? 'Отдыхай и набирайся сил!' : 'На этот день уроков нет'}</div></div>`;
        } else {
            lessonsHtml = `<div class="today-lessons">${dayLessons.map(l => {
                let badges = '';
                if (l.presence) badges += `<div class="today-lesson-grade ${gradeClass(l.presence)}"><span class="grade-tile-value">${escapeHtml(l.presence)}</span></div>`;
                if (l.grade) { const icon = profileIconHtml(l.subjectObj); badges += `<div class="today-lesson-grade ${gradeClass(l.grade)}">${icon}<span class="grade-tile-value">${escapeHtml(l.grade)}</span></div>`; }
                if (!l.presence && !l.grade) badges = `<div class="today-lesson-grade no-grade">—</div>`;
                const metaParts = [];
                if (l.teacherName) metaParts.push(l.teacherName);
                if (l.roomName) metaParts.push('каб. ' + l.roomName);
                const metaHtml = metaParts.length ? `<div class="today-lesson-meta">${escapeHtml(metaParts.join(' · '))}</div>` : '';
                const topicHtml = l.topic ? `<div class="today-lesson-topic"><b>Тема:</b>${escapeHtml(l.topic)}</div>` : '';
                const hwHtml = l.homework ? `<div class="today-lesson-hw"><b>ДЗ:</b>${escapeHtml(l.homework)}</div>` : '';
                return `<div class="today-lesson" data-subject="${escapeHtml(l.subject)}" data-date="${isoDate(date)}" data-num="${l.num}">
                    <div class="today-lesson-num">${l.num}</div>
                    <div class="today-lesson-info"><div class="today-lesson-subject">${escapeHtml(l.subject)}</div>${metaHtml}${topicHtml}${hwHtml}</div>
                    <div class="today-lesson-grades">${badges}</div>
                </div>`;
            }).join('')}</div>`;
        }

        const dateLabel = `${date.getDate()} ${MONTHS_GEN[date.getMonth()]}, ${dayName.toLowerCase()}`;
        const isToday = isoDate(date) === isoDate(new Date());
        container.innerHTML = `
            <div class="today-card">
                <div class="today-card-inner">${gradesHtml}</div>
                <div class="day-nav">
                    <button class="day-nav-btn" onclick="shiftDay(-1)"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
                    <div style="flex:1;text-align:center;"><div class="day-nav-title">${dateLabel}${isToday ? ' · Сегодня' : ''}</div></div>
                    <button class="day-nav-btn" onclick="shiftDay(1)"><svg viewBox="0 0 24 24"><path d="M4 13h12.17l-5.59 5.59L12 20l8-8-8-8-1.41 1.41L16.17 11H4v2z"/></svg></button>
                </div>
                <div class="today-card-inner" style="padding-top:0;">${lessonsHtml}</div>
            </div>`;
        container.querySelectorAll('.today-lesson[data-subject]').forEach(row => {
            row.addEventListener('click', () => { openLessonPage(row.dataset.subject, row.dataset.date + '_' + row.dataset.num); });
        });
    }

    function getLessonsForDate(date) {
        if (!CURRENT_SCHEDULE || !CURRENT_SCHEDULE.grid) return [];
        const dowKey = JS_DAY_MAP[date.getDay()];
        if (!dowKey) return [];
        const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
        const nums = Object.keys(dayGrid).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
        if (!nums.length) return [];
        const maxNum = Math.max(...nums);
        const all = collectAllStudentGrades();
        const result = [];
        for (let n = 1; n <= maxNum; n++) {
            const lesson = dayGrid[n] || dayGrid[String(n)];
            if (!lesson || !lesson.subject) continue;
            let teacherName = lesson.teacherName || '';
            if (!teacherName && lesson.teacherId) { const t = ALL_TEACHERS.find(x => x.id === lesson.teacherId); if (t) teacherName = t.full_name; }
            let roomName = lesson.roomName || '';
            if (!roomName && lesson.roomId) { const r = ALL_ROOMS.find(x => x.id === lesson.roomId); if (r) roomName = r.number + (r.name ? ' (' + r.name + ')' : ''); }
            const key = isoDate(date) + '_' + n;
            let topic = '', homework = '';
            const subjObj = ALL_SUBJECTS.find(s => s.name === lesson.subject);
            if (subjObj) {
                const journal = ALL_JOURNALS.find(j => j.subject_id === subjObj.id);
                if (journal && journal.lessons && journal.lessons[key]) { topic = journal.lessons[key].t || ''; homework = journal.lessons[key].h || ''; }
            }
            const gradeRec = all.find(g => g.subject === lesson.subject && g.key === key && g.kind === 'grade');
            const presRec  = all.find(g => g.subject === lesson.subject && g.key === key && g.kind === 'presence');
            result.push({ num: n, subject: lesson.subject, subjectObj: subjObj || null, teacherName, roomName, topic, homework, grade: gradeRec ? gradeRec.grade : null, presence: presRec ? presRec.presence : null });
        }
        return result;
    }

    function shiftDay(delta) {
        const next = new Date(TODAY_DATE);
        next.setDate(next.getDate() + delta);
        TODAY_DATE = next;
        renderToday();
    }

    function openLessonPage(subjectName, lessonKey) {
        document.getElementById('todayContent').style.display = 'none';
        document.getElementById('infoBanner').style.display = 'none';
        document.getElementById('lessonPage').style.display = 'block';
        const container = document.getElementById('lessonPageContent');
        const subjObj = ALL_SUBJECTS.find(s => s.name === subjectName);
        const journal = subjObj ? ALL_JOURNALS.find(j => j.subject_id === subjObj.id) : null;
        const parsed = parseKey(lessonKey);
        const lessonData = (journal && journal.lessons && journal.lessons[lessonKey]) || null;
        const rawCell = (journal && journal.grades && journal.grades[CURRENT_STUDENT.id] && journal.grades[CURRENT_STUDENT.id][lessonKey]) || null;
        const parsedCell = parseCell(rawCell);
        const lessonType = (journal && journal.lesson_types && journal.lesson_types[lessonKey]) || DEFAULT_LESSON_TYPE;

        let teacherName = '—', roomName = '';
        if (CURRENT_SCHEDULE && parsed.date) {
            const dowKey = JS_DAY_MAP[parsed.date.getDay()];
            if (dowKey) {
                const dayGrid = CURRENT_SCHEDULE.grid[dowKey] || {};
                const lessonInGrid = dayGrid[parsed.lesson] || dayGrid[String(parsed.lesson)];
                if (lessonInGrid) {
                    if (lessonInGrid.teacherName) teacherName = lessonInGrid.teacherName;
                    else if (lessonInGrid.teacherId) { const t = ALL_TEACHERS.find(x => x.id === lessonInGrid.teacherId); if (t) teacherName = t.full_name; }
                    if (lessonInGrid.roomName) roomName = lessonInGrid.roomName;
                    else if (lessonInGrid.roomId) { const r = ALL_ROOMS.find(x => x.id === lessonInGrid.roomId); if (r) roomName = r.number + ' каб.'; }
                }
            }
        }
        const topic = lessonData ? (lessonData.t || '') : '';
        const homework = lessonData ? (lessonData.h || '') : '';
        let detailRows = '';
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Предмет:</div><div class="lesson-detail-value blue">${escapeHtml(subjectName)}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Дата:</div><div class="lesson-detail-value">${escapeHtml(formatDateLong(parsed.date))}, ${parsed.lesson} занятие</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Кто приходит:</div><div class="lesson-detail-value">${escapeHtml(CURRENT_CLASS ? CURRENT_CLASS.name : '—')}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Аудитория:</div><div class="lesson-detail-value">${escapeHtml(roomName || '—')}</div></div>`;
        detailRows += `<div class="lesson-detail-row"><div class="lesson-detail-label">Тема занятия:</div><div class="lesson-detail-value">${topic ? escapeHtml(topic) : '-'}</div></div>`;
        const gradeDisplay = parsedCell.grade ? escapeHtml(String(parsedCell.grade)) : 'нет';
        const presDisplay = parsedCell.presence ? escapeHtml(String(parsedCell.presence)) : '—';
        container.innerHTML = `
            <a class="back-link" href="student.html"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Назад</a>
            <div class="lesson-page-title">Страница занятия</div>
            <div class="lesson-grid">
                <div>
                    <div class="lesson-section-title" style="margin-top:0;">Детали занятия</div>
                    <div class="lesson-details-block">${detailRows}</div>
                    <div class="lesson-section-title">Присутствие на уроке</div>
                    <div class="lesson-details-block"><div class="lesson-detail-row"><div class="lesson-detail-label">Отметка:</div><div class="lesson-detail-value">${presDisplay}</div></div></div>
                    <div class="lesson-section-title">Домашние задания</div>
                    <div class="lesson-empty-block">${homework ? escapeHtml(homework) : 'На это занятие не задано ни одного домашнего задания.'}</div>
                    <div class="lesson-section-title">Оценки за работу на занятии</div>
                    <table class="lesson-grades-table"><thead><tr><th>Оценка</th></tr></thead><tbody><tr><td>${escapeHtml(getLessonTypeFullName(lessonType))}</td><td>${gradeDisplay}</td></tr></tbody></table>
                </div>
                <div>
                    <div class="lesson-section-title" style="margin-top:0;">Преподаватель</div>
                    <div class="lesson-teacher-card"><div class="lesson-teacher-avatar">👤</div><div class="lesson-teacher-name">${escapeHtml(teacherName)}</div></div>
                </div>
            </div>`;
    }
</script>
</body>
</html>
